<title>HBLT Troubleshooter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E8ECEF; --line:#CFD6DC; --line-strong:#9AA6B0;
  --ink:#1A222B; --ink-2:#4A5762; --ink-3:#6E7B86;
  --accent:#0E6F73; --accent-ink:#FFFFFF; --accent-soft:#D9EDEE;
  --warn:#B7791F; --warn-soft:#FBF1DC; --warn-ink:#6B4508;
  --ok:#2E7D4F; --ok-soft:#DDF0E4; --bad:#B3261E; --bad-soft:#F8E1DF;
  --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
  --r:6px;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181E; --surface:#1A232B; --surface-2:#232E37; --line:#34414C; --line-strong:#56656F;
    --ink:#E7ECF0; --ink-2:#B4BFC8; --ink-3:#8593A0;
    --accent:#4FB3B6; --accent-ink:#0B1A1B; --accent-soft:#163A3C;
    --warn:#E0A63A; --warn-soft:#3A2D12; --warn-ink:#F3D28A;
    --ok:#5FBF85; --ok-soft:#16321F; --bad:#E66A61; --bad-soft:#3E1C19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11181E; --surface:#1A232B; --surface-2:#232E37; --line:#34414C; --line-strong:#56656F;
  --ink:#E7ECF0; --ink-2:#B4BFC8; --ink-3:#8593A0;
  --accent:#4FB3B6; --accent-ink:#0B1A1B; --accent-soft:#163A3C;
  --warn:#E0A63A; --warn-soft:#3A2D12; --warn-ink:#F3D28A;
  --ok:#5FBF85; --ok-soft:#16321F; --bad:#E66A61; --bad-soft:#3E1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.hidden,[hidden]{display:none!important}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:.01em}
.brand .sub{font-size:.8rem;color:var(--ink-3)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;font-size:.85rem;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:disabled{color:var(--ink-3);cursor:not-allowed;background:var(--surface-2)}
.seg .tag{font-family:var(--mono);font-size:.62rem;margin-left:6px;opacity:.8}
.ctl{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-3)}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.picker{position:sticky;top:64px}
@media (max-width:860px){.picker{position:static}
 .top-in{padding:8px 14px;gap:8px 12px}.brand h1{font-size:1.05rem}.brand .sub{display:none}.ctl>span{display:none}.seg button{padding:5px 10px;font-size:.8rem}.card-h h2{font-size:1.25rem}.cause{font-size:1.3rem}.card-h,.card-b{padding-left:16px;padding-right:16px}
 body.has-defect .picker header,body.has-defect .picker .group{display:none}
 .pcompact{display:none}body.has-defect .pcompact{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:.9rem}
 .pcompact .eyebrow{display:block}.pcompact>div{flex:1;min-width:0}.pcompact b{display:block;font-family:var(--display);font-size:1rem;line-height:1.2}}
@media (min-width:861px){.pcompact{display:none}}
.picker header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.picker header h2{font-size:1.05rem}
.picker header p{margin:4px 0 0;font-size:.82rem;color:var(--ink-2)}
.group{padding:8px 8px 4px}
.group .eyebrow{padding:8px 8px 4px}
.defect{display:flex;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:8px 10px;gap:10px;align-items:flex-start;font-size:.92rem;line-height:1.35}
.defect:hover{background:var(--surface-2)}
.defect[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.defect .n{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);min-width:2.6em;padding-top:3px;text-align:right}
.defect[aria-current="true"] .n{color:var(--accent)}
.defect span:last-child::first-letter,.card-h h2::first-letter,details.d summary::first-letter{text-transform:uppercase}
.defect span:last-child{display:inline-block}

/* main */
.main{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.card-h>div:first-child{flex:1;min-width:0}
.svc ul{margin:8px 0 0;padding-left:1.2em}.svc li{margin:3px 0}
.card-h h2{font-size:1.55rem;font-weight:700}
.card-h .meta{font-size:.82rem;color:var(--ink-2);margin-top:4px}
.card-b{padding:18px 22px}
.intro{max-width:62ch;color:var(--ink-2)}
.intro h2{color:var(--ink);font-size:1.6rem;margin-bottom:8px}
.intro ol{padding-left:1.2em;margin:10px 0}
.intro li{margin:4px 0}

/* progress rail */
.rail{display:flex;gap:4px;padding:12px 22px 0;flex-wrap:wrap}
.rail span{height:6px;flex:1 1 20px;min-width:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.rail span.done-no{background:var(--line-strong);border-color:var(--line-strong)}
.rail span.done-skip{background:repeating-linear-gradient(45deg,var(--line-strong) 0 3px,transparent 3px 6px)}
.rail span.done-yes{background:var(--ok);border-color:var(--ok)}
.rail span.cur{background:var(--accent);border-color:var(--accent)}

.step-label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.step-label .eyebrow{color:var(--accent)}
.cause{font-family:var(--display);font-size:1.6rem;font-weight:600;margin:6px 0 14px}
.cause::first-letter{text-transform:uppercase}
.caution{border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--warn-ink);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin:0 0 10px;font-size:.92rem;display:flex;gap:10px}
.caution b{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding-top:3px}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.steps .k{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--accent);line-height:1.1}
.steps .code{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);display:block;margin-top:4px}
.steps p{margin:0}
.steps p::first-letter{text-transform:uppercase}
.ask{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.ask h3{font-size:1.05rem;margin-bottom:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:9px 16px;font-weight:600;font-size:.92rem}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok:hover{background:var(--ok-soft)}
.btn.quiet{border-color:transparent;color:var(--ink-2)}
.btn.small{padding:5px 10px;font-size:.8rem;font-weight:500}

/* outcome */
.outcome{padding:22px}
.outcome h2{font-size:1.5rem;margin-bottom:6px}
.outcome.good{border-top:4px solid var(--ok)}
.outcome.escalate{border-top:4px solid var(--warn)}
.log{list-style:none;margin:14px 0;padding:0;display:grid;gap:6px;font-size:.9rem}
.log li{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline}
.pill{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid}
.pill.yes{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.no{color:var(--ink-2);border-color:var(--line-strong);background:var(--surface-2)}
.pill.skip{color:var(--ink-3);border-color:var(--line);background:transparent}
.summary{margin-top:14px}
.summary textarea{width:100%;min-height:150px;font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface-2);color:var(--ink);resize:vertical}
.support{margin-top:14px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r);font-size:.9rem}
.support b{font-family:var(--display)}

/* reference */
.ref .card-b{padding:0}
details.d{border-top:1px solid var(--line)}
details.d:first-of-type{border-top:0}
details.d summary{list-style:none;cursor:pointer;padding:12px 22px;display:flex;gap:12px;align-items:baseline;font-family:var(--display);font-size:1.1rem;font-weight:600}
details.d summary::-webkit-details-marker{display:none}
details.d summary::before{content:"+";font-family:var(--mono);color:var(--accent);width:1em}
details.d[open] summary::before{content:"–"}
details.d summary .sec{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-left:auto}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-top:1px solid var(--line)}
th{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--surface-2)}
td:first-child{width:24%;font-weight:600}
td:first-child::first-letter,td ul li::first-letter{text-transform:uppercase}
td ul{margin:0;padding-left:1.1em}
td ul li{margin:2px 0}
td .c{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);margin-right:6px}
.gloss{padding:14px 22px;display:grid;gap:6px;font-size:.88rem}
.gloss div{display:grid;grid-template-columns:minmax(44px,max-content) 1fr;gap:10px}
.gloss b{font-family:var(--mono);color:var(--accent);font-weight:500}
.refbtn{margin-left:auto}
.int{border-left:3px solid var(--line-strong);padding:6px 10px;margin-top:10px;font-size:.82rem;color:var(--ink-2);background:var(--surface-2);border-radius:0 4px 4px 0}
.int .eyebrow{display:block;margin-bottom:2px}
.note{font-size:.9rem;color:var(--ink-2);font-style:italic;margin:-6px 0 12px;max-width:70ch}
.svc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;background:var(--accent-soft);font-size:.92rem;margin-top:10px}
.svc b{font-family:var(--display)}
.lvl{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line-strong);color:var(--ink-3);vertical-align:middle;margin-left:6px}
figure.ph{margin:0 0 14px;max-width:520px}figure.ph img{width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line);display:block}figure.ph figcaption{font-size:.78rem;color:var(--ink-3);margin-top:5px}
.phrow{display:flex;gap:14px;flex-wrap:wrap}.phrow figure.ph{flex:1 1 240px;max-width:420px}
.desc{max-width:70ch;color:var(--ink-2);margin:0 0 14px}
.steps figure.ph{margin:10px 0 0;max-width:380px}
.gl{padding:12px 22px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.gl .g{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}.gl .g img{width:100%;aspect-ratio:5/4;object-fit:cover;display:block;border-bottom:1px solid var(--line)}.gl .g div{padding:10px 12px;font-size:.85rem;color:var(--ink-2)}.gl .g b{display:block;font-family:var(--display);font-size:1rem;color:var(--ink);margin-bottom:3px}
.gl-h{padding:14px 22px 0}
mark.rv{background:#FFE58A;color:inherit;padding:0 2px;border-radius:2px;border-bottom:2px dotted #B7791F;cursor:help}
:root[data-theme="dark"] mark.rv{background:#5A4A12}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark.rv{background:#5A4A12}}
.rvlist{padding:12px 22px 18px;display:grid;gap:8px;font-size:.88rem}.rvlist div{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:12px}.rvlist b{font-family:var(--mono);font-weight:500}.rvlist .en{color:var(--ink-3);font-family:var(--mono);font-size:.75rem}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 30px;font-size:.78rem;color:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

a-test","section":"results","name":"Excessive burping (clicking) when trying to run a test","desc":"","images":[],"causes":[{"cause":"The zero-pressure point of the HBLT has drifted","remedies":["CAL"],"cautions":[],"level":"operator","note":"Some burping is normal, especially with a high purge rate \u2014 2 to 4 clicks on average is fine. If the HBLT is burping excessively it is most likely sitting more than \u00b12 PSI from zero when open to atmosphere."},{"cause":"Low temperature and/or high humidity are causing the transducer's zero point to drift","remedies":["ENV"],"cautions":[],"level":"operator"},{"cause":"The carboy is positioned too high above the HBLT inlet","remedies":["CARBOY"],"cautions":[],"level":"operator"}]},{"id":"pressure-overshoots-the-programmed-target","section":"results","name":"Pressure overshoots the programmed target","desc":"","images":[],"causes":[{"cause":"Air in the system (most common)","remedies":["PURGE3","PREP"],"cautions":[],"level":"operator"},{"cause":"Incorrect compliance setting","remedies":["COMP_UP"],"cautions":[],"level":"operator"},{"cause":"Up ramp rate set too high","remedies":["RAMP_DOWN"],"cautions":[],"level":"operator"}]},{"id":"false-burst-reported-product-is-intact-with-no-leak","section":"results","name":"False burst reported \u2014 product is intact with no leak","desc":"","images":[],"causes":[{"cause":"Tubing slipping in the Tuohy-Borst fitting, causing a sudden pressure drop","remedies":["ORING","SHARPIE","HYPO"],"cautions":["TB"],"level":"operator"},{"cause":"The product changed volume suddenly without a leak or burst (aneurysm / deformation)","remedies":["DETECT_UP"],"cautions":[],"level":"operator"},{"cause":"An internal HBLT leak","remedies":["LEAKCHK"],"cautions":[],"level":"operator"}]},{"id":"false-burst-at-the-start-of-the-down-ramp","section":"results","name":"False burst at the start of the down ramp","desc":"","images":[],"causes":[{"cause":"The up-burst or down-burst setting is too close to the down ramp rate","remedies":["DOWNBURST","COMP_CHK"],"cautions":[],"level":"operator"}]},{"id":"false-burst-at-the-beginning-of-a-test","section":"results","name":"False burst at the beginning of a test","desc":"","images":[],"causes":[{"cause":"The starting pressure is negative (below zero), so the HBLT sees a downward pressure decay","remedies":["ZERO"],"cautions":[],"level":"operator"}]},{"id":"volume-correction-fails","section":"results","name":"Volume correction fails","desc":"","images":[],"causes":[{"cause":"The HBLT needs to be calibrated","remedies":["PURGE_CAL_VC"],"cautions":[],"level":"operator"}]},{"id":"motor-stalled-error-while-purging-under-vacuum","section":"errors","name":"\"Motor Stalled\" error while purging under vacuum","desc":"","images":[],"causes":[{"cause":"The HBLT needs calibration (it purges fine into an open container but stalls under vacuum)","remedies":["CAL"],"cautions":["TEST"],"level":"operator"},{"cause":"Motor overheating","remedies":["COOL30"],"cautions":["PRESS"],"level":"operator"},{"cause":"Motor power cable not securely connected (new or recently calibrated units)","remedies":["MOTOR_CABLE"],"cautions":[],"level":"service"},{"cause":"Actuator fully extended or retracted and jammed","remedies":["ACT_TEST"],"cautions":[],"level":"service"},{"cause":"Encoder cable unplugged","remedies":["ENC_CABLE"],"cautions":[],"level":"service"},{"cause":"Motor power connections unplugged","remedies":["MOTOR_CABLE"],"cautions":[],"level":"service"},{"cause":"Encoder failure","remedies":["REPL_MOTOR"],"cautions":[],"level":"service"},{"cause":"Motor failure","remedies":["REPL_MOTOR"],"cautions":[],"level":"service"},{"cause":"Encoder circuit failure on the main board","remedies":["REPL_BOARD"],"cautions":[],"level":"service"},{"cause":"Motor driver failure on the main board","remedies":["REPL_BOARD"],"cautions":[],"level":"service"}]},{"id":"motor-overheating-error-while-running-a-test","section":"errors","name":"\"Motor Overheating\" error while running a test","desc":"","images":[],"causes":[{"cause":"The actuator motor got hot during a long high-pressure hold or a high-cycle fatigue test","remedies":["COOL30"],"cautions":["PRESS","IDLE"],"level":"operator"},{"cause":"Connector leads unplugged from the main circuit board","remedies":["MOTOR_CABLE"],"cautions":[],"level":"service"},{"cause":"Motor temperature sensor is broken","remedies":["REPL_MOTOR"],"cautions":[],"level":"service"}]},{"id":"motor-driver-is-too-hot-message","section":"errors","name":"\"Motor Driver is too hot\" message","desc":"","images":[],"causes":[{"cause":"The circuits that power the pressure motor have overheated; continued operation risks damage","remedies":["COOL5"],"cautions":[],"level":"operator"}]},{"id":"pressure-limit-exceeded-error-while-running-a-test","section":"errors","name":"\"Pressure Limit Exceeded\" error while running a test","desc":"","images":[],"causes":[{"cause":"The HBLT needs to be calibrated (hydraulic pressure exceeded its operational limits)","remedies":["CAL_RERUN"],"cautions":[],"level":"operator"},{"cause":"Target pressure is close to the HBLT's maximum pressure limit","remedies":["RAMP_MAX"],"cautions":[],"level":"operator"}]},{"id":"cylinder-is-out-of-water-check-for-leaks-while-running-a-tes","section":"errors","name":"\"Cylinder is out of water, check for leaks\" while running a test","desc":"","images":[],"causes":[{"cause":"The product leaks, or is very compliant or large, so the cylinder runs out of volume before reaching and holding target pressure","remedies":["PROD_LEAK","PREFILL","CONSTRAIN"],"cautions":[],"level":"operator","note":"Applies when not using a FILL. The message appears when the actuator reaches the exhaust limit switch during a test."},{"cause":"Internal HBLT leakage","remedies":["INT_LEAK_LOOK"],"cautions":["ESD","POWER"],"level":"operator"}]},{"id":"exhaust-limit-error","section":"errors","name":"\"Exhaust Limit\" error","desc":"","images":[],"causes":[{"cause":"An HBLT or product leak prevents reaching target pressure, so the exhaust limit switch trips","remedies":["PINHOLE","LEAKCHK"],"cautions":[],"level":"operator"},{"cause":"The product is too compliant or large for this HBLT model to reach the set pressure","remedies":["VOLUME"],"cautions":[],"level":"operator"},{"cause":"Bad limit switches","remedies":["REPL_LIMIT"],"cautions":[],"level":"service"}]},{"id":"fill-timeout-during-the-fill-sequence","section":"errors","name":"\"Fill Timeout\" during the fill sequence","desc":"","images":[],"causes":[{"cause":"Wrong inlet voltage selected on the power module","remedies":["VOLT"],"cautions":["POWER"],"level":"operator"},{"cause":"XV models \u2014 jumper #4 missing on the main circuit board","remedies":["JUMPER4"],"cautions":[],"level":"service","note":"The fill operation timed out without encountering a limit switch."}]},{"id":"intake-timeout-message","section":"errors","name":"\"Intake Timeout\" message","desc":"","images":[],"causes":[{"cause":"Wrong inlet voltage selected on the power module","remedies":["VOLT"],"cautions":["POWER"],"level":"operator"},{"cause":"XV models \u2014 jumper #4 missing on the main circuit board","remedies":["JUMPER4"],"cautions":[],"level":"service"}]},{"id":"purge-timeout-during-purging","section":"errors","name":"\"Purge Timeout\" during purging","desc":"","images":[],"causes":[{"cause":"New HBLTs ship with no water in the hydraulic circuit","remedies":["PURGE5"],"cautions":[],"level":"operator"},{"cause":"The HBLT needs to be calibrated","remedies":["CAL"],"cautions":[],"level":"operator"}]},{"id":"transducer-not-installed-message","section":"errors","name":"\"Transducer Not Installed\" message","desc":"","images":[],"causes":[{"cause":"The transducer is not connected to the main board","remedies":["XDCR_PLUG"],"cautions":[],"level":"service"}]},{"id":"invalid-calibration-message","section":"errors","name":"\"Invalid Calibration\" message","desc":"","images":[],"causes":[{"cause":"The HBLT needs to be re-calibrated","remedies":["PURGE_CAL"],"cautions":[],"level":"operator"},{"cause":"Back-up / RAM batteries have died","remedies":["BATT"],"cautions":[],"level":"service"}]},{"id":"no-application-present-message","section":"errors","name":"\"No Application Present\" message","desc":"","images":[],"causes":[{"cause":"Back-up / RAM batteries have died","remedies":["BATT"],"cautions":[],"level":"service"}]},{"id":"invalid-exhaust-intake-limits-message","section":"errors","name":"\"Invalid Exhaust/Intake Limits\" message","desc":"","images":[],"causes":[{"cause":"The intake and exhaust limit switches are both on at the same time","remedies":["CONTACT"],"cautions":[],"level":"operator"}]},{"id":"error-code-xxx-message","section":"errors","name":"\"Error Code #XXX\" message","desc":"","images":[],"causes":[{"cause":"An internal software error was detected","remedies":["CONTACT"],"cautions":[],"level":"operator"}]},{"id":"tests-pressurization-count-and-other-settings-have-disappear","section":"hardware","name":"Tests, pressurization count and other settings have disappeared","desc":"","images":[],"causes":[{"cause":"Back-up / RAM batteries have died","remedies":["BATT"],"cautions":[],"level":"service"}]},{"id":"display-is-dim","section":"hardware","name":"Display is dim","desc":"","images":[],"causes":[{"cause":"Wrong inlet voltage selected on the power module","remedies":["VOLT"],"cautions":["POWER"],"level":"operator"}]},{"id":"beep-is-quiet","section":"hardware","name":"Beep is quiet","desc":"","images":[],"causes":[{"cause":"Wrong inlet voltage selected on the power module","remedies":["VOLT"],"cautions":["POWER"],"level":"operator"}]},{"id":"doink-noise-from-the-unit","section":"hardware","name":"\"Doink\" noise from the unit","desc":"","images":[],"causes":[{"cause":"The clevis and pivot arm blocks are not pinned to the base plate","remedies":["PIN_BLOCKS"],"cautions":[],"level":"service"}]},{"id":"can-t-download-the-hblt-application-software","section":"hardware","name":"Can't download the HBLT application software","desc":"","images":[],"causes":[{"cause":"Defective serial ribbon cable, bulkhead pin connector assembly, or external serial cable","remedies":["SERIAL"],"cautions":[],"level":"service"}]}],"remedies":{"CAL":"Calibrate the HBLT. Follow the calibration procedure in the Owner's Manual; a 'How To' demonstration video on calibrating the HBLT is available from MSI (formerly on the Crescent Design website).","ENV":"Make sure the testing environment meets the recommended specifications: operating temperature 59\u2013104 \u00b0F (15\u201340 \u00b0C); humidity 35\u201385 % RH, non-condensing.","CARBOY":"Position the carboy level with the inlet of the HBLT. If the carboy sits above the inlet, head pressure can exceed the zero point of the HBLT.","PURGE3":"Purge the HBLT under vacuum every morning or before the start of each shift. Run a total of 3 purge cycles under vacuum.","PREP":"Always make sure the parts under test are prepped and purged of air for best test results.","COMP_UP":"Increase the compliance setting.","RAMP_DOWN":"Lower the (up) ramp rate.","COOL30":"Turn off the HBLT. Place a rag or towel over the luer connection at the outlet and disconnect it to relieve the pressure. Leave the HBLT turned off for 30 minutes to let the motor cool.","MOTOR_CABLE":"Check that the motor power cable is securely connected at both ends \u2014 at the motor and at the main circuit board.","ENC_CABLE":"Check the encoder cable connection at both ends.","REPL_MOTOR":"Replace the motor on the actuator.","REPL_BOARD":"Replace the HBLT main circuit board.","ACT_TEST":"Remove the actuator from the HBLT and power-test it to confirm full, normal travel.","CAL_RERUN":"Calibrate the HBLT and run the test again. If the issue persists, contact service@machinesolutions.com.","RAMP_MAX":"Lower the ramp rate. The HBLT may be overshooting its maximum pressure limit because the ramp rate is too high.","PROD_LEAK":"Check the product for leaks.","PREFILL":"Pre-fill the product before running the test.","CONSTRAIN":"Try constraining the product to limit its compliance.","INT_LEAK_LOOK":"Turn off the HBLT and unplug it. Remove the top cover and look for any water inside the unit. If water is present, the HBLT should be returned to MSI for evaluation to determine which component is leaking.","JUMPER4":"Install jumper #4 on the main circuit board (XV models).","VOLT":"Set the power module inlet voltage selector to 110\u2013120 V.","PURGE5":"Run continuous purge again for 5 minutes to ensure the HBLT is full of water.","PIN_BLOCKS":"Pin the clevis and pivot arm blocks to the base plate.","PURGE_CAL_VC":"Purge the HBLT, calibrate the HBLT, then re-run the volume correction.","XDCR_PLUG":"Plug the transducer cable back into the main HBLT circuit board.","BATT":"Replace the back-up/RAM batteries \u2014 or, if the HBLT has the older-style main circuit board, install a new circuit board.","PURGE_CAL":"Properly purge and calibrate the HBLT.","SERIAL":"Replace the defective component: serial ribbon cable, bulkhead pin connector assembly, or external serial cable.","ORING":"Change the compression-fitting rubber O-ring often \u2014 a damaged O-ring causes connection problems. Use a quality connector such as the Plasti-Mate Tuohy-Borst made by S4J Manufacturing (PN A7530).","SHARPIE":"Mark the balloon stem with a black marker right at the connection so you can see if it slips during the test.","HYPO":"If needed, insert a hypo tube inside the I.D. of the product tube so the fitting can be compressed sufficiently without collapsing the fluid path. This also gives more repeatable product-to-product results.","LEAKCHK":"Leak-check the HBLT: install a metal cap or ball valve directly on the outlet, run a simple ramp test to the HBLT's maximum pressure and dwell for 60 seconds. If pressure decays more than 10 % in 60 seconds, contact service@machinesolutions.com.","DETECT_UP":"Increase the burst or leak detection setting so these product deformations are ignored. Pressure Manager software is a good tool for detecting and characterizing sudden volume changes.","DOWNBURST":"Increase the down burst rate or decrease the down ramp rate.","COMP_CHK":"Make sure the compliance settings are correct (not too high).","ZERO":"Check the HBLT calibration and adjust if necessary; make sure the zero point is adjusted close to zero.","PINHOLE":"Inspect the product for pinhole leaks.","VOLUME":"Check the maximum volume output of your HBLT model and verify how much volume each product needs to reach test pressure.","REPL_LIMIT":"Replace the limit switches.","COOL5":"Turn the power off and let the HBLT cool for 5 minutes. If the problem reappears, contact service@machinesolutions.com.","CONTACT":"Contact service@machinesolutions.com for assistance in resolving this problem."},"cautions":{"PRESS":"Relieve pressure before disconnecting: cover the outlet luer with a rag or towel when disconnecting, and keep the HBLT switched off while it cools.","ESD":"Do not touch components inside the HBLT \u2014 many are static sensitive. Unplug the unit before removing the cover.","TB":"Over-tightening the Tuohy-Borst fitting can collapse the tubing, restricting fluid flow and pressurization of the product under test.","POWER":"Disconnect the HBLT from mains power before changing the voltage selector or opening the unit.","TEST":"If this error appears while a test is running (not during purge), stop and contact service@machinesolutions.com.","IDLE":"If this error appears while the HBLT is idle, contact service@machinesolutions.com."},"glossary":[],"sections":{"results":"Test results & pressure behavior","errors":"Error messages on the display","hardware":"Machine behavior & hardware"}}],"images":{},"langs":[{"id":"en","label":"English"},{"id":"de","label":"Deutsch"},{"id":"es-ES","label":"Espa\u00f1ol (Espa\u00f1a)"},{"id":"es-419","label":"Espa\u00f1ol (Latinoam\u00e9rica)"}],"tr":{"de":{"Machine line":"Maschinenlinie","View":"Ansicht","Guided fix":"Gef\u00fchrte Behebung","Full matrix":"Gesamtmatrix","Mode":"Modus","Operator":"Bediener","MSI internal":"MSI intern","Language":"Sprache","Start over":"Neu beginnen","Cause":"Ursache","Adjustment":"Anpassung","potential causes, most likely first":"m\u00f6gliche Ursachen, wahrscheinlichste zuerst","adjustments, in the order to try them":"Anpassungen, in der empfohlenen Reihenfolge","Check and adjust":"Pr\u00fcfen und anpassen","What to do and why":"Was zu tun ist und warum","Caution":"Achtung","Yes, fixed":"Ja, behoben","No, next cause":"Nein, n\u00e4chste Ursache","No, next adjustment":"Nein, n\u00e4chste Anpassung","Not applicable, skip":"Nicht zutreffend, \u00fcberspringen","Back":"Zur\u00fcck","Did MSI Service resolve it, or do you want to move on?":"Hat der MSI-Service das Problem behoben, oder m\u00f6chten Sie fortfahren?","item.":"-Ma\u00dfnahme.","Resolved":"Behoben","Resolved \u2014 cause:":"Behoben \u2013 Ursache:","If the problem returns, start here first.":"Falls das Problem erneut auftritt, beginnen Sie hier.","Not resolved":"Nicht behoben","All listed causes tried without resolving the problem":"Alle aufgef\u00fchrten Ursachen wurden gepr\u00fcft, ohne das Problem zu beheben","Support summary (copy and send)":"Zusammenfassung f\u00fcr den Support (kopieren und senden)","Copy summary":"Zusammenfassung kopieren","Copied":"Kopiert","Troubleshoot this problem again":"Dieses Problem erneut durchgehen","Choose another problem":"Anderes Problem w\u00e4hlen","Change":"\u00c4ndern","Problem":"Problem","Potential cause":"M\u00f6gliche Ursache","Remedy":"Abhilfe","Cautions":"Hinweise","Run guided fix for this problem":"Gef\u00fchrte Behebung f\u00fcr dieses Problem starten","problem descriptions":"Problembeschreibungen","cause/remedy pairs":"Ursache/Abhilfe-Paare","Code glossary":"Code-Glossar","internal":"intern","Diagnostic codes":"Diagnosecodes","Caution codes":"Hinweiscodes","reference":"Referenz","Source:":"Quelle:","If the guided steps don't resolve the problem, contact":"Wenn die gef\u00fchrten Schritte das Problem nicht beheben, wenden Sie sich an","with the summary the tool prepares for you.":"mit der Zusammenfassung, die das Tool f\u00fcr Sie erstellt.","Internal mode shows source code references and service-level repair steps.":"Der interne Modus zeigt Quellcode-Referenzen und Reparaturschritte auf Service-Ebene.","fixed":"behoben","no change":"keine \u00c4nderung","skipped":"\u00fcbersprungen","MSI internal note":"Interner MSI-Hinweis","service":"Service","support summary":"Zusammenfassung f\u00fcr den Support","Machine line:":"Maschinenlinie:","Problem:":"Problem:","Date:":"Datum:","Steps worked through:":"Durchgef\u00fchrte Schritte:","FIXED":"BEHOBEN","tried, not fixed":"gepr\u00fcft, nicht behoben","skipped / not applicable":"\u00fcbersprungen / nicht zutreffend","Install this troubleshooter":"Diesen Troubleshooter installieren","Works offline on the shop floor.":"Funktioniert auch offline in der Fertigung.","Tap the Share button, then \"Add to Home Screen\".":"Tippen Sie auf \u201eTeilen\u201c und dann auf \u201eZum Home-Bildschirm\u201c.","Install":"Installieren","Tip types, tooling, parameters and materials":"Spitzentypen, Werkzeuge, Parameter und Materialien","glossary":"Glossar","Change problem":"Problem \u00e4ndern","HBLT Troubleshooter":"HBLT-Troubleshooter","What is the HBLT doing?":"Was macht das HBLT?","Pick the symptom or on-screen message that matches. Error messages are listed by the wording shown on the HBLT display.":"W\u00e4hlen Sie das passende Symptom oder die angezeigte Meldung. Fehlermeldungen sind mit dem Wortlaut aufgef\u00fchrt, der auf dem HBLT-Display erscheint.","guided fix":"gef\u00fchrte Behebung","Resolve an HBLT problem one likely cause at a time":"Beheben Sie ein HBLT-Problem Ursache f\u00fcr Ursache","Choose the symptom or error message. The tool walks you through the potential causes in order, with the checks and adjustments for each one. Causes that involve internal components are marked for MSI Service.":"W\u00e4hlen Sie das Symptom oder die Fehlermeldung. Das Tool f\u00fchrt Sie der Reihe nach durch die m\u00f6glichen Ursachen mit den jeweiligen Pr\u00fcfungen und Anpassungen. Ursachen, die interne Komponenten betreffen, sind f\u00fcr den MSI-Service gekennzeichnet.","Re-run the test. Did this resolve the problem?":"F\u00fchren Sie den Test erneut aus. Wurde das Problem dadurch behoben?","Please add: HBLT model and serial number, firmware/application version, product under test (balloon size, material), test settings (target pressure, ramp rates, compliance), and a photo of the display if an error is shown.":"Bitte erg\u00e4nzen: HBLT-Modell und Seriennummer, Firmware-/Anwendungsversion, Pr\u00fcfling (Ballongr\u00f6\u00dfe, Material), Testeinstellungen (Zieldruck, Rampenraten, Compliance) und ein Foto des Displays, falls ein Fehler angezeigt wird.","MSI Service":"MSI-Service","Send the summary below to MSI Service so they can pick up where you left off.":"Senden Sie die folgende Zusammenfassung an den MSI-Service, damit dieser dort weitermachen kann, wo Sie aufgeh\u00f6rt haben.","Record the settings that produced a clean run in your test procedure so the next set-up starts from a known-good state.":"Notieren Sie die Einstellungen, mit denen der Test fehlerfrei lief, in Ihrer Pr\u00fcfanweisung, damit die n\u00e4chste Einrichtung von einem bekannt guten Zustand ausgeht.","This fix involves internal components and is carried out by MSI Service or a trained technician. Contact {contact} and mention this cause.":"Diese Ma\u00dfnahme betrifft interne Komponenten und wird vom MSI-Service oder einem geschulten Techniker durchgef\u00fchrt. Wenden Sie sich an {contact} und nennen Sie diese Ursache.","HBLT troubleshooting matrix":"HBLT-Fehlerbehebungsmatrix","Purge under vacuum (3 cycles) before chasing any pressure problem \u2014 air in the system is the most common cause.":"Sp\u00fclen Sie unter Vakuum (3 Zyklen), bevor Sie ein Druckproblem untersuchen \u2013 Luft im System ist die h\u00e4ufigste Ursache.","Note the current test settings (target pressure, ramp rates, compliance, burst/leak detection) before changing anything.":"Notieren Sie die aktuellen Testeinstellungen (Zieldruck, Rampenraten, Compliance, Berst-/Leckerkennung), bevor Sie etwas \u00e4ndern.","If nothing in the list resolves it, the tool prepares a summary you can send to MSI Service.":"Wenn keine der aufgef\u00fchrten Ma\u00dfnahmen hilft, erstellt das Tool eine Zusammenfassung, die Sie an den MSI-Service senden k\u00f6nnen.","Test results & pressure behavior":"Testergebnisse & Druckverhalten","Error messages on the display":"Fehlermeldungen auf dem Display","Machine behavior & hardware":"Maschinenverhalten & Hardware","Internal AM HBLT Troubleshooting Guide":"Interner AM-Leitfaden zur HBLT-Fehlerbehebung","Excessive burping (clicking) when trying to run a test":"\u00dcberm\u00e4\u00dfiges \u201eAufsto\u00dfen\u201c (Klicken) beim Starten eines Tests","The zero-pressure point of the HBLT has drifted":"Der Nulldruckpunkt des HBLT ist verschoben","Some burping is normal, especially with a high purge rate \u2014 2 to 4 clicks on average is fine. If the HBLT is burping excessively it is most likely sitting more than \u00b12 PSI from zero when open to atmosphere.":"Ein gewisses Aufsto\u00dfen ist normal, besonders bei hoher Sp\u00fclrate \u2013 2 bis 4 Klicks im Durchschnitt sind in Ordnung. Wenn das HBLT \u00fcberm\u00e4\u00dfig aufst\u00f6\u00dft, liegt es bei \u00d6ffnung zur Atmosph\u00e4re wahrscheinlich mehr als \u00b12 PSI vom Nullpunkt entfernt.","Low temperature and/or high humidity are causing the transducer's zero point to drift":"Niedrige Temperatur und/oder hohe Luftfeuchtigkeit lassen den Nullpunkt des Druckaufnehmers driften","The carboy is positioned too high above the HBLT inlet":"Der Wasserbeh\u00e4lter steht zu hoch \u00fcber dem HBLT-Einlass","Pressure overshoots the programmed target":"Der Druck \u00fcberschreitet den programmierten Zielwert","Air in the system (most common)":"Luft im System (h\u00e4ufigste Ursache)","Incorrect compliance setting":"Falsche Compliance-Einstellung","Up ramp rate set too high":"Rampenrate (aufw\u00e4rts) zu hoch eingestellt","False burst reported \u2014 product is intact with no leak":"Fehlalarm \u201eBerst\u201c \u2013 Produkt ist intakt und dicht","Tubing slipping in the Tuohy-Borst fitting, causing a sudden pressure drop":"Der Schlauch rutscht im Tuohy-Borst-Anschluss und verursacht einen pl\u00f6tzlichen Druckabfall","The product changed volume suddenly without a leak or burst (aneurysm / deformation)":"Das Produkt hat sein Volumen pl\u00f6tzlich ge\u00e4ndert, ohne Leck oder Bersten (Aneurysma / Verformung)","An internal HBLT leak":"Ein internes Leck im HBLT","False burst at the start of the down ramp":"Fehlalarm \u201eBerst\u201c zu Beginn der Abw\u00e4rtsrampe","The up-burst or down-burst setting is too close to the down ramp rate":"Die Einstellung \u201eUp Burst\u201c oder \u201eDown Burst\u201c liegt zu nah an der Abw\u00e4rts-Rampenrate","False burst at the beginning of a test":"Fehlalarm \u201eBerst\u201c zu Beginn eines Tests","The starting pressure is negative (below zero), so the HBLT sees a downward pressure decay":"Der Startdruck ist negativ (unter null), sodass das HBLT einen Druckabfall erkennt","Volume correction fails":"Volumenkorrektur schl\u00e4gt fehl","The HBLT needs to be calibrated":"Das HBLT muss kalibriert werden","\"Motor Stalled\" error while purging under vacuum":"Fehler \u201eMotor Stalled\u201c beim Sp\u00fclen unter Vakuum","The HBLT needs calibration (it purges fine into an open container but stalls under vacuum)":"Das HBLT muss kalibriert werden (es sp\u00fclt problemlos in einen offenen Beh\u00e4lter, blockiert aber unter Vakuum)","Motor overheating":"Motor \u00fcberhitzt","Motor power cable not securely connected (new or recently calibrated units)":"Motorstromkabel nicht fest angeschlossen (neue oder k\u00fcrzlich kalibrierte Ger\u00e4te)","Actuator fully extended or retracted and jammed":"Aktuator vollst\u00e4ndig aus- oder eingefahren und blockiert","Encoder cable unplugged":"Encoderkabel abgezogen","Motor power connections unplugged":"Motorstromanschl\u00fcsse abgezogen","Encoder failure":"Encoder defekt","Motor failure":"Motor defekt","Encoder circuit failure on the main board":"Encoder-Schaltung auf der Hauptplatine defekt","Motor driver failure on the main board":"Motortreiber auf der Hauptplatine defekt","\"Motor Overheating\" error while running a test":"Fehler \u201eMotor Overheating\u201c w\u00e4hrend eines Tests","The actuator motor got hot during a long high-pressure hold or a high-cycle fatigue test":"Der Aktuatormotor wurde bei einer langen Hochdruckhaltephase oder einem Erm\u00fcdungstest mit vielen Zyklen hei\u00df","Connector leads unplugged from the main circuit board":"Anschlussleitungen von der Hauptplatine abgezogen","Motor temperature sensor is broken":"Motortemperatursensor defekt","\"Motor Driver is too hot\" message":"Meldung \u201eMotor Driver is too hot\u201c","The circuits that power the pressure motor have overheated; continued operation risks damage":"Die Schaltkreise, die den Druckmotor versorgen, sind \u00fcberhitzt; Weiterbetrieb kann Sch\u00e4den verursachen","\"Pressure Limit Exceeded\" error while running a test":"Fehler \u201ePressure Limit Exceeded\u201c w\u00e4hrend eines Tests","The HBLT needs to be calibrated (hydraulic pressure exceeded its operational limits)":"Das HBLT muss kalibriert werden (der Hydraulikdruck hat die Betriebsgrenzen \u00fcberschritten)","Target pressure is close to the HBLT's maximum pressure limit":"Der Zieldruck liegt nahe an der maximalen Druckgrenze des HBLT","\"Cylinder is out of water, check for leaks\" while running a test":"\u201eCylinder is out of water, check for leaks\u201c w\u00e4hrend eines Tests","The product leaks, or is very compliant or large, so the cylinder runs out of volume before reaching and holding target pressure":"Das Produkt leckt oder ist sehr nachgiebig oder gro\u00df, sodass dem Zylinder das Volumen ausgeht, bevor der Zieldruck erreicht und gehalten wird","Applies when not using a FILL. The message appears when the actuator reaches the exhaust limit switch during a test.":"Gilt, wenn kein FILL verwendet wird. Die Meldung erscheint, wenn der Aktuator w\u00e4hrend eines Tests den Endschalter \u201eExhaust\u201c erreicht.","Internal HBLT leakage":"Internes Leck im HBLT","\"Exhaust Limit\" error":"Fehler \u201eExhaust Limit\u201c","An HBLT or product leak prevents reaching target pressure, so the exhaust limit switch trips":"Ein Leck im HBLT oder Produkt verhindert das Erreichen des Zieldrucks, sodass der Endschalter \u201eExhaust\u201c ausl\u00f6st","The product is too compliant or large for this HBLT model to reach the set pressure":"Das Produkt ist zu nachgiebig oder zu gro\u00df, als dass dieses HBLT-Modell den eingestellten Druck erreichen k\u00f6nnte","Bad limit switches":"Defekte Endschalter","\"Fill Timeout\" during the fill sequence":"\u201eFill Timeout\u201c w\u00e4hrend der F\u00fcllsequenz","Wrong inlet voltage selected on the power module":"Falsche Eingangsspannung am Netzteilmodul gew\u00e4hlt","XV models \u2014 jumper #4 missing on the main circuit board":"XV-Modelle \u2013 Jumper Nr. 4 auf der Hauptplatine fehlt","The fill operation timed out without encountering a limit switch.":"Der F\u00fcllvorgang hat das Zeitlimit \u00fcberschritten, ohne einen Endschalter zu erreichen.","\"Intake Timeout\" message":"Meldung \u201eIntake Timeout\u201c","\"Purge Timeout\" during purging":"\u201ePurge Timeout\u201c beim Sp\u00fclen","New HBLTs ship with no water in the hydraulic circuit":"Neue HBLT-Ger\u00e4te werden ohne Wasser im Hydraulikkreis geliefert","\"Transducer Not Installed\" message":"Meldung \u201eTransducer Not Installed\u201c","The transducer is not connected to the main board":"Der Druckaufnehmer ist nicht mit der Hauptplatine verbunden","\"Invalid Calibration\" message":"Meldung \u201eInvalid Calibration\u201c","The HBLT needs to be re-calibrated":"Das HBLT muss neu kalibriert werden","Back-up / RAM batteries have died":"Die Puffer-/RAM-Batterien sind leer","\"No Application Present\" message":"Meldung \u201eNo Application Present\u201c","\"Invalid Exhaust/Intake Limits\" message":"Meldung \u201eInvalid Exhaust/Intake Limits\u201c","The intake and exhaust limit switches are both on at the same time":"Die Endschalter \u201eIntake\u201c und \u201eExhaust\u201c sind gleichzeitig aktiv","\"Error Code #XXX\" message":"Meldung \u201eError Code #XXX\u201c","An internal software error was detected":"Ein interner Softwarefehler wurde erkannt","Tests, pressurization count and other settings have disappeared":"Tests, Druckzyklenz\u00e4hler und andere Einstellungen sind verschwunden","Display is dim":"Display ist dunkel","Beep is quiet":"Signalton ist leise","\"Doink\" noise from the unit":"\u201eDoink\u201c-Ger\u00e4usch aus dem Ger\u00e4t","The clevis and pivot arm blocks are not pinned to the base plate":"Die Gabelkopf- und Schwenkarmbl\u00f6cke sind nicht mit der Grundplatte verstiftet","Can't download the HBLT application software":"Die HBLT-Anwendungssoftware l\u00e4sst sich nicht herunterladen","Defective serial ribbon cable, bulkhead pin connector assembly, or external serial cable":"Defektes serielles Flachbandkabel, defekte Durchf\u00fchrungs-Steckverbindung oder defektes externes serielles Kabel","Calibrate the HBLT. Follow the calibration procedure in the Owner's Manual; a 'How To' demonstration video on calibrating the HBLT is available from MSI (formerly on the Crescent Design website).":"Kalibrieren Sie das HBLT. Befolgen Sie das Kalibrierverfahren in der Betriebsanleitung; ein Anleitungsvideo zur Kalibrierung des HBLT ist bei MSI erh\u00e4ltlich (fr\u00fcher auf der Crescent-Design-Website).","Make sure the testing environment meets the recommended specifications: operating temperature 59\u2013104 \u00b0F (15\u201340 \u00b0C); humidity 35\u201385 % RH, non-condensing.":"Stellen Sie sicher, dass die Pr\u00fcfumgebung den empfohlenen Spezifikationen entspricht: Betriebstemperatur 15\u201340 \u00b0C (59\u2013104 \u00b0F); Luftfeuchtigkeit 35\u201385 % rF, nicht kondensierend.","Position the carboy level with the inlet of the HBLT. If the carboy sits above the inlet, head pressure can exceed the zero point of the HBLT.":"Stellen Sie den Wasserbeh\u00e4lter auf H\u00f6he des HBLT-Einlasses auf. Steht der Beh\u00e4lter \u00fcber dem Einlass, kann der hydrostatische Druck den Nullpunkt des HBLT \u00fcberschreiten.","Purge the HBLT under vacuum every morning or before the start of each shift. Run a total of 3 purge cycles under vacuum.":"Sp\u00fclen Sie das HBLT jeden Morgen bzw. vor Schichtbeginn unter Vakuum. F\u00fchren Sie insgesamt 3 Sp\u00fclzyklen unter Vakuum durch.","Always make sure the parts under test are prepped and purged of air for best test results.":"Achten Sie stets darauf, dass die Pr\u00fcflinge vorbereitet und entl\u00fcftet sind, um optimale Testergebnisse zu erzielen.","Increase the compliance setting.":"Erh\u00f6hen Sie die Compliance-Einstellung.","Lower the (up) ramp rate.":"Verringern Sie die Rampenrate (aufw\u00e4rts).","Turn off the HBLT. Place a rag or towel over the luer connection at the outlet and disconnect it to relieve the pressure. Leave the HBLT turned off for 30 minutes to let the motor cool.":"Schalten Sie das HBLT aus. Legen Sie einen Lappen oder ein Tuch \u00fcber den Luer-Anschluss am Auslass und l\u00f6sen Sie ihn, um den Druck abzubauen. Lassen Sie das HBLT 30 Minuten ausgeschaltet, damit der Motor abk\u00fchlen kann.","Check that the motor power cable is securely connected at both ends \u2014 at the motor and at the main circuit board.":"Pr\u00fcfen Sie, ob das Motorstromkabel an beiden Enden fest angeschlossen ist \u2013 am Motor und an der Hauptplatine.","Check the encoder cable connection at both ends.":"Pr\u00fcfen Sie die Encoderkabelverbindung an beiden Enden.","Replace the motor on the actuator.":"Ersetzen Sie den Motor am Aktuator.","Replace the HBLT main circuit board.":"Ersetzen Sie die HBLT-Hauptplatine.","Remove the actuator from the HBLT and power-test it to confirm full, normal travel.":"Bauen Sie den Aktuator aus dem HBLT aus und pr\u00fcfen Sie ihn unter Spannung auf vollen, normalen Hub.","Calibrate the HBLT and run the test again. If the issue persists, contact service@machinesolutions.com.":"Kalibrieren Sie das HBLT und f\u00fchren Sie den Test erneut aus. Besteht das Problem weiterhin, wenden Sie sich an service@machinesolutions.com.","Lower the ramp rate. The HBLT may be overshooting its maximum pressure limit because the ramp rate is too high.":"Verringern Sie die Rampenrate. Das HBLT \u00fcberschreitet m\u00f6glicherweise seine maximale Druckgrenze, weil die Rampenrate zu hoch ist.","Check the product for leaks.":"Pr\u00fcfen Sie das Produkt auf Lecks.","Pre-fill the product before running the test.":"Bef\u00fcllen Sie das Produkt vor dem Test vor.","Try constraining the product to limit its compliance.":"Versuchen Sie, das Produkt einzuspannen, um seine Nachgiebigkeit zu begrenzen.","Turn off the HBLT and unplug it. Remove the top cover and look for any water inside the unit. If water is present, the HBLT should be returned to MSI for evaluation to determine which component is leaking.":"Schalten Sie das HBLT aus und ziehen Sie den Netzstecker. Nehmen Sie die obere Abdeckung ab und pr\u00fcfen Sie, ob sich Wasser im Ger\u00e4t befindet. Falls ja, sollte das HBLT zur Pr\u00fcfung an MSI zur\u00fcckgeschickt werden, um die undichte Komponente zu ermitteln.","Install jumper #4 on the main circuit board (XV models).":"Setzen Sie Jumper Nr. 4 auf der Hauptplatine (XV-Modelle).","Set the power module inlet voltage selector to 110\u2013120 V.":"Stellen Sie den Eingangsspannungswahlschalter am Netzteilmodul auf 110\u2013120 V.","Run continuous purge again for 5 minutes to ensure the HBLT is full of water.":"F\u00fchren Sie erneut 5 Minuten lang eine Dauersp\u00fclung durch, damit das HBLT vollst\u00e4ndig mit Wasser gef\u00fcllt ist.","Pin the clevis and pivot arm blocks to the base plate.":"Verstiften Sie die Gabelkopf- und Schwenkarmbl\u00f6cke mit der Grundplatte.","Purge the HBLT, calibrate the HBLT, then re-run the volume correction.":"Sp\u00fclen Sie das HBLT, kalibrieren Sie es und f\u00fchren Sie dann die Volumenkorrektur erneut aus.","Plug the transducer cable back into the main HBLT circuit board.":"Stecken Sie das Druckaufnehmerkabel wieder in die HBLT-Hauptplatine.","Replace the back-up/RAM batteries \u2014 or, if the HBLT has the older-style main circuit board, install a new circuit board.":"Ersetzen Sie die Puffer-/RAM-Batterien \u2013 oder bauen Sie, falls das HBLT die \u00e4ltere Hauptplatine hat, eine neue Platine ein.","Properly purge and calibrate the HBLT.":"Sp\u00fclen und kalibrieren Sie das HBLT ordnungsgem\u00e4\u00df.","Replace the defective component: serial ribbon cable, bulkhead pin connector assembly, or external serial cable.":"Ersetzen Sie die defekte Komponente: serielles Flachbandkabel, Durchf\u00fchrungs-Steckverbindung oder externes serielles Kabel.","Change the compression-fitting rubber O-ring often \u2014 a damaged O-ring causes connection problems. Use a quality connector such as the Plasti-Mate Tuohy-Borst made by S4J Manufacturing (PN A7530).":"Wechseln Sie den Gummi-O-Ring der Klemmverschraubung regelm\u00e4\u00dfig \u2013 ein besch\u00e4digter O-Ring verursacht Verbindungsprobleme. Verwenden Sie einen hochwertigen Anschluss wie den Plasti-Mate Tuohy-Borst von S4J Manufacturing (Art.-Nr. A7530).","Mark the balloon stem with a black marker right at the connection so you can see if it slips during the test.":"Markieren Sie den Ballonschaft direkt am Anschluss mit einem schwarzen Marker, damit Sie erkennen, ob er w\u00e4hrend des Tests verrutscht.","If needed, insert a hypo tube inside the I.D. of the product tube so the fitting can be compressed sufficiently without collapsing the fluid path. This also gives more repeatable product-to-product results.":"Setzen Sie bei Bedarf ein Hypo-R\u00f6hrchen in den Innendurchmesser des Produktschlauchs ein, damit der Anschluss ausreichend geklemmt werden kann, ohne den Fl\u00fcssigkeitsweg zu verschlie\u00dfen. Das liefert auch besser reproduzierbare Ergebnisse von Produkt zu Produkt.","Leak-check the HBLT: install a metal cap or ball valve directly on the outlet, run a simple ramp test to the HBLT's maximum pressure and dwell for 60 seconds. If pressure decays more than 10 % in 60 seconds, contact service@machinesolutions.com.":"Dichtheitspr\u00fcfung des HBLT: Montieren Sie eine Metallkappe oder einen Kugelhahn direkt am Auslass, f\u00fchren Sie einen einfachen Rampentest bis zum Maximaldruck des HBLT durch und halten Sie 60 Sekunden. F\u00e4llt der Druck in 60 Sekunden um mehr als 10 %, wenden Sie sich an service@machinesolutions.com.","Increase the burst or leak detection setting so these product deformations are ignored. Pressure Manager software is a good tool for detecting and characterizing sudden volume changes.":"Erh\u00f6hen Sie die Einstellung der Berst- bzw. Leckerkennung, damit diese Produktverformungen ignoriert werden. Die Software Pressure Manager eignet sich gut, um pl\u00f6tzliche Volumen\u00e4nderungen zu erkennen und zu charakterisieren.","Increase the down burst rate or decrease the down ramp rate.":"Erh\u00f6hen Sie die Rate \u201eDown Burst\u201c oder verringern Sie die Abw\u00e4rts-Rampenrate.","Make sure the compliance settings are correct (not too high).":"Stellen Sie sicher, dass die Compliance-Einstellungen korrekt (nicht zu hoch) sind.","Check the HBLT calibration and adjust if necessary; make sure the zero point is adjusted close to zero.":"Pr\u00fcfen Sie die Kalibrierung des HBLT und korrigieren Sie sie bei Bedarf; der Nullpunkt muss nahe null eingestellt sein.","Inspect the product for pinhole leaks.":"Pr\u00fcfen Sie das Produkt auf feine Lecks (Pinholes).","Check the maximum volume output of your HBLT model and verify how much volume each product needs to reach test pressure.":"Pr\u00fcfen Sie das maximale F\u00f6rdervolumen Ihres HBLT-Modells und ermitteln Sie, wie viel Volumen jedes Produkt ben\u00f6tigt, um den Pr\u00fcfdruck zu erreichen.","Replace the limit switches.":"Ersetzen Sie die Endschalter.","Turn the power off and let the HBLT cool for 5 minutes. If the problem reappears, contact service@machinesolutions.com.":"Schalten Sie das Ger\u00e4t aus und lassen Sie das HBLT 5 Minuten abk\u00fchlen. Tritt das Problem erneut auf, wenden Sie sich an service@machinesolutions.com.","Contact service@machinesolutions.com for assistance in resolving this problem.":"Wenden Sie sich an service@machinesolutions.com, um Unterst\u00fctzung bei der Behebung dieses Problems zu erhalten.","Relieve pressure before disconnecting: cover the outlet luer with a rag or towel when disconnecting, and keep the HBLT switched off while it cools.":"Bauen Sie vor dem Trennen den Druck ab: Decken Sie den Auslass-Luer beim L\u00f6sen mit einem Lappen oder Tuch ab und lassen Sie das HBLT w\u00e4hrend des Abk\u00fchlens ausgeschaltet.","Do not touch components inside the HBLT \u2014 many are static sensitive. Unplug the unit before removing the cover.":"Ber\u00fchren Sie keine Bauteile im Inneren des HBLT \u2013 viele sind elektrostatisch empfindlich. Ziehen Sie den Netzstecker, bevor Sie die Abdeckung abnehmen.","Over-tightening the Tuohy-Borst fitting can collapse the tubing, restricting fluid flow and pressurization of the product under test.":"Zu festes Anziehen des Tuohy-Borst-Anschlusses kann den Schlauch zusammendr\u00fccken und den Fl\u00fcssigkeitsfluss sowie die Druckbeaufschlagung des Pr\u00fcflings behindern.","Disconnect the HBLT from mains power before changing the voltage selector or opening the unit.":"Trennen Sie das HBLT vom Stromnetz, bevor Sie den Spannungswahlschalter umstellen oder das Ger\u00e4t \u00f6ffnen.","If this error appears while a test is running (not during purge), stop and contact service@machinesolutions.com.":"Erscheint dieser Fehler w\u00e4hrend eines laufenden Tests (nicht beim Sp\u00fclen), brechen Sie ab und wenden Sie sich an service@machinesolutions.com.","If this error appears while the HBLT is idle, contact service@machinesolutions.com.":"Erscheint dieser Fehler im Leerlauf des HBLT, wenden Sie sich an service@machinesolutions.com."},"es-ES":{"Machine line":"L\u00ednea de m\u00e1quina","View":"Vista","Guided fix":"Soluci\u00f3n guiada","Full matrix":"Matriz completa","Mode":"Modo","Operator":"Operador","MSI internal":"MSI interno","Language":"Idioma","Start over":"Empezar de nuevo","Cause":"Causa","Adjustment":"Ajuste","potential causes, most likely first":"causas posibles, la m\u00e1s probable primero","adjustments, in the order to try them":"ajustes, en el orden en que deben probarse","Check and adjust":"Comprobar y ajustar","What to do and why":"Qu\u00e9 hacer y por qu\u00e9","Caution":"Precauci\u00f3n","Yes, fixed":"S\u00ed, resuelto","No, next cause":"No, siguiente causa","No, next adjustment":"No, siguiente ajuste","Not applicable, skip":"No aplica, omitir","Back":"Atr\u00e1s","Did MSI Service resolve it, or do you want to move on?":"\u00bfLo resolvi\u00f3 el Servicio de MSI o desea continuar?","item.":"\u2014 tarea de servicio.","Resolved":"Resuelto","Resolved \u2014 cause:":"Resuelto \u2014 causa:","If the problem returns, start here first.":"Si el problema vuelve a aparecer, empiece por aqu\u00ed.","Not resolved":"No resuelto","All listed causes tried without resolving the problem":"Se han probado todas las causas indicadas sin resolver el problema","Support summary (copy and send)":"Resumen para el soporte (copiar y enviar)","Copy summary":"Copiar resumen","Copied":"Copiado","Troubleshoot this problem again":"Repetir la soluci\u00f3n de este problema","Choose another problem":"Elegir otro problema","Change":"Cambiar","Problem":"Problema","Potential cause":"Causa posible","Remedy":"Soluci\u00f3n","Cautions":"Precauciones","Run guided fix for this problem":"Iniciar la soluci\u00f3n guiada de este problema","problem descriptions":"descripciones de problemas","cause/remedy pairs":"pares causa/soluci\u00f3n","Code glossary":"Glosario de c\u00f3digos","internal":"interno","Diagnostic codes":"C\u00f3digos de diagn\u00f3stico","Caution codes":"C\u00f3digos de precauci\u00f3n","reference":"referencia","Source:":"Fuente:","If the guided steps don't resolve the problem, contact":"Si los pasos guiados no resuelven el problema, contacte con","with the summary the tool prepares for you.":"con el resumen que la herramienta prepara para usted.","Internal mode shows source code references and service-level repair steps.":"El modo interno muestra las referencias de c\u00f3digos de la fuente y los pasos de reparaci\u00f3n de nivel de servicio.","fixed":"resuelto","no change":"sin cambios","skipped":"omitido","MSI internal note":"Nota interna de MSI","service":"servicio","support summary":"resumen para el soporte","Machine line:":"L\u00ednea de m\u00e1quina:","Problem:":"Problema:","Date:":"Fecha:","Steps worked through:":"Pasos realizados:","FIXED":"RESUELTO","tried, not fixed":"probado, no resuelto","skipped / not applicable":"omitido / no aplica","Install this troubleshooter":"Instalar esta gu\u00eda de soluci\u00f3n de problemas","Works offline on the shop floor.":"Funciona sin conexi\u00f3n en la planta.","Tap the Share button, then \"Add to Home Screen\".":"Pulse el bot\u00f3n Compartir y luego \u00abA\u00f1adir a pantalla de inicio\u00bb.","Install":"Instalar","Tip types, tooling, parameters and materials":"Tipos de punta, herramental, par\u00e1metros y materiales","glossary":"glosario","Change problem":"Cambiar de problema","HBLT Troubleshooter":"Gu\u00eda de soluci\u00f3n de problemas HBLT","What is the HBLT doing?":"\u00bfQu\u00e9 est\u00e1 haciendo el HBLT?","Pick the symptom or on-screen message that matches. Error messages are listed by the wording shown on the HBLT display.":"Elija el s\u00edntoma o el mensaje en pantalla que coincida. Los mensajes de error aparecen con el texto exacto que muestra la pantalla del HBLT.","guided fix":"soluci\u00f3n guiada","Resolve an HBLT problem one likely cause at a time":"Resuelva un problema del HBLT una causa probable a la vez","Choose the symptom or error message. The tool walks you through the potential causes in order, with the checks and adjustments for each one. Causes that involve internal components are marked for MSI Service.":"Elija el s\u00edntoma o el mensaje de error. La herramienta le gu\u00eda por las causas posibles en orden, con las comprobaciones y ajustes de cada una. Las causas que implican componentes internos est\u00e1n marcadas para el Servicio de MSI.","Re-run the test. Did this resolve the problem?":"Repita la prueba. \u00bfSe resolvi\u00f3 el problema?","Please add: HBLT model and serial number, firmware/application version, product under test (balloon size, material), test settings (target pressure, ramp rates, compliance), and a photo of the display if an error is shown.":"A\u00f1ada: modelo y n\u00famero de serie del HBLT, versi\u00f3n de firmware/aplicaci\u00f3n, producto bajo prueba (tama\u00f1o del bal\u00f3n, material), ajustes de la prueba (presi\u00f3n objetivo, velocidades de rampa, compliance) y una foto de la pantalla si se muestra un error.","MSI Service":"Servicio de MSI","Send the summary below to MSI Service so they can pick up where you left off.":"Env\u00ede el resumen siguiente al Servicio de MSI para que puedan continuar desde donde usted lo dej\u00f3.","Record the settings that produced a clean run in your test procedure so the next set-up starts from a known-good state.":"Anote en su procedimiento de prueba los ajustes con los que la prueba se ejecut\u00f3 correctamente, para que la pr\u00f3xima configuraci\u00f3n parta de un estado conocido y v\u00e1lido.","This fix involves internal components and is carried out by MSI Service or a trained technician. Contact {contact} and mention this cause.":"Esta soluci\u00f3n implica componentes internos y la realiza el Servicio de MSI o un t\u00e9cnico cualificado. Contacte con {contact} e indique esta causa.","HBLT troubleshooting matrix":"Matriz de soluci\u00f3n de problemas del HBLT","Purge under vacuum (3 cycles) before chasing any pressure problem \u2014 air in the system is the most common cause.":"Purgue al vac\u00edo (3 ciclos) antes de investigar cualquier problema de presi\u00f3n: el aire en el sistema es la causa m\u00e1s frecuente.","Note the current test settings (target pressure, ramp rates, compliance, burst/leak detection) before changing anything.":"Anote los ajustes actuales de la prueba (presi\u00f3n objetivo, velocidades de rampa, compliance, detecci\u00f3n de rotura/fuga) antes de cambiar nada.","If nothing in the list resolves it, the tool prepares a summary you can send to MSI Service.":"Si nada de la lista lo resuelve, la herramienta prepara un resumen que puede enviar al Servicio de MSI.","Test results & pressure behavior":"Resultados de prueba y comportamiento de la presi\u00f3n","Error messages on the display":"Mensajes de error en la pantalla","Machine behavior & hardware":"Comportamiento de la m\u00e1quina y hardware","Internal AM HBLT Troubleshooting Guide":"Gu\u00eda interna de soluci\u00f3n de problemas HBLT (AM)","Excessive burping (clicking) when trying to run a test":"Burbujeo excesivo (chasquidos) al intentar ejecutar una prueba","The zero-pressure point of the HBLT has drifted":"El punto cero de presi\u00f3n del HBLT se ha desviado","Some burping is normal, especially with a high purge rate \u2014 2 to 4 clicks on average is fine. If the HBLT is burping excessively it is most likely sitting more than \u00b12 PSI from zero when open to atmosphere.":"Cierto burbujeo es normal, sobre todo con una velocidad de purga alta: de 2 a 4 chasquidos de media es aceptable. Si el HBLT burbujea en exceso, lo m\u00e1s probable es que est\u00e9 a m\u00e1s de \u00b12 PSI del cero cuando est\u00e1 abierto a la atm\u00f3sfera.","Low temperature and/or high humidity are causing the transducer's zero point to drift":"La baja temperatura y/o la humedad alta hacen que el punto cero del transductor se desv\u00ede","The carboy is positioned too high above the HBLT inlet":"La garrafa est\u00e1 colocada demasiado alta respecto a la entrada del HBLT","Pressure overshoots the programmed target":"La presi\u00f3n sobrepasa el objetivo programado","Air in the system (most common)":"Aire en el sistema (la causa m\u00e1s frecuente)","Incorrect compliance setting":"Ajuste de compliance incorrecto","Up ramp rate set too high":"Velocidad de rampa de subida demasiado alta","False burst reported \u2014 product is intact with no leak":"Rotura falsa notificada: el producto est\u00e1 intacto y sin fugas","Tubing slipping in the Tuohy-Borst fitting, causing a sudden pressure drop":"El tubo se desliza en el conector Tuohy-Borst y provoca una ca\u00edda brusca de presi\u00f3n","The product changed volume suddenly without a leak or burst (aneurysm / deformation)":"El producto cambi\u00f3 de volumen bruscamente sin fuga ni rotura (aneurisma / deformaci\u00f3n)","An internal HBLT leak":"Una fuga interna del HBLT","False burst at the start of the down ramp":"Rotura falsa al inicio de la rampa de bajada","The up-burst or down-burst setting is too close to the down ramp rate":"El ajuste de rotura en subida (up burst) o en bajada (down burst) est\u00e1 demasiado cerca de la velocidad de rampa de bajada","False burst at the beginning of a test":"Rotura falsa al comienzo de una prueba","The starting pressure is negative (below zero), so the HBLT sees a downward pressure decay":"La presi\u00f3n inicial es negativa (por debajo de cero), por lo que el HBLT detecta una ca\u00edda de presi\u00f3n","Volume correction fails":"La correcci\u00f3n de volumen falla","The HBLT needs to be calibrated":"El HBLT necesita calibrarse","\"Motor Stalled\" error while purging under vacuum":"Error \u00abMotor Stalled\u00bb al purgar al vac\u00edo","The HBLT needs calibration (it purges fine into an open container but stalls under vacuum)":"El HBLT necesita calibraci\u00f3n (purga bien en un recipiente abierto pero se bloquea al vac\u00edo)","Motor overheating":"Sobrecalentamiento del motor","Motor power cable not securely connected (new or recently calibrated units)":"Cable de alimentaci\u00f3n del motor mal conectado (unidades nuevas o reci\u00e9n calibradas)","Actuator fully extended or retracted and jammed":"Actuador totalmente extendido o retra\u00eddo y atascado","Encoder cable unplugged":"Cable del encoder desconectado","Motor power connections unplugged":"Conexiones de alimentaci\u00f3n del motor desconectadas","Encoder failure":"Fallo del encoder","Motor failure":"Fallo del motor","Encoder circuit failure on the main board":"Fallo del circuito del encoder en la placa principal","Motor driver failure on the main board":"Fallo del controlador del motor en la placa principal","\"Motor Overheating\" error while running a test":"Error \u00abMotor Overheating\u00bb durante una prueba","The actuator motor got hot during a long high-pressure hold or a high-cycle fatigue test":"El motor del actuador se calent\u00f3 durante una retenci\u00f3n prolongada a alta presi\u00f3n o una prueba de fatiga de muchos ciclos","Connector leads unplugged from the main circuit board":"Cables del conector desconectados de la placa principal","Motor temperature sensor is broken":"El sensor de temperatura del motor est\u00e1 averiado","\"Motor Driver is too hot\" message":"Mensaje \u00abMotor Driver is too hot\u00bb","The circuits that power the pressure motor have overheated; continued operation risks damage":"Los circuitos que alimentan el motor de presi\u00f3n se han sobrecalentado; seguir operando puede causar da\u00f1os","\"Pressure Limit Exceeded\" error while running a test":"Error \u00abPressure Limit Exceeded\u00bb durante una prueba","The HBLT needs to be calibrated (hydraulic pressure exceeded its operational limits)":"El HBLT necesita calibrarse (la presi\u00f3n hidr\u00e1ulica super\u00f3 sus l\u00edmites operativos)","Target pressure is close to the HBLT's maximum pressure limit":"La presi\u00f3n objetivo est\u00e1 cerca del l\u00edmite m\u00e1ximo de presi\u00f3n del HBLT","\"Cylinder is out of water, check for leaks\" while running a test":"\u00abCylinder is out of water, check for leaks\u00bb durante una prueba","The product leaks, or is very compliant or large, so the cylinder runs out of volume before reaching and holding target pressure":"El producto tiene fugas, o es muy el\u00e1stico o grande, por lo que el cilindro se queda sin volumen antes de alcanzar y mantener la presi\u00f3n objetivo","Applies when not using a FILL. The message appears when the actuator reaches the exhaust limit switch during a test.":"Aplica cuando no se usa un FILL. El mensaje aparece cuando el actuador alcanza el interruptor de fin de carrera de escape durante una prueba.","Internal HBLT leakage":"Fuga interna del HBLT","\"Exhaust Limit\" error":"Error \u00abExhaust Limit\u00bb","An HBLT or product leak prevents reaching target pressure, so the exhaust limit switch trips":"Una fuga en el HBLT o en el producto impide alcanzar la presi\u00f3n objetivo, por lo que se activa el interruptor de fin de carrera de escape","The product is too compliant or large for this HBLT model to reach the set pressure":"El producto es demasiado el\u00e1stico o grande para que este modelo de HBLT alcance la presi\u00f3n configurada","Bad limit switches":"Interruptores de fin de carrera defectuosos","\"Fill Timeout\" during the fill sequence":"\u00abFill Timeout\u00bb durante la secuencia de llenado","Wrong inlet voltage selected on the power module":"Tensi\u00f3n de entrada incorrecta seleccionada en el m\u00f3dulo de alimentaci\u00f3n","XV models \u2014 jumper #4 missing on the main circuit board":"Modelos XV: falta el puente n.\u00ba 4 en la placa principal","The fill operation timed out without encountering a limit switch.":"La operaci\u00f3n de llenado agot\u00f3 el tiempo sin encontrar un interruptor de fin de carrera.","\"Intake Timeout\" message":"Mensaje \u00abIntake Timeout\u00bb","\"Purge Timeout\" during purging":"\u00abPurge Timeout\u00bb durante la purga","New HBLTs ship with no water in the hydraulic circuit":"Los HBLT nuevos se env\u00edan sin agua en el circuito hidr\u00e1ulico","\"Transducer Not Installed\" message":"Mensaje \u00abTransducer Not Installed\u00bb","The transducer is not connected to the main board":"El transductor no est\u00e1 conectado a la placa principal","\"Invalid Calibration\" message":"Mensaje \u00abInvalid Calibration\u00bb","The HBLT needs to be re-calibrated":"El HBLT necesita recalibrarse","Back-up / RAM batteries have died":"Las bater\u00edas de respaldo / RAM se han agotado","\"No Application Present\" message":"Mensaje \u00abNo Application Present\u00bb","\"Invalid Exhaust/Intake Limits\" message":"Mensaje \u00abInvalid Exhaust/Intake Limits\u00bb","The intake and exhaust limit switches are both on at the same time":"Los interruptores de fin de carrera de admisi\u00f3n y de escape est\u00e1n activados al mismo tiempo","\"Error Code #XXX\" message":"Mensaje \u00abError Code #XXX\u00bb","An internal software error was detected":"Se detect\u00f3 un error interno del software","Tests, pressurization count and other settings have disappeared":"Las pruebas, el contador de presurizaciones y otros ajustes han desaparecido","Display is dim":"La pantalla est\u00e1 tenue","Beep is quiet":"El pitido es muy bajo","\"Doink\" noise from the unit":"Ruido tipo \u00abdoink\u00bb en la unidad","The clevis and pivot arm blocks are not pinned to the base plate":"Los bloques de la horquilla y del brazo pivotante no est\u00e1n fijados con pasadores a la placa base","Can't download the HBLT application software":"No se puede descargar el software de aplicaci\u00f3n del HBLT","Defective serial ribbon cable, bulkhead pin connector assembly, or external serial cable":"Cable plano serie, conjunto del conector pasamuros o cable serie externo defectuosos","Calibrate the HBLT. Follow the calibration procedure in the Owner's Manual; a 'How To' demonstration video on calibrating the HBLT is available from MSI (formerly on the Crescent Design website).":"Calibre el HBLT. Siga el procedimiento de calibraci\u00f3n del manual del propietario; MSI dispone de un v\u00eddeo demostrativo sobre c\u00f3mo calibrar el HBLT (antes en el sitio web de Crescent Design).","Make sure the testing environment meets the recommended specifications: operating temperature 59\u2013104 \u00b0F (15\u201340 \u00b0C); humidity 35\u201385 % RH, non-condensing.":"Aseg\u00farese de que el entorno de prueba cumple las especificaciones recomendadas: temperatura de funcionamiento 15\u201340 \u00b0C (59\u2013104 \u00b0F); humedad 35\u201385 % HR, sin condensaci\u00f3n.","Position the carboy level with the inlet of the HBLT. If the carboy sits above the inlet, head pressure can exceed the zero point of the HBLT.":"Coloque la garrafa al nivel de la entrada del HBLT. Si la garrafa queda por encima de la entrada, la presi\u00f3n hidrost\u00e1tica puede superar el punto cero del HBLT.","Purge the HBLT under vacuum every morning or before the start of each shift. Run a total of 3 purge cycles under vacuum.":"Purgue el HBLT al vac\u00edo cada ma\u00f1ana o antes de comenzar cada turno. Ejecute un total de 3 ciclos de purga al vac\u00edo.","Always make sure the parts under test are prepped and purged of air for best test results.":"Aseg\u00farese siempre de que las piezas bajo prueba est\u00e9n preparadas y purgadas de aire para obtener los mejores resultados.","Increase the compliance setting.":"Aumente el ajuste de compliance.","Lower the (up) ramp rate.":"Reduzca la velocidad de rampa (de subida).","Turn off the HBLT. Place a rag or towel over the luer connection at the outlet and disconnect it to relieve the pressure. Leave the HBLT turned off for 30 minutes to let the motor cool.":"Apague el HBLT. Cubra la conexi\u00f3n luer de la salida con un trapo o pa\u00f1o y descon\u00e9ctela para liberar la presi\u00f3n. Deje el HBLT apagado durante 30 minutos para que el motor se enfr\u00ede.","Check that the motor power cable is securely connected at both ends \u2014 at the motor and at the main circuit board.":"Compruebe que el cable de alimentaci\u00f3n del motor est\u00e9 bien conectado en ambos extremos: en el motor y en la placa principal.","Check the encoder cable connection at both ends.":"Compruebe la conexi\u00f3n del cable del encoder en ambos extremos.","Replace the motor on the actuator.":"Sustituya el motor del actuador.","Replace the HBLT main circuit board.":"Sustituya la placa principal del HBLT.","Remove the actuator from the HBLT and power-test it to confirm full, normal travel.":"Retire el actuador del HBLT y pru\u00e9belo con alimentaci\u00f3n para confirmar un recorrido completo y normal.","Calibrate the HBLT and run the test again. If the issue persists, contact service@machinesolutions.com.":"Calibre el HBLT y repita la prueba. Si el problema persiste, contacte con service@machinesolutions.com.","Lower the ramp rate. The HBLT may be overshooting its maximum pressure limit because the ramp rate is too high.":"Reduzca la velocidad de rampa. Es posible que el HBLT est\u00e9 sobrepasando su l\u00edmite m\u00e1ximo de presi\u00f3n porque la velocidad de rampa es demasiado alta.","Check the product for leaks.":"Compruebe si el producto tiene fugas.","Pre-fill the product before running the test.":"Prellene el producto antes de ejecutar la prueba.","Try constraining the product to limit its compliance.":"Pruebe a restringir el producto para limitar su elasticidad.","Turn off the HBLT and unplug it. Remove the top cover and look for any water inside the unit. If water is present, the HBLT should be returned to MSI for evaluation to determine which component is leaking.":"Apague el HBLT y desench\u00fafelo. Retire la tapa superior y compruebe si hay agua dentro de la unidad. Si la hay, el HBLT debe devolverse a MSI para su evaluaci\u00f3n y determinar qu\u00e9 componente tiene la fuga.","Install jumper #4 on the main circuit board (XV models).":"Instale el puente n.\u00ba 4 en la placa principal (modelos XV).","Set the power module inlet voltage selector to 110\u2013120 V.":"Ajuste el selector de tensi\u00f3n de entrada del m\u00f3dulo de alimentaci\u00f3n a 110\u2013120 V.","Run continuous purge again for 5 minutes to ensure the HBLT is full of water.":"Ejecute de nuevo una purga continua durante 5 minutos para asegurarse de que el HBLT est\u00e9 lleno de agua.","Pin the clevis and pivot arm blocks to the base plate.":"Fije con pasadores los bloques de la horquilla y del brazo pivotante a la placa base.","Purge the HBLT, calibrate the HBLT, then re-run the volume correction.":"Purgue el HBLT, cal\u00edbrelo y vuelva a ejecutar la correcci\u00f3n de volumen.","Plug the transducer cable back into the main HBLT circuit board.":"Vuelva a conectar el cable del transductor a la placa principal del HBLT.","Replace the back-up/RAM batteries \u2014 or, if the HBLT has the older-style main circuit board, install a new circuit board.":"Sustituya las bater\u00edas de respaldo/RAM o, si el HBLT tiene la placa principal de estilo antiguo, instale una placa nueva.","Properly purge and calibrate the HBLT.":"Purgue y calibre correctamente el HBLT.","Replace the defective component: serial ribbon cable, bulkhead pin connector assembly, or external serial cable.":"Sustituya el componente defectuoso: cable plano serie, conjunto del conector pasamuros o cable serie externo.","Change the compression-fitting rubber O-ring often \u2014 a damaged O-ring causes connection problems. Use a quality connector such as the Plasti-Mate Tuohy-Borst made by S4J Manufacturing (PN A7530).":"Cambie con frecuencia la junta t\u00f3rica de goma del racor de compresi\u00f3n: una junta da\u00f1ada causa problemas de conexi\u00f3n. Use un conector de calidad como el Plasti-Mate Tuohy-Borst de S4J Manufacturing (ref. A7530).","Mark the balloon stem with a black marker right at the connection so you can see if it slips during the test.":"Marque el v\u00e1stago del bal\u00f3n con un rotulador negro justo en la conexi\u00f3n para poder ver si se desliza durante la prueba.","If needed, insert a hypo tube inside the I.D. of the product tube so the fitting can be compressed sufficiently without collapsing the fluid path. This also gives more repeatable product-to-product results.":"Si es necesario, inserte un tubo hipod\u00e9rmico dentro del di\u00e1metro interior del tubo del producto para que el racor pueda apretarse lo suficiente sin colapsar el paso del fluido. Esto tambi\u00e9n da resultados m\u00e1s repetibles de un producto a otro.","Leak-check the HBLT: install a metal cap or ball valve directly on the outlet, run a simple ramp test to the HBLT's maximum pressure and dwell for 60 seconds. If pressure decays more than 10 % in 60 seconds, contact service@machinesolutions.com.":"Compruebe la estanqueidad del HBLT: instale un tap\u00f3n met\u00e1lico o una v\u00e1lvula de bola directamente en la salida, ejecute una prueba de rampa simple hasta la presi\u00f3n m\u00e1xima del HBLT y mantenga durante 60 segundos. Si la presi\u00f3n cae m\u00e1s de un 10 % en 60 segundos, contacte con service@machinesolutions.com.","Increase the burst or leak detection setting so these product deformations are ignored. Pressure Manager software is a good tool for detecting and characterizing sudden volume changes.":"Aumente el ajuste de detecci\u00f3n de rotura o fuga para que estas deformaciones del producto se ignoren. El software Pressure Manage
