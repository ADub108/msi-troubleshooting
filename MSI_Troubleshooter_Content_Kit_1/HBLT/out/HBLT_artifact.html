r es una buena herramienta para detectar y caracterizar cambios bruscos de volumen.","Increase the down burst rate or decrease the down ramp rate.":"Aumente la velocidad de rotura en bajada (down burst) o reduzca la velocidad de rampa de bajada.","Make sure the compliance settings are correct (not too high).":"Aseg\u00farese de que los ajustes de compliance sean correctos (no demasiado altos).","Check the HBLT calibration and adjust if necessary; make sure the zero point is adjusted close to zero.":"Compruebe la calibraci\u00f3n del HBLT y aj\u00fastela si es necesario; aseg\u00farese de que el punto cero est\u00e9 ajustado cerca de cero.","Inspect the product for pinhole leaks.":"Inspeccione el producto en busca de microfugas (pinholes).","Check the maximum volume output of your HBLT model and verify how much volume each product needs to reach test pressure.":"Compruebe el volumen m\u00e1ximo de salida de su modelo de HBLT y verifique cu\u00e1nto volumen necesita cada producto para alcanzar la presi\u00f3n de prueba.","Replace the limit switches.":"Sustituya los interruptores de fin de carrera.","Turn the power off and let the HBLT cool for 5 minutes. If the problem reappears, contact service@machinesolutions.com.":"Apague la unidad y deje que el HBLT se enfr\u00ede durante 5 minutos. Si el problema reaparece, contacte con service@machinesolutions.com.","Contact service@machinesolutions.com for assistance in resolving this problem.":"Contacte con service@machinesolutions.com para obtener ayuda con este problema.","Relieve pressure before disconnecting: cover the outlet luer with a rag or towel when disconnecting, and keep the HBLT switched off while it cools.":"Libere la presi\u00f3n antes de desconectar: cubra el luer de salida con un trapo o pa\u00f1o al desconectarlo y mantenga el HBLT apagado mientras se enfr\u00eda.","Do not touch components inside the HBLT \u2014 many are static sensitive. Unplug the unit before removing the cover.":"No toque los componentes del interior del HBLT: muchos son sensibles a la electricidad est\u00e1tica. Desenchufe la unidad antes de retirar la tapa.","Over-tightening the Tuohy-Borst fitting can collapse the tubing, restricting fluid flow and pressurization of the product under test.":"Apretar en exceso el conector Tuohy-Borst puede colapsar el tubo y restringir el flujo de fluido y la presurizaci\u00f3n del producto bajo prueba.","Disconnect the HBLT from mains power before changing the voltage selector or opening the unit.":"Desconecte el HBLT de la red el\u00e9ctrica antes de cambiar el selector de tensi\u00f3n o abrir la unidad.","If this error appears while a test is running (not during purge), stop and contact service@machinesolutions.com.":"Si este error aparece durante una prueba (no durante la purga), det\u00e9ngase y contacte con service@machinesolutions.com.","If this error appears while the HBLT is idle, contact service@machinesolutions.com.":"Si este error aparece con el HBLT inactivo, contacte con service@machinesolutions.com."},"es-419":{"Machine line":"L\u00ednea de m\u00e1quina","View":"Vista","Guided fix":"Soluci\u00f3n guiada","Full matrix":"Matriz completa","Mode":"Modo","Operator":"Operador","MSI internal":"MSI interno","Language":"Idioma","Start over":"Empezar de nuevo","Cause":"Causa","Adjustment":"Ajuste","potential causes, most likely first":"causas posibles, la m\u00e1s probable primero","adjustments, in the order to try them":"ajustes, en el orden en que deben probarse","Check and adjust":"Revisar y ajustar","What to do and why":"Qu\u00e9 hacer y por qu\u00e9","Caution":"Precauci\u00f3n","Yes, fixed":"S\u00ed, resuelto","No, next cause":"No, siguiente causa","No, next adjustment":"No, siguiente ajuste","Not applicable, skip":"No aplica, omitir","Back":"Atr\u00e1s","Did MSI Service resolve it, or do you want to move on?":"\u00bfLo resolvi\u00f3 el Servicio de MSI o desea continuar?","item.":"\u2014 tarea de servicio.","Resolved":"Resuelto","Resolved \u2014 cause:":"Resuelto \u2014 causa:","If the problem returns, start here first.":"Si el problema vuelve a aparecer, empiece por aqu\u00ed.","Not resolved":"No resuelto","All listed causes tried without resolving the problem":"Se han probado todas las causas indicadas sin resolver el problema","Support summary (copy and send)":"Resumen para el soporte (copiar y enviar)","Copy summary":"Copiar resumen","Copied":"Copiado","Troubleshoot this problem again":"Repetir la soluci\u00f3n de este problema","Choose another problem":"Elegir otro problema","Change":"Cambiar","Problem":"Problema","Potential cause":"Causa posible","Remedy":"Soluci\u00f3n","Cautions":"Precauciones","Run guided fix for this problem":"Iniciar la soluci\u00f3n guiada de este problema","problem descriptions":"descripciones de problemas","cause/remedy pairs":"pares causa/soluci\u00f3n","Code glossary":"Glosario de c\u00f3digos","internal":"interno","Diagnostic codes":"C\u00f3digos de diagn\u00f3stico","Caution codes":"C\u00f3digos de precauci\u00f3n","reference":"referencia","Source:":"Fuente:","If the guided steps don't resolve the problem, contact":"Si los pasos guiados no resuelven el problema, contacte a","with the summary the tool prepares for you.":"con el resumen que la herramienta prepara para usted.","Internal mode shows source code references and service-level repair steps.":"El modo interno muestra las referencias de c\u00f3digos de la fuente y los pasos de reparaci\u00f3n de nivel de servicio.","fixed":"resuelto","no change":"sin cambios","skipped":"omitido","MSI internal note":"Nota interna de MSI","service":"servicio","support summary":"resumen para el soporte","Machine line:":"L\u00ednea de m\u00e1quina:","Problem:":"Problema:","Date:":"Fecha:","Steps worked through:":"Pasos realizados:","FIXED":"RESUELTO","tried, not fixed":"probado, no resuelto","skipped / not applicable":"omitido / no aplica","Install this troubleshooter":"Instalar esta gu\u00eda de soluci\u00f3n de problemas","Works offline on the shop floor.":"Funciona sin conexi\u00f3n en la planta.","Tap the Share button, then \"Add to Home Screen\".":"Toque el bot\u00f3n Compartir y luego \u00abAgregar a pantalla de inicio\u00bb.","Install":"Instalar","Tip types, tooling, parameters and materials":"Tipos de punta, herramental, par\u00e1metros y materiales","glossary":"glosario","Change problem":"Cambiar de problema","HBLT Troubleshooter":"Gu\u00eda de soluci\u00f3n de problemas HBLT","What is the HBLT doing?":"\u00bfQu\u00e9 est\u00e1 haciendo el HBLT?","Pick the symptom or on-screen message that matches. Error messages are listed by the wording shown on the HBLT display.":"Elija el s\u00edntoma o el mensaje en pantalla que coincida. Los mensajes de error aparecen con el texto exacto que muestra la pantalla del HBLT.","guided fix":"soluci\u00f3n guiada","Resolve an HBLT problem one likely cause at a time":"Resuelva un problema del HBLT una causa probable a la vez","Choose the symptom or error message. The tool walks you through the potential causes in order, with the checks and adjustments for each one. Causes that involve internal components are marked for MSI Service.":"Elija el s\u00edntoma o el mensaje de error. La herramienta lo gu\u00eda por las causas posibles en orden, con las revisiones y ajustes de cada una. Las causas que involucran componentes internos est\u00e1n marcadas para el Servicio de MSI.","Re-run the test. Did this resolve the problem?":"Repita la prueba. \u00bfSe resolvi\u00f3 el problema?","Please add: HBLT model and serial number, firmware/application version, product under test (balloon size, material), test settings (target pressure, ramp rates, compliance), and a photo of the display if an error is shown.":"Agregue: modelo y n\u00famero de serie del HBLT, versi\u00f3n de firmware/aplicaci\u00f3n, producto bajo prueba (tama\u00f1o del bal\u00f3n, material), ajustes de la prueba (presi\u00f3n objetivo, velocidades de rampa, compliance) y una foto de la pantalla si se muestra un error.","MSI Service":"Servicio de MSI","Send the summary below to MSI Service so they can pick up where you left off.":"Env\u00ede el resumen siguiente al Servicio de MSI para que puedan continuar desde donde usted lo dej\u00f3.","Record the settings that produced a clean run in your test procedure so the next set-up starts from a known-good state.":"Anote en su procedimiento de prueba los ajustes con los que la prueba se ejecut\u00f3 correctamente, para que la pr\u00f3xima configuraci\u00f3n parta de un estado conocido y v\u00e1lido.","This fix involves internal components and is carried out by MSI Service or a trained technician. Contact {contact} and mention this cause.":"Esta soluci\u00f3n involucra componentes internos y la realiza el Servicio de MSI o un t\u00e9cnico calificado. Contacte a {contact} e indique esta causa.","HBLT troubleshooting matrix":"Matriz de soluci\u00f3n de problemas del HBLT","Purge under vacuum (3 cycles) before chasing any pressure problem \u2014 air in the system is the most common cause.":"Purgue al vac\u00edo (3 ciclos) antes de investigar cualquier problema de presi\u00f3n: el aire en el sistema es la causa m\u00e1s frecuente.","Note the current test settings (target pressure, ramp rates, compliance, burst/leak detection) before changing anything.":"Anote los ajustes actuales de la prueba (presi\u00f3n objetivo, velocidades de rampa, compliance, detecci\u00f3n de rotura/fuga) antes de cambiar nada.","If nothing in the list resolves it, the tool prepares a summary you can send to MSI Service.":"Si nada de la lista lo resuelve, la herramienta prepara un resumen que puede enviar al Servicio de MSI.","Test results & pressure behavior":"Resultados de prueba y comportamiento de la presi\u00f3n","Error messages on the display":"Mensajes de error en la pantalla","Machine behavior & hardware":"Comportamiento de la m\u00e1quina y hardware","Internal AM HBLT Troubleshooting Guide":"Gu\u00eda interna de soluci\u00f3n de problemas HBLT (AM)","Excessive burping (clicking) when trying to run a test":"Burbujeo excesivo (chasquidos) al intentar ejecutar una prueba","The zero-pressure point of the HBLT has drifted":"El punto cero de presi\u00f3n del HBLT se ha desviado","Some burping is normal, especially with a high purge rate \u2014 2 to 4 clicks on average is fine. If the HBLT is burping excessively it is most likely sitting more than \u00b12 PSI from zero when open to atmosphere.":"Cierto burbujeo es normal, sobre todo con una velocidad de purga alta: de 2 a 4 chasquidos en promedio es aceptable. Si el HBLT burbujea en exceso, lo m\u00e1s probable es que est\u00e9 a m\u00e1s de \u00b12 PSI del cero cuando est\u00e1 abierto a la atm\u00f3sfera.","Low temperature and/or high humidity are causing the transducer's zero point to drift":"La baja temperatura y/o la humedad alta hacen que el punto cero del transductor se desv\u00ede","The carboy is positioned too high above the HBLT inlet":"El garraf\u00f3n est\u00e1 colocado demasiado alto respecto a la entrada del HBLT","Pressure overshoots the programmed target":"La presi\u00f3n sobrepasa el objetivo programado","Air in the system (most common)":"Aire en el sistema (la causa m\u00e1s frecuente)","Incorrect compliance setting":"Ajuste de compliance incorrecto","Up ramp rate set too high":"Velocidad de rampa de subida demasiado alta","False burst reported \u2014 product is intact with no leak":"Rotura falsa notificada: el producto est\u00e1 intacto y sin fugas","Tubing slipping in the Tuohy-Borst fitting, causing a sudden pressure drop":"El tubo se desliza en el conector Tuohy-Borst y provoca una ca\u00edda brusca de presi\u00f3n","The product changed volume suddenly without a leak or burst (aneurysm / deformation)":"El producto cambi\u00f3 de volumen bruscamente sin fuga ni rotura (aneurisma / deformaci\u00f3n)","An internal HBLT leak":"Una fuga interna del HBLT","False burst at the start of the down ramp":"Rotura falsa al inicio de la rampa de bajada","The up-burst or down-burst setting is too close to the down ramp rate":"El ajuste de rotura en subida (up burst) o en bajada (down burst) est\u00e1 demasiado cerca de la velocidad de rampa de bajada","False burst at the beginning of a test":"Rotura falsa al comienzo de una prueba","The starting pressure is negative (below zero), so the HBLT sees a downward pressure decay":"La presi\u00f3n inicial es negativa (por debajo de cero), por lo que el HBLT detecta una ca\u00edda de presi\u00f3n","Volume correction fails":"La correcci\u00f3n de volumen falla","The HBLT needs to be calibrated":"El HBLT necesita calibrarse","\"Motor Stalled\" error while purging under vacuum":"Error \u00abMotor Stalled\u00bb al purgar al vac\u00edo","The HBLT needs calibration (it purges fine into an open container but stalls under vacuum)":"El HBLT necesita calibraci\u00f3n (purga bien en un recipiente abierto pero se bloquea al vac\u00edo)","Motor overheating":"Sobrecalentamiento del motor","Motor power cable not securely connected (new or recently calibrated units)":"Cable de alimentaci\u00f3n del motor mal conectado (unidades nuevas o reci\u00e9n calibradas)","Actuator fully extended or retracted and jammed":"Actuador totalmente extendido o retra\u00eddo y atascado","Encoder cable unplugged":"Cable del encoder desconectado","Motor power connections unplugged":"Conexiones de alimentaci\u00f3n del motor desconectadas","Encoder failure":"Falla del encoder","Motor failure":"Falla del motor","Encoder circuit failure on the main board":"Falla del circuito del encoder en la tarjeta principal","Motor driver failure on the main board":"Falla del controlador del motor en la tarjeta principal","\"Motor Overheating\" error while running a test":"Error \u00abMotor Overheating\u00bb durante una prueba","The actuator motor got hot during a long high-pressure hold or a high-cycle fatigue test":"El motor del actuador se calent\u00f3 durante una retenci\u00f3n prolongada a alta presi\u00f3n o una prueba de fatiga de muchos ciclos","Connector leads unplugged from the main circuit board":"Cables del conector desconectados de la tarjeta principal","Motor temperature sensor is broken":"El sensor de temperatura del motor est\u00e1 da\u00f1ado","\"Motor Driver is too hot\" message":"Mensaje \u00abMotor Driver is too hot\u00bb","The circuits that power the pressure motor have overheated; continued operation risks damage":"Los circuitos que alimentan el motor de presi\u00f3n se han sobrecalentado; seguir operando puede causar da\u00f1os","\"Pressure Limit Exceeded\" error while running a test":"Error \u00abPressure Limit Exceeded\u00bb durante una prueba","The HBLT needs to be calibrated (hydraulic pressure exceeded its operational limits)":"El HBLT necesita calibrarse (la presi\u00f3n hidr\u00e1ulica super\u00f3 sus l\u00edmites operativos)","Target pressure is close to the HBLT's maximum pressure limit":"La presi\u00f3n objetivo est\u00e1 cerca del l\u00edmite m\u00e1ximo de presi\u00f3n del HBLT","\"Cylinder is out of water, check for leaks\" while running a test":"\u00abCylinder is out of water, check for leaks\u00bb durante una prueba","The product leaks, or is very compliant or large, so the cylinder runs out of volume before reaching and holding target pressure":"El producto tiene fugas, o es muy el\u00e1stico o grande, por lo que el cilindro se queda sin volumen antes de alcanzar y mantener la presi\u00f3n objetivo","Applies when not using a FILL. The message appears when the actuator reaches the exhaust limit switch during a test.":"Aplica cuando no se usa un FILL. El mensaje aparece cuando el actuador alcanza el interruptor de fin de carrera de escape durante una prueba.","Internal HBLT leakage":"Fuga interna del HBLT","\"Exhaust Limit\" error":"Error \u00abExhaust Limit\u00bb","An HBLT or product leak prevents reaching target pressure, so the exhaust limit switch trips":"Una fuga en el HBLT o en el producto impide alcanzar la presi\u00f3n objetivo, por lo que se activa el interruptor de fin de carrera de escape","The product is too compliant or large for this HBLT model to reach the set pressure":"El producto es demasiado el\u00e1stico o grande para que este modelo de HBLT alcance la presi\u00f3n configurada","Bad limit switches":"Interruptores de fin de carrera defectuosos","\"Fill Timeout\" during the fill sequence":"\u00abFill Timeout\u00bb durante la secuencia de llenado","Wrong inlet voltage selected on the power module":"Voltaje de entrada incorrecto seleccionado en el m\u00f3dulo de alimentaci\u00f3n","XV models \u2014 jumper #4 missing on the main circuit board":"Modelos XV: falta el jumper #4 en la tarjeta principal","The fill operation timed out without encountering a limit switch.":"La operaci\u00f3n de llenado agot\u00f3 el tiempo sin encontrar un interruptor de fin de carrera.","\"Intake Timeout\" message":"Mensaje \u00abIntake Timeout\u00bb","\"Purge Timeout\" during purging":"\u00abPurge Timeout\u00bb durante la purga","New HBLTs ship with no water in the hydraulic circuit":"Los HBLT nuevos se env\u00edan sin agua en el circuito hidr\u00e1ulico","\"Transducer Not Installed\" message":"Mensaje \u00abTransducer Not Installed\u00bb","The transducer is not connected to the main board":"El transductor no est\u00e1 conectado a la tarjeta principal","\"Invalid Calibration\" message":"Mensaje \u00abInvalid Calibration\u00bb","The HBLT needs to be re-calibrated":"El HBLT necesita recalibrarse","Back-up / RAM batteries have died":"Las bater\u00edas de respaldo / RAM se han agotado","\"No Application Present\" message":"Mensaje \u00abNo Application Present\u00bb","\"Invalid Exhaust/Intake Limits\" message":"Mensaje \u00abInvalid Exhaust/Intake Limits\u00bb","The intake and exhaust limit switches are both on at the same time":"Los interruptores de fin de carrera de admisi\u00f3n y de escape est\u00e1n activados al mismo tiempo","\"Error Code #XXX\" message":"Mensaje \u00abError Code #XXX\u00bb","An internal software error was detected":"Se detect\u00f3 un error interno del software","Tests, pressurization count and other settings have disappeared":"Las pruebas, el contador de presurizaciones y otros ajustes han desaparecido","Display is dim":"La pantalla est\u00e1 tenue","Beep is quiet":"El pitido es muy bajo","\"Doink\" noise from the unit":"Ruido tipo \u00abdoink\u00bb en la unidad","The clevis and pivot arm blocks are not pinned to the base plate":"Los bloques de la horquilla y del brazo pivotante no est\u00e1n fijados con pasadores a la placa base","Can't download the HBLT application software":"No se puede descargar el software de aplicaci\u00f3n del HBLT","Defective serial ribbon cable, bulkhead pin connector assembly, or external serial cable":"Cable plano serie, conjunto del conector pasamuros o cable serie externo defectuosos","Calibrate the HBLT. Follow the calibration procedure in the Owner's Manual; a 'How To' demonstration video on calibrating the HBLT is available from MSI (formerly on the Crescent Design website).":"Calibre el HBLT. Siga el procedimiento de calibraci\u00f3n del manual del propietario; MSI dispone de un video demostrativo sobre c\u00f3mo calibrar el HBLT (antes en el sitio web de Crescent Design).","Make sure the testing environment meets the recommended specifications: operating temperature 59\u2013104 \u00b0F (15\u201340 \u00b0C); humidity 35\u201385 % RH, non-condensing.":"Aseg\u00farese de que el entorno de prueba cumpla las especificaciones recomendadas: temperatura de operaci\u00f3n 15\u201340 \u00b0C (59\u2013104 \u00b0F); humedad 35\u201385 % HR, sin condensaci\u00f3n.","Position the carboy level with the inlet of the HBLT. If the carboy sits above the inlet, head pressure can exceed the zero point of the HBLT.":"Coloque el garraf\u00f3n al nivel de la entrada del HBLT. Si el garraf\u00f3n queda por encima de la entrada, la presi\u00f3n hidrost\u00e1tica puede superar el punto cero del HBLT.","Purge the HBLT under vacuum every morning or before the start of each shift. Run a total of 3 purge cycles under vacuum.":"Purgue el HBLT al vac\u00edo cada ma\u00f1ana o antes de comenzar cada turno. Ejecute un total de 3 ciclos de purga al vac\u00edo.","Always make sure the parts under test are prepped and purged of air for best test results.":"Aseg\u00farese siempre de que las piezas bajo prueba est\u00e9n preparadas y purgadas de aire para obtener los mejores resultados.","Increase the compliance setting.":"Aumente el ajuste de compliance.","Lower the (up) ramp rate.":"Reduzca la velocidad de rampa (de subida).","Turn off the HBLT. Place a rag or towel over the luer connection at the outlet and disconnect it to relieve the pressure. Leave the HBLT turned off for 30 minutes to let the motor cool.":"Apague el HBLT. Cubra la conexi\u00f3n luer de la salida con un trapo o pa\u00f1o y descon\u00e9ctela para liberar la presi\u00f3n. Deje el HBLT apagado durante 30 minutos para que el motor se enfr\u00ede.","Check that the motor power cable is securely connected at both ends \u2014 at the motor and at the main circuit board.":"Revise que el cable de alimentaci\u00f3n del motor est\u00e9 bien conectado en ambos extremos: en el motor y en la tarjeta principal.","Check the encoder cable connection at both ends.":"Revise la conexi\u00f3n del cable del encoder en ambos extremos.","Replace the motor on the actuator.":"Reemplace el motor del actuador.","Replace the HBLT main circuit board.":"Reemplace la tarjeta principal del HBLT.","Remove the actuator from the HBLT and power-test it to confirm full, normal travel.":"Retire el actuador del HBLT y pru\u00e9belo con alimentaci\u00f3n para confirmar un recorrido completo y normal.","Calibrate the HBLT and run the test again. If the issue persists, contact service@machinesolutions.com.":"Calibre el HBLT y repita la prueba. Si el problema persiste, contacte a service@machinesolutions.com.","Lower the ramp rate. The HBLT may be overshooting its maximum pressure limit because the ramp rate is too high.":"Reduzca la velocidad de rampa. Es posible que el HBLT est\u00e9 sobrepasando su l\u00edmite m\u00e1ximo de presi\u00f3n porque la velocidad de rampa es demasiado alta.","Check the product for leaks.":"Revise si el producto tiene fugas.","Pre-fill the product before running the test.":"Prellene el producto antes de ejecutar la prueba.","Try constraining the product to limit its compliance.":"Intente restringir el producto para limitar su elasticidad.","Turn off the HBLT and unplug it. Remove the top cover and look for any water inside the unit. If water is present, the HBLT should be returned to MSI for evaluation to determine which component is leaking.":"Apague el HBLT y descon\u00e9ctelo de la corriente. Retire la tapa superior y revise si hay agua dentro de la unidad. Si la hay, el HBLT debe devolverse a MSI para su evaluaci\u00f3n y determinar qu\u00e9 componente tiene la fuga.","Install jumper #4 on the main circuit board (XV models).":"Instale el jumper #4 en la tarjeta principal (modelos XV).","Set the power module inlet voltage selector to 110\u2013120 V.":"Ajuste el selector de voltaje de entrada del m\u00f3dulo de alimentaci\u00f3n a 110\u2013120 V.","Run continuous purge again for 5 minutes to ensure the HBLT is full of water.":"Ejecute de nuevo una purga continua durante 5 minutos para asegurarse de que el HBLT est\u00e9 lleno de agua.","Pin the clevis and pivot arm blocks to the base plate.":"Fije con pasadores los bloques de la horquilla y del brazo pivotante a la placa base.","Purge the HBLT, calibrate the HBLT, then re-run the volume correction.":"Purgue el HBLT, cal\u00edbrelo y vuelva a ejecutar la correcci\u00f3n de volumen.","Plug the transducer cable back into the main HBLT circuit board.":"Vuelva a conectar el cable del transductor a la tarjeta principal del HBLT.","Replace the back-up/RAM batteries \u2014 or, if the HBLT has the older-style main circuit board, install a new circuit board.":"Reemplace las bater\u00edas de respaldo/RAM o, si el HBLT tiene la tarjeta principal de estilo antiguo, instale una tarjeta nueva.","Properly purge and calibrate the HBLT.":"Purgue y calibre correctamente el HBLT.","Replace the defective component: serial ribbon cable, bulkhead pin connector assembly, or external serial cable.":"Reemplace el componente defectuoso: cable plano serie, conjunto del conector pasamuros o cable serie externo.","Change the compression-fitting rubber O-ring often \u2014 a damaged O-ring causes connection problems. Use a quality connector such as the Plasti-Mate Tuohy-Borst made by S4J Manufacturing (PN A7530).":"Cambie con frecuencia el O-ring de hule del conector de compresi\u00f3n: un O-ring da\u00f1ado causa problemas de conexi\u00f3n. Use un conector de calidad como el Plasti-Mate Tuohy-Borst de S4J Manufacturing (n.\u00ba de parte A7530).","Mark the balloon stem with a black marker right at the connection so you can see if it slips during the test.":"Marque el v\u00e1stago del bal\u00f3n con un marcador negro justo en la conexi\u00f3n para poder ver si se desliza durante la prueba.","If needed, insert a hypo tube inside the I.D. of the product tube so the fitting can be compressed sufficiently without collapsing the fluid path. This also gives more repeatable product-to-product results.":"Si es necesario, inserte un tubo hipod\u00e9rmico dentro del di\u00e1metro interior del tubo del producto para que el conector pueda apretarse lo suficiente sin colapsar el paso del fluido. Esto tambi\u00e9n da resultados m\u00e1s repetibles de un producto a otro.","Leak-check the HBLT: install a metal cap or ball valve directly on the outlet, run a simple ramp test to the HBLT's maximum pressure and dwell for 60 seconds. If pressure decays more than 10 % in 60 seconds, contact service@machinesolutions.com.":"Revise si el HBLT tiene fugas: instale un tap\u00f3n met\u00e1lico o una v\u00e1lvula de bola directamente en la salida, ejecute una prueba de rampa simple hasta la presi\u00f3n m\u00e1xima del HBLT y mantenga durante 60 segundos. Si la presi\u00f3n cae m\u00e1s de un 10 % en 60 segundos, contacte a service@machinesolutions.com.","Increase the burst or leak detection setting so these product deformations are ignored. Pressure Manager software is a good tool for detecting and characterizing sudden volume changes.":"Aumente el ajuste de detecci\u00f3n de rotura o fuga para que estas deformaciones del producto se ignoren. El software Pressure Manager es una buena herramienta para detectar y caracterizar cambios bruscos de volumen.","Increase the down burst rate or decrease the down ramp rate.":"Aumente la velocidad de rotura en bajada (down burst) o reduzca la velocidad de rampa de bajada.","Make sure the compliance settings are correct (not too high).":"Aseg\u00farese de que los ajustes de compliance sean correctos (no demasiado altos).","Check the HBLT calibration and adjust if necessary; make sure the zero point is adjusted close to zero.":"Revise la calibraci\u00f3n del HBLT y aj\u00fastela si es necesario; aseg\u00farese de que el punto cero est\u00e9 ajustado cerca de cero.","Inspect the product for pinhole leaks.":"Inspeccione el producto en busca de microfugas (pinholes).","Check the maximum volume output of your HBLT model and verify how much volume each product needs to reach test pressure.":"Revise el volumen m\u00e1ximo de salida de su modelo de HBLT y verifique cu\u00e1nto volumen necesita cada producto para alcanzar la presi\u00f3n de prueba.","Replace the limit switches.":"Reemplace los interruptores de fin de carrera.","Turn the power off and let the HBLT cool for 5 minutes. If the problem reappears, contact service@machinesolutions.com.":"Apague la unidad y deje que el HBLT se enfr\u00ede durante 5 minutos. Si el problema reaparece, contacte a service@machinesolutions.com.","Contact service@machinesolutions.com for assistance in resolving this problem.":"Contacte a service@machinesolutions.com para obtener ayuda con este problema.","Relieve pressure before disconnecting: cover the outlet luer with a rag or towel when disconnecting, and keep the HBLT switched off while it cools.":"Libere la presi\u00f3n antes de desconectar: cubra el luer de salida con un trapo o pa\u00f1o al desconectarlo y mantenga el HBLT apagado mientras se enfr\u00eda.","Do not touch components inside the HBLT \u2014 many are static sensitive. Unplug the unit before removing the cover.":"No toque los componentes del interior del HBLT: muchos son sensibles a la electricidad est\u00e1tica. Desconecte la unidad de la corriente antes de retirar la tapa.","Over-tightening the Tuohy-Borst fitting can collapse the tubing, restricting fluid flow and pressurization of the product under test.":"Apretar en exceso el conector Tuohy-Borst puede colapsar el tubo y restringir el flujo de fluido y la presurizaci\u00f3n del producto bajo prueba.","Disconnect the HBLT from mains power before changing the voltage selector or opening the unit.":"Desconecte el HBLT de la corriente el\u00e9ctrica antes de cambiar el selector de voltaje o abrir la unidad.","If this error appears while a test is running (not during purge), stop and contact service@machinesolutions.com.":"Si este error aparece durante una prueba (no durante la purga), det\u00e9ngase y contacte a service@machinesolutions.com.","If this error appears while the HBLT is idle, contact service@machinesolutions.com.":"Si este error aparece con el HBLT inactivo, contacte a service@machinesolutions.com."}},"review":[{"lang":"de","term":"Aufsto\u00dfen","en":"burping","note":"Direct rendering of MSI's jargon. Alternatives: \u201eKlicken\u201c or \u201eBlubbern\u201c \u2014 whichever German-speaking HBLT users actually say."},{"lang":"de","term":"Compliance","en":"compliance","note":"Kept in English as the HBLT setting name. German alternative: \u201eNachgiebigkeit\u201c."},{"lang":"de","term":"Rampenrate","en":"ramp rate","note":"Alternatives: \u201eRampengeschwindigkeit\u201c, \u201eAnstiegsrate\u201c."},{"lang":"de","term":"Berst","en":"burst","note":"\u201eBerstdruck\u201c is standard in German test-lab usage; \u201ePlatzen\u201c is the everyday word. Confirm which the team uses for the burst event."},{"lang":"de","term":"Wasserbeh\u00e4lter","en":"carboy","note":"Generic rendering. Alternatives: \u201eBallonflasche\u201c, \u201eKanister\u201c, or keep \u201eCarboy\u201c."},{"lang":"de","term":"Druckaufnehmer","en":"transducer","note":"Alternative: \u201eDrucksensor\u201c."},{"lang":"de","term":"Aktuator","en":"actuator","note":"Alternatives: \u201eStellantrieb\u201c, \u201eAntrieb\u201c."},{"lang":"de","term":"Gabelkopf","en":"clevis","note":"Mechanical term; confirm against the HBLT parts list."},{"lang":"de","term":"Sp\u00fclen","en":"purge","note":"Alternative: \u201eEntl\u00fcften\u201c (emphasises removing air), which may match the operation better."},{"lang":"de","term":"Troubleshooter","en":"troubleshooter","note":"Anglicism is common in German technical UI; alternative: \u201eFehlerbehebungshilfe\u201c."},{"lang":"es-ES","term":"burbujeo","en":"burping","note":"Alternatives: \u00abchasquidos\u00bb, \u00abeructos\u00bb (colloquial). Confirm the term Spanish-speaking HBLT users use."},{"lang":"es-ES","term":"compliance","en":"compliance","note":"Kept in English as the HBLT setting name. Alternatives: \u00abdistensibilidad\u00bb, \u00abcomplianza\u00bb."},{"lang":"es-ES","term":"rotura","en":"burst","note":"Alternatives: \u00abestallido\u00bb, \u00abrevent\u00f3n\u00bb. Confirm the lab term for the burst event."},{"lang":"es-ES","term":"garrafa","en":"carboy","note":"Alternatives: \u00abbid\u00f3n\u00bb, \u00abgarraf\u00f3n\u00bb."},{"lang":"es-ES","term":"el\u00e1stico","en":"compliant (product)","note":"Alternative: \u00abdistensible\u00bb. Refers to a product that expands a lot under pressure."},{"lang":"es-ES","term":"racor","en":"fitting","note":"Spain usage; \u00abconector\u00bb is used in the Latin American edition."},{"lang":"es-ES","term":"horquilla","en":"clevis","note":"Mechanical term; confirm against the HBLT parts list."},{"lang":"es-ES","term":"velocidad de rampa","en":"ramp rate","note":"Alternative: \u00abtasa de rampa\u00bb."},{"lang":"es-419","term":"burbujeo","en":"burping","note":"Alternatives: \u00abchasquidos\u00bb, \u00abeructos\u00bb (colloquial). Confirm the term Spanish-speaking HBLT users use."},{"lang":"es-419","term":"compliance","en":"compliance","note":"Kept in English as the HBLT setting name. Alternatives: \u00abdistensibilidad\u00bb, \u00abcomplianza\u00bb."},{"lang":"es-419","term":"rotura","en":"burst","note":"Alternatives: \u00abestallido\u00bb, \u00abrevent\u00f3n\u00bb. Confirm the lab term for the burst event."},{"lang":"es-419","term":"garraf\u00f3n","en":"carboy","note":"Mexican usage; elsewhere in Latin America \u00abbid\u00f3n\u00bb or \u00abgarrafa\u00bb."},{"lang":"es-419","term":"el\u00e1stico","en":"compliant (product)","note":"Alternative: \u00abdistensible\u00bb. Refers to a product that expands a lot under pressure."},{"lang":"es-419","term":"horquilla","en":"clevis","note":"Mechanical term; confirm against the HBLT parts list."},{"lang":"es-419","term":"velocidad de rampa","en":"ramp rate","note":"Alternative: \u00abtasa de rampa\u00bb."},{"lang":"es-419","term":"hule","en":"rubber","note":"Mexican usage; \u00abgoma\u00bb or \u00abcaucho\u00bb elsewhere in Latin America."}]};
const UI = KB.ui; const IMGS = KB.images||{};
const LANGS = KB.langs||[{id:"en",label:"English"}]; const TR = KB.tr||{}; const RV = KB.review||[];
let LANG="en"; try{ const l=localStorage.getItem("tt.lang."+KB.lines[0].id); if(l&&LANGS.some(x=>x.id===l)) LANG=l; }catch(e){}
const T = s => { if(s==null) return ""; s=String(s); const d=TR[LANG]; return (d&&d[s])||s; };
const hl = html => { const terms=RV.filter(r=>r.lang===LANG); if(!terms.length) return html; for(const r of terms){ const re=new RegExp("(^|[^\\wäöüÄÖÜßáéíóúñÁÉÍÓÚÑ])("+r.term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\wäöüÄÖÜßáéíóúñÁÉÍÓÚÑ])","gi"); html=html.replace(re,(m,a,b)=>`${a}<mark class="rv" title="${esc("EN: "+r.en+" — "+r.note)}">${b}</mark>`);} return html; };
const tx = s => hl(esc(T(s)));
const SECTIONS_OF = l=>l.sections||KB.sections;
const fig = (im,cls="ph")=>im&&IMGS[im.id]?`<figure class="${cls}"><img src="${IMGS[im.id]}" alt="${esc(im.caption||"")}" loading="lazy"><figcaption>${esc(im.caption||"")}</figcaption></figure>`:"";
const code = (p,k)=>UI.codeStyle==="numeric"?p+k:k;
const svcText = ()=>T(UI.serviceP).replace("{contact}",UI.supportContact);
const state = {line:KB.lines[0].id, view:"wizard", mode:"operator", defect:null, idx:0, log:[]};
document.title=UI.title; document.getElementById("appTitle").textContent=UI.title; document.getElementById("appOrg").textContent=UI.org;
try{ const m=localStorage.getItem("tt.mode."+KB.lines[0].id); if(m) state.mode=m; }catch(e){}

const line = ()=>KB.lines.find(l=>l.id===state.line);
const defect = ()=>line().defects.find(d=>d.id===state.defect);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const internal = ()=>state.mode==="internal";
const $ = id=>document.getElementById(id);

function renderTop(){
  $("lineCtl").hidden = KB.lines.length<2;
  $("langCtl").hidden = LANGS.length<2;
  $("langSeg").innerHTML = LANGS.map(l=>`<button data-lang="${l.id}" aria-pressed="${l.id===LANG}">${esc(l.label)}</button>`).join("");
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T(el.dataset.t); });
  document.title = T(UI.title); document.getElementById("appTitle").textContent = T(UI.title);
  $("lineSeg").innerHTML = KB.lines.map(l=>{
    const empty = !l.defects.length;
    return `<button data-line="${l.id}" aria-pressed="${l.id===state.line}" ${empty?"disabled title='Content not yet loaded'":""}>${esc(l.name)}${empty?'<span class="tag">SOON</span>':""}</button>`;
  }).join("");
  document.querySelectorAll("#viewSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===state.view));
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===state.mode));
  $("foot").innerHTML = `${T("Source:")} ${tx(line().source)}. ${internal()?T("Internal mode shows source code references and service-level repair steps."):T("If the guided steps don't resolve the problem, contact")+" "+tx(UI.supportName)+" "+T("with the summary the tool prepares for you.")}`;
}

function renderPicker(){
  const L=line(); const SECTIONS=SECTIONS_OF(L);
  let html = `<header><h2>${tx(UI.pickerTitle)}</h2><p>${tx(UI.pickerHelp)}</p></header>`;
  let n=0;
  for(const sec of Object.keys(SECTIONS)){
    const ds=L.defects.filter(d=>d.section===sec); if(!ds.length) continue;
    html += `<div class="group"><div class="eyebrow">${tx(SECTIONS[sec])}</div>`+
      ds.map(d=>{ n++; return `<button class="defect" data-defect="${d.id}" aria-current="${d.id===state.defect}"><span class="n">${internal()? (sec[0].toUpperCase()+n):"&#9656;"}</span><span>${tx(d.name)}</span></button>`;}).join("")+`</div>`;
  }
  const cur=L.defects.find(d=>d.id===state.defect);
  html = (cur?`<div class="pcompact"><div><span class="eyebrow">${T("Problem")}</span><b>${tx(cur.name)}</b></div><button class="btn small" data-act="clear">${T("Change")}</button></div>`:"")+html;
  $("picker").innerHTML = html;
  document.body.classList.toggle("has-defect", !!cur && state.view==="wizard");
}

function renderMain(){
  if(state.view==="ref") return renderRef();
  const d=defect();
  if(!d){
    $("main").innerHTML = `<section class="card"><div class="card-b intro">
      <div class="eyebrow">${esc(line().name)} · ${tx(UI.introEyebrow)}</div>
      <h2>${tx(UI.introH2)}</h2>
      <p>${tx(UI.introP)}</p>
      <ol>${UI.introTips.map(t=>`<li>${tx(t)}</li>`).join("")}</ol>
      </div></section>`;
    return;
  }
  const L=line(), n=d.causes.length, SECTIONS=SECTIONS_OF(L), STEP=T(L.stepLabel||"Cause");
  const rail = `<div class="rail">`+d.causes.map((c,i)=>{const r=state.log[i]; return `<span class="${i===state.idx&&state.idx<n?"cur":r?"done-"+r:""}" title="${esc(c.cause)}"></span>`;}).join("")+`</div>`;
  const head = `<div class="card-h"><div><div class="eyebrow">${tx(SECTIONS[d.section])}</div><h2>${tx(d.name)}</h2><div class="meta">${n} ${T((L.stepLabel||"Cause")==="Cause"?"potential causes, most likely first":"adjustments, in the order to try them")}</div></div>
     <button class="btn quiet small refbtn" data-act="restart">${T("Start over")}</button></div>`;

  if(state.idx>=n) return renderOutcome(d, head);
  const c=d.causes[state.idx];
  const svc = c.level==="service" && !internal();
  let j=state.idx; // every cause is its own step (service-level causes show a contact-service card in Operator mode)
  const span=j-state.idx+1;
  const cautions = svc?"":c.cautions.map(k=>`<div class="caution"><b>${T("Caution")}${internal()?" "+code("C",k):""}</b><span>${tx(L.cautions[k])}</span></div>`).join("");
  const steps = svc?`<div class="svc"><b>${tx(UI.supportName)}${T("item.").startsWith("-")||T("item.").startsWith("—")?T("item."):" "+T("item.")}</b> ${hl(esc(svcText()))}</div>`:`<div class="eyebrow">${tx(L.stepsHeading||"Check and adjust")}</div><ol class="steps">${c.remedies.map((k,i)=>`<li><span class="k">${c.remedies.length>1?i+1:"→"}</span><div><p>${tx(L.remedies[k])}</p>${internal()?`<span class="code">Code ${code("D",k)}</span>`:""}${c.image?fig(c.image):""}</div></li>`).join("")}</ol>`;
  const note = c.note?`<p class="note">${tx(c.note)}</p>`:"";
  const intro = state.idx===0&&(d.desc||(d.images||[]).length)?`<p class="desc">${tx(d.desc||"")}</p><div class="phrow">${(d.images||[]).map(im=>fig(im)).join("")}</div>`:"";
  const intNote = internal()&&c.internal?`<div class="int"><span class="eyebrow">${T("MSI internal note")}</span>${esc(c.internal)}</div>`:"";
  $("main").innerHTML = `<section class="card">${head}${rail}<div class="card-b">
    <div class="step-label"><span class="eyebrow">${STEP}${span>1?"s":""} ${state.idx+1}${span>1?"–"+(j+1):""} of ${n}</span><span class="eyebrow" style="color:var(--ink-3)">${internal()?c.remedies.map(k=>code("D",k)).join(", ")+(c.cautions.length?" · "+c.cautions.map(k=>code("C",k)).join(", "):""):""}</span></div>
    ${intro}<div class="cause">${tx(c.cause)}${c.level==="service"?`<span class="lvl">${T("service")}</span>`:""}</div>
    ${note}${cautions}
    ${steps}${intNote}
    <div class="ask"><h3>${svc?T("Did MSI Service resolve it, or do you want to move on?"):tx(L.askQuestion||UI.askQuestion)}</h3>
      <div class="btns"><button class="btn ok" data-act="yes" data-span="${span}">${T("Yes, fixed")}</button><button class="btn primary" data-act="no" data-span="${span}">${T((L.stepLabel||"Cause")==="Cause"?"No, next cause":"No, next adjustment")}</button><button class="btn quiet" data-act="skip" data-span="${span}">${T("Not applicable, skip")}</button>${state.idx>0?`<button class="btn quiet" data-act="back">${T("Back")}</button>`:""}</div></div>
  </div></section>`;
}

function summaryText(d){
  const lines=[`MSI ${T(UI.title)} — ${T("support summary")}`,`${T("Machine line:")} ${line().name}`,`${T("Problem:")} ${T(d.name)} (${T(SECTIONS_OF(line())[d.section])})`,`${T("Date:")} ${new Date().toLocaleString()}`,``,T("Steps worked through:")];
  d.causes.forEach((c,i)=>{const r=state.log[i]; if(!r) return; lines.push(`  ${i+1}. ${T(c.cause)} — ${r==="yes"?T("FIXED"):r==="no"?T("tried, not fixed"):T("skipped / not applicable")}`);});
  lines.push(``,T(UI.summaryExtra));
  return lines.join("\n");
}

function renderOutcome(d, head){
  const fixedIdx = state.log.indexOf("yes");
  const logHtml = `<ul class="log">`+d.causes.map((c,i)=>{const r=state.log[i]; if(!r) return ""; return `<li><span class="pill ${r}">${T(r==="yes"?"fixed":r==="no"?"no change":"skipped")}</span><span>${tx(c.cause)}</span></li>`;}).join("")+`</ul>`;
  const body = fixedIdx>=0
    ? `<div class="outcome good"><div class="eyebrow">${T("Resolved")}</div><h2>${T("Resolved — cause:")} ${tx(d.causes[fixedIdx].cause)}</h2><p>${tx(UI.resolvedP)} ${T("If the problem returns, start here first.")}</p>${logHtml}</div>`
    : `<div class="outcome escalate"><div class="eyebrow">${T("Not resolved")}</div><h2>${T("All listed causes tried without resolving the problem")}</h2><p>${tx(UI.escalateP)}</p>${logHtml}
       <div class="summary"><div class="eyebrow">${T("Support summary (copy and send)")}</div><textarea id="sum" readonly>${esc(summaryText(d))}</textarea><div class="btns" style="margin-top:8px"><button class="btn primary small" data-act="copy">${T("Copy summary")}</button></div></div>
       <div class="support"><b>${tx(UI.supportName)}</b> — ${UI.supportContact.includes("@")?`<a href="mailto:${esc(UI.supportContact)}?subject=${encodeURIComponent(T(UI.title)+": "+T(d.name))}&body=${encodeURIComponent(summaryText(d))}" style="color:var(--accent)">${esc(UI.supportContact)}</a>`:esc(UI.supportContact)}</div></div>`;
  $("main").innerHTML = `<section class="card">${head}${body}<div class="card-b" style="border-top:1px solid var(--line)"><div class="btns"><button class="btn" data-act="restart">${T("Troubleshoot this problem again")}</button><button class="btn quiet" data-act="clear">${T("Choose another problem")}</button></div></div></section>`;
}

function renderRef(){
  const L=line(); const SECTIONS=SECTIONS_OF(L);
  const groups = Object.keys(SECTIONS).map(sec=>{
    const ds=L.defects.filter(d=>d.section===sec); if(!ds.length) return "";
    return ds.map(d=>`<details class="d" ${d.id===state.defect?"open":""} id="ref-${d.id}"><summary>${tx(d.name)}<span class="sec">${tx(SECTIONS[sec])}</span></summary>
      ${d.desc||(d.images||[]).length?`<div class="card-b" style="padding-top:0"><p class="desc">${tx(d.desc||"")}</p><div class="phrow">${(d.images||[]).map(im=>fig(im)).join("")}</div></div>`:""}<div class="tblwrap"><table><thead><tr><th>${T(L.stepLabel||"Potential cause")}</th><th>${T(L.stepLabel?"What to do and why":"Remedy")}</th><th>${T("Cautions")}</th></tr></thead><tbody>`+
      d.causes.map(c=>{const svc=c.level==="service"&&!internal(); return `<tr><td>${tx(c.cause)}${c.level==="service"?`<span class="lvl">${T("service")}</span>`:""}${c.note?`<div style="font-weight:400;font-style:italic;color:var(--ink-3);font-size:.8rem;margin-top:4px">${tx(c.note)}</div>`:""}</td><td>${svc?`<span style="color:var(--ink-2)">${tx(UI.supportName)} — ${hl(esc(svcText()))}</span>`:`<ul>${c.remedies.map(k=>`<li>${internal()?`<span class="c">${code("D",k)}</span>`:""}${tx(L.remedies[k])}</li>`).join("")}</ul>`}</td><td>${svc?"":c.cautions.map(k=>`<div style="margin:2px 0">${internal()?`<span class="c">${code("C",k)}</span>`:""}${tx(L.cautions[k])}</div>`).join("")||"<span style='color:var(--ink-3)'>—</span>"}</td></tr>`;}).join("")+
      `</tbody></table></div><div class="card-b" style="padding-top:8px"><button class="btn small primary" data-goto="${d.id}">${T("Run guided fix for this problem")}</button></div></details>`).join("");
  }).join("");
  const rvl = RV.filter(r=>r.lang===LANG); const review = rvl.length?`<details class="d" open><summary>Terminology under review<span class="sec">${esc(LANGS.find(l=>l.id===LANG).label)}</span></summary><div class="rvlist"><div style="color:var(--ink-2);grid-column:1/-1">Highlighted terms are translation judgment calls for MSI's native-speaking team to confirm. Hover a highlight anywhere in the app to see the English term and the alternatives.</div>${rvl.map(r=>`<div><b><mark class="rv">${esc(r.term)}</mark></b><span><span class="en">EN: ${esc(r.en)}</span> — ${esc(r.note)}</span></div>`).join("")}</div></details>`:"";
  const gl = (L.glossary||[]); const glossary = gl.length?`<details class="d"><summary>${T("Tip types, tooling, parameters and materials")}<span class="sec">${T("glossary")}</span></summary>${[...new Set(gl.map(g=>g.group))].map(grp=>`<div class="gl-h eyebrow">${esc(grp)}</div><div class="gl">${gl.filter(g=>g.group===grp).map(g=>`<div class="g">${g.image&&IMGS[g.image]?`<img src="${IMGS[g.image]}" alt="${esc(g.term)}" loading="lazy">`:""}<div><b>${tx(g.term)}</b>${tx(g.text)}</div></div>`).join("")}</div>`).join("")}</details>`:"";
  const gloss = internal()?`<details class="d"><summary>${T("Code glossary")}<span class="sec">${T("internal")}</span></summary><div class="gloss"><div class="eyebrow" style="grid-column:1/-1">${T("Diagnostic codes")}</div>${Object.entries(L.remedies).map(([k,v])=>`<div><b>${code("D",k)}</b><span>${tx(v)}</span></div>`).join("")}<div class="eyebrow" style="grid-column:1/-1;margin-top:10px">${T("Caution codes")}</div>${Object.entries(L.cautions).map(([k,v])=>`<div><b>${code("C",k)}</b><span>${tx(v)}</span></div>`).join("")}</div></details>`:"";
  $("main").innerHTML = `<section class="card ref"><div class="card-h"><div><div class="eyebrow">${esc(L.name)} · ${T("reference")}</div><h2>${tx(UI.refTitle)}</h2><div class="meta">${L.defects.length} ${T("problem descriptions")} · ${L.defects.reduce((a,d)=>a+d.causes.length,0)} ${T(L.stepLabel?"adjustments":"cause/remedy pairs")} · ${tx(L.source)}</div></div></div><div class="card-b">${groups}${glossary}${gloss}${review}</div></section>`;
  if(state.defect){const el=$("ref-"+state.defect); if(el) el.scrollIntoView({block:"start",behavior:"smooth"});}
}

function render(){ renderTop(); renderPicker(); renderMain(); location.hash = state.defect?`${state.line}/${state.defect}`:state.line; }
function choose(id){ state.defect=id; state.idx=0; state.log=[]; if(state.view==="ref") state.view="wizard"; render(); toMain(); }
function toMain(){ if(window.innerWidth<=860){ const m=$("main"); const y=m.getBoundingClientRect().top+window.scrollY-(document.querySelector(".top").offsetHeight+10); window.scrollTo({top:Math.max(0,y),behavior:"smooth"}); } else window.scrollTo({top:0,behavior:"smooth"}); }

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.line){ state.line=b.dataset.line; state.defect=null; state.idx=0; state.log=[]; render(); }
  else if(b.dataset.lang){ LANG=b.dataset.lang; try{localStorage.setItem("tt.lang."+KB.lines[0].id,LANG)}catch(x){} render(); }
  else if(b.dataset.view){ state.view=b.dataset.view; render(); }
  else if(b.dataset.mode){ state.mode=b.dataset.mode; try{localStorage.setItem("tt.mode."+KB.lines[0].id,state.mode)}catch(x){} render(); }
  else if(b.dataset.defect){ choose(b.dataset.defect); }
  else if(b.dataset.goto){ choose(b.dataset.goto); }
  else if(b.dataset.act){
    const a=b.dataset.act;
    if(a==="yes"||a==="no"||a==="skip"){ const sp=+(b.dataset.span||1); for(let q=0;q<sp;q++) state.log[state.idx+q]=a; state.idx = a==="yes"?defect().causes.length:state.idx+sp; renderMain(); toMain(); }
    else if(a==="back"){ state.idx=Math.max(0,state.idx-1); state.log.length=state.idx; renderMain(); }
    else if(a==="restart"){ state.idx=0; state.log=[]; renderMain(); }
    else if(a==="clear"){ state.defect=null; state.idx=0; state.log=[]; render(); }
    else if(a==="copy"){ const t=$("sum"); t.select(); try{ navigator.clipboard.writeText(t.value); b.textContent=T("Copied"); setTimeout(()=>b.textContent=T("Copy summary"),1500);}catch(x){ document.execCommand("copy"); } }
  }
});

// deep link: #plasticweld/defect-id
(function(){ const h=location.hash.replace("#","").split("/"); if(h[0]&&KB.lines.some(l=>l.id===h[0]&&l.defects.length)) state.line=h[0]; if(h[1]&&line().defects.some(d=>d.id===h[1])) state.defect=h[1]; })();
render();
</script>
