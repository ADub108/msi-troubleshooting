<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>BW-TEC 2711 Troubleshooter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E8ECEF; --line:#CFD6DC; --line-strong:#9AA6B0;
  --ink:#1A222B; --ink-2:#4A5762; --ink-3:#6E7B86;
  --accent:#0E6F73; --accent-ink:#FFFFFF; --accent-soft:#D9EDEE;
  --warn:#B7791F; --warn-soft:#FBF1DC; --warn-ink:#6B4508;
  --ok:#2E7D4F; --ok-soft:#DDF0E4; --bad:#B3261E; --bad-soft:#F8E1DF;
  --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
  --r:6px;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11181E; --surface:#1A232B; --surface-2:#232E37; --line:#34414C; --line-strong:#56656F;
    --ink:#E7ECF0; --ink-2:#B4BFC8; --ink-3:#8593A0;
    --accent:#4FB3B6; --accent-ink:#0B1A1B; --accent-soft:#163A3C;
    --warn:#E0A63A; --warn-soft:#3A2D12; --warn-ink:#F3D28A;
    --ok:#5FBF85; --ok-soft:#16321F; --bad:#E66A61; --bad-soft:#3E1C19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11181E; --surface:#1A232B; --surface-2:#232E37; --line:#34414C; --line-strong:#56656F;
  --ink:#E7ECF0; --ink-2:#B4BFC8; --ink-3:#8593A0;
  --accent:#4FB3B6; --accent-ink:#0B1A1B; --accent-soft:#163A3C;
  --warn:#E0A63A; --warn-soft:#3A2D12; --warn-ink:#F3D28A;
  --ok:#5FBF85; --ok-soft:#16321F; --bad:#E66A61; --bad-soft:#3E1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.hidden,[hidden]{display:none!important}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:.01em}
.brand .sub{font-size:.8rem;color:var(--ink-3)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;font-size:.85rem;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:disabled{color:var(--ink-3);cursor:not-allowed;background:var(--surface-2)}
.seg .tag{font-family:var(--mono);font-size:.62rem;margin-left:6px;opacity:.8}
.ctl{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-3)}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.picker{position:sticky;top:64px}
@media (max-width:860px){.picker{position:static}
 .top-in{padding:8px 14px;gap:8px 12px}.brand h1{font-size:1.05rem}.brand .sub{display:none}.ctl>span{display:none}.seg button{padding:5px 10px;font-size:.8rem}.card-h h2{font-size:1.25rem}.cause{font-size:1.3rem}.card-h,.card-b{padding-left:16px;padding-right:16px}
 body.has-defect .picker header,body.has-defect .picker .group{display:none}
 .pcompact{display:none}body.has-defect .pcompact{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:.9rem}
 .pcompact .eyebrow{display:block}.pcompact>div{flex:1;min-width:0}.pcompact b{display:block;font-family:var(--display);font-size:1rem;line-height:1.2}}
@media (min-width:861px){.pcompact{display:none}}
.picker header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.picker header h2{font-size:1.05rem}
.picker header p{margin:4px 0 0;font-size:.82rem;color:var(--ink-2)}
.group{padding:8px 8px 4px}
.group .eyebrow{padding:8px 8px 4px}
.defect{display:flex;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:8px 10px;gap:10px;align-items:flex-start;font-size:.92rem;line-height:1.35}
.defect:hover{background:var(--surface-2)}
.defect[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.defect .n{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);min-width:2.6em;padding-top:3px;text-align:right}
.defect[aria-current="true"] .n{color:var(--accent)}
.defect span:last-child::first-letter,.card-h h2::first-letter,details.d summary::first-letter{text-transform:uppercase}
.defect span:last-child{display:inline-block}

/* main */
.main{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.card-h>div:first-child{flex:1;min-width:0}
.svc ul{margin:8px 0 0;padding-left:1.2em}.svc li{margin:3px 0}
.card-h h2{font-size:1.55rem;font-weight:700}
.card-h .meta{font-size:.82rem;color:var(--ink-2);margin-top:4px}
.card-b{padding:18px 22px}
.intro{max-width:62ch;color:var(--ink-2)}
.intro h2{color:var(--ink);font-size:1.6rem;margin-bottom:8px}
.intro ol{padding-left:1.2em;margin:10px 0}
.intro li{margin:4px 0}

/* progress rail */
.rail{display:flex;gap:4px;padding:12px 22px 0;flex-wrap:wrap}
.rail span{height:6px;flex:1 1 20px;min-width:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.rail span.done-no{background:var(--line-strong);border-color:var(--line-strong)}
.rail span.done-skip{background:repeating-linear-gradient(45deg,var(--line-strong) 0 3px,transparent 3px 6px)}
.rail span.done-yes{background:var(--ok);border-color:var(--ok)}
.rail span.cur{background:var(--accent);border-color:var(--accent)}

.step-label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.step-label .eyebrow{color:var(--accent)}
.cause{font-family:var(--display);font-size:1.6rem;font-weight:600;margin:6px 0 14px}
.cause::first-letter{text-transform:uppercase}
.caution{border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--warn-ink);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin:0 0 10px;font-size:.92rem;display:flex;gap:10px}
.caution b{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding-top:3px}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.steps .k{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--accent);line-height:1.1}
.steps .code{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);display:block;margin-top:4px}
.steps p{margin:0}
.steps p::first-letter{text-transform:uppercase}
.ask{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.ask h3{font-size:1.05rem;margin-bottom:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:9px 16px;font-weight:600;font-size:.92rem}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok:hover{background:var(--ok-soft)}
.btn.quiet{border-color:transparent;color:var(--ink-2)}
.btn.small{padding:5px 10px;font-size:.8rem;font-weight:500}

/* outcome */
.outcome{padding:22px}
.outcome h2{font-size:1.5rem;margin-bottom:6px}
.outcome.good{border-top:4px solid var(--ok)}
.outcome.escalate{border-top:4px solid var(--warn)}
.log{list-style:none;margin:14px 0;padding:0;display:grid;gap:6px;font-size:.9rem}
.log li{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline}
.pill{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid}
.pill.yes{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.no{color:var(--ink-2);border-color:var(--line-strong);background:var(--surface-2)}
.pill.skip{color:var(--ink-3);border-color:var(--line);background:transparent}
.summary{margin-top:14px}
.summary textarea{width:100%;min-height:150px;font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface-2);color:var(--ink);resize:vertical}
.support{margin-top:14px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r);font-size:.9rem}
.support b{font-family:var(--display)}

/* reference */
.ref .card-b{padding:0}
details.d{border-top:1px solid var(--line)}
details.d:first-of-type{border-top:0}
details.d summary{list-style:none;cursor:pointer;padding:12px 22px;display:flex;gap:12px;align-items:baseline;font-family:var(--display);font-size:1.1rem;font-weight:600}
details.d summary::-webkit-details-marker{display:none}
details.d summary::before{content:"+";font-family:var(--mono);color:var(--accent);width:1em}
details.d[open] summary::before{content:"–"}
details.d summary .sec{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-left:auto}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-top:1px solid var(--line)}
th{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--surface-2)}
td:first-child{width:24%;font-weight:600}
td:first-child::first-letter,td ul li::first-letter{text-transform:uppercase}
td ul{margin:0;padding-left:1.1em}
td ul li{margin:2px 0}
td .c{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);margin-right:6px}
.gloss{padding:14px 22px;display:grid;gap:6px;font-size:.88rem}
.gloss div{display:grid;grid-template-columns:minmax(44px,max-content) 1fr;gap:10px}
.gloss b{font-family:var(--mono);color:var(--accent);font-weight:500}
.refbtn{margin-left:auto}
.int{border-left:3px solid var(--line-strong);padding:6px 10px;margin-top:10px;font-size:.82rem;color:var(--ink-2);background:var(--surface-2);border-radius:0 4px 4px 0}
.int .eyebrow{display:block;margin-bottom:2px}
.note{font-size:.9rem;color:var(--ink-2);font-style:italic;margin:-6px 0 12px;max-width:70ch}
.svc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;background:var(--accent-soft);font-size:.92rem;margin-top:10px}
.svc b{font-family:var(--display)}
.lvl{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line-strong);color:var(--ink-3);vertical-align:middle;margin-left:6px}
figure.ph{margin:0 0 14px;max-width:520px}figure.ph img{width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line);display:block}figure.ph figcaption{font-size:.78rem;color:var(--ink-3);margin-top:5px}
.phrow{display:flex;gap:14px;flex-wrap:wrap}.phrow figure.ph{flex:1 1 240px;max-width:420px}
.desc{max-width:70ch;color:var(--ink-2);margin:0 0 14px}
.steps figure.ph{margin:10px 0 0;max-width:380px}
.gl{padding:12px 22px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.gl .g{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}.gl .g img{width:100%;aspect-ratio:5/4;object-fit:cover;display:block;border-bottom:1px solid var(--line)}.gl .g div{padding:10px 12px;font-size:.85rem;color:var(--ink-2)}.gl .g b{display:block;font-family:var(--display);font-size:1rem;color:var(--ink);margin-bottom:3px}
.gl-h{padding:14px 22px 0}
mark.rv{background:#FFE58A;color:inherit;padding:0 2px;border-radius:2px;border-bottom:2px dotted #B7791F;cursor:help}
:root[data-theme="dark"] mark.rv{background:#5A4A12}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark.rv{background:#5A4A12}}
.rvlist{padding:12px 22px 18px;display:grid;gap:8px;font-size:.88rem}.rvlist div{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:12px}.rvlist b{font-family:var(--mono);font-weight:500}.rvlist .en{color:var(--ink-3);font-family:var(--mono);font-size:.75rem}
.foot{max-width:1180px;margin:0 auto;padding:0 20px 30px;font-size:.78rem;color:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>


</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand"><h1 id="appTitle"></h1><span class="sub" id="appOrg"></span></div>
  <div class="spacer"></div>
  <div class="ctl" id="lineCtl"><span data-t="Machine line">Machine line</span>
    <div class="seg" id="lineSeg"></div></div>
  <div class="ctl"><span data-t="View">View</span>
    <div class="seg" id="viewSeg">
      <button data-view="wizard" aria-pressed="true" data-t="Guided fix">Guided fix</button>
      <button data-view="ref" aria-pressed="false" data-t="Full matrix">Full matrix</button></div></div>
  <div class="ctl" id="langCtl"><span data-t="Language">Language</span>
    <div class="seg" id="langSeg"></div></div>
  <div class="ctl"><span data-t="Mode">Mode</span>
    <div class="seg" id="modeSeg">
      <button data-mode="operator" aria-pressed="true" data-t="Operator">Operator</button>
      <button data-mode="internal" aria-pressed="false" data-t="MSI internal">MSI internal</button></div></div>
</div></div>

<div class="wrap">
  <aside class="panel picker" id="picker"></aside>
  <main class="main" id="main"></main>
</div>
<div class="foot" id="foot"></div>

process","name":"Tube breaks during stretching (necking)","desc":"The machine detects the break, ejects the tube and continues. Several breaks in a row stop the process (\"Multiple failed tube neckings\"). Work through the causes in order \u2014 the first three are the usual ones.","images":[],"causes":[{"cause":"Dies close too hard, too early","remedies":["START_PRESS"],"cautions":[],"level":"operator"},{"cause":"Axis acceleration too low \u2014 tube is compressed instead of sliding into the die","remedies":["ACC_LOW"],"cautions":[],"level":"operator"},{"cause":"Axis acceleration too high \u2014 no time for die heat to transfer into the material","remedies":["ACC_HIGH"],"cautions":[],"level":"operator"},{"cause":"Tube not centred between the dies (too high or too low) and jammed","remedies":["CENTER"],"cautions":[],"level":"operator"},{"cause":"Die temperature too low","remedies":["TEMP_UP"],"cautions":[],"level":"operator"},{"cause":"Dies dirty","remedies":["DIES_CLEAN"],"cautions":["HOT"],"level":"operator"},{"cause":"Die diameter too small for the tube","remedies":["DIE_DIA"],"cautions":[],"level":"operator"},{"cause":"Stretching speed too high","remedies":["SPEED_DOWN"],"cautions":[],"level":"operator"},{"cause":"Large-diameter tube with a large reduction ratio breaking as the dies close","remedies":["PRESTRETCH"],"cautions":[],"level":"operator"},{"cause":"Small tube breaking as the dies close (older machines with doors)","remedies":["PRETENSION"],"cautions":[],"level":"service"},{"cause":"Small tube clamped between the die contact surfaces","remedies":["ANGLED_DIES"],"cautions":["ADV"],"level":"operator"}]},{"id":"slug-parison-length-is-irregular","section":"process","name":"Slug (parison) length is irregular","desc":"","images":[],"causes":[{"cause":"\"Tube detection sensitivity\" not set correctly","remedies":["SENS_SET"],"cautions":[],"level":"operator"},{"cause":"Fork sensor that detects the edge of the slug is dirty","remedies":["SENS_CLEAN"],"cautions":[],"level":"operator"},{"cause":"Measured length differs consistently from the set value","remedies":["SLUG_CORR"],"cautions":[],"level":"operator"}]},{"id":"machine-reports-a-broken-tube-although-the-tube-did-not-break","section":"process","name":"Machine reports a broken tube although the tube did not break","desc":"","images":[],"causes":[{"cause":"\"Tube detection sensitivity\" not set correctly","remedies":["SENS_SET"],"cautions":[],"level":"operator"},{"cause":"Fork sensor dirty","remedies":["SENS_CLEAN"],"cautions":[],"level":"operator"}]},{"id":"indentation-in-the-tube-from-the-roller-gripper","section":"process","name":"Indentation in the tube from the roller gripper","desc":"The right roller gripper closes on the freshly necked, still-hot tube and can leave a mark.","images":[],"causes":[{"cause":"Roller gripper pressure too high on the still-hot tube leaving the dies","remedies":["ROLL_PRESS"],"cautions":[],"level":"operator"},{"cause":"Indentation persists at minimum pressure","remedies":["ROLL_ADV"],"cautions":["ADV"],"level":"operator"}]},{"id":"marks-from-the-split-die-edges-on-the-slug","section":"process","name":"Marks from the split-die edges on the slug","desc":"","images":[],"causes":[{"cause":"Tube still under tension when the dies open \u2014 strain not relieved","remedies":["STRAIN"],"cautions":["UNDERFILL"],"level":"operator"},{"cause":"Diameter increase right before the slug","remedies":["STRAIN_DELAY"],"cautions":[],"level":"operator"}]},{"id":"necked-tube-stuck-in-one-die-half-after-the-dies-open-neck-damaged-whe","section":"process","name":"Necked tube stuck in one die half after the dies open \u2014 neck damaged when pulled free","desc":"","images":[],"causes":[{"cause":"Dies with angled contact surfaces act as a funnel","remedies":["ANGLED_YES"],"cautions":["ADV"],"level":"operator"}]},{"id":"tube-bends-during-prestretching","section":"process","name":"Tube bends during prestretching","desc":"","images":[],"causes":[{"cause":"Small, flexible tube pushed against the stationary opposite axis","remedies":["SYNC"],"cautions":["ADV"],"level":"operator"}]},{"id":"tube-sags-or-is-off-centre-when-the-dies-close-for-the-left-neck","section":"process","name":"Tube sags or is off-centre when the dies close for the left neck","desc":"","images":[],"causes":[{"cause":"Small tube bending under its own weight","remedies":["PRETENS_LEFT"],"cautions":["ADV"],"level":"operator"}]},{"id":"tube-slips-out-of-the-centering-gripper-while-stretching","section":"process","name":"Tube slips out of the centering gripper while stretching","desc":"","images":[],"causes":[{"cause":"Centering-gripper pressure too low","remedies":["GRIP_UP"],"cautions":[],"level":"operator"},{"cause":"Large-diameter tube \u2014 not all gripper teeth engaged","remedies":["OFFSET_GRIP"],"cautions":["ADV"],"level":"operator"}]},{"id":"tube-is-always-pinched-at-the-top-or-bottom-of-the-die","section":"process","name":"Tube is always pinched at the top or bottom of the die","desc":"","images":[],"causes":[{"cause":"Centering-gripper fingers not at the same height (parallel gripper misaligned)","remedies":["CENTER"],"cautions":[],"level":"operator"}]},{"id":"picker-picks-two-tubes-at-once","section":"handling","name":"Picker picks two tubes at once","desc":"","images":[],"causes":[{"cause":"\"Stroke grip\" not bending the picking fingers slightly","remedies":["STROKE_GRIP"],"cautions":["FINGERS"],"level":"operator"},{"cause":"Picking fingers unsuitable for the tube diameter (e.g. high-friction -NA fingers on small tube)","remedies":["PICK_FINGERS"],"cautions":[],"level":"operator"},{"cause":"Tubes stick together from static charge","remedies":["IONIZER_ON"],"cautions":[],"level":"operator"}]},{"id":"picker-picks-no-tube-empty-picks-or-tubes-hang-from-the-fingers","section":"handling","name":"Picker picks no tube (empty picks) or tubes hang from the fingers","desc":"","images":[],"causes":[{"cause":"Gripper diving depth wrong","remedies":["SENSOR_CORR"],"cautions":[],"level":"operator"},{"cause":"Picking fingers unsuitable for the tube (hanging tubes on large / thick-walled tube)","remedies":["PICK_FINGERS"],"cautions":[],"level":"operator"},{"cause":"Opening stroke or tube diameter wrong in the Picker parameters","remedies":["STROKE_OPEN"],"cautions":[],"level":"operator"},{"cause":"Remaining tubes not in the centre of the hopper","remedies":["IONIZER_ON"],"cautions":[],"level":"operator"},{"cause":"Picker gripper does not close fully or behaves oddly","remedies":["PICKER_MANUAL"],"cautions":[],"level":"operator"}]},{"id":"warning-tube-lack-detected","section":"handling","name":"Warning \"Tube lack detected\"","desc":"","images":[],"causes":[{"cause":"Hopper empty","remedies":["FILL_HOPPER"],"cautions":[],"level":"operator"}]},{"id":"alarm-discharge-monitoring-sensor-left-right-at-tube-picker-blocked","section":"handling","name":"Alarm \"Discharge monitoring sensor left/right at Tube Picker blocked\"","desc":"","images":[],"causes":[{"cause":"Something in front of the left sensor","remedies":["DISCHARGE_L"],"cautions":[],"level":"operator"},{"cause":"Something in front of the right sensor","remedies":["DISCHARGE_R"],"cautions":[],"level":"operator"}]},{"id":"alarm-tube-at-feed-out-not-detected","section":"handling","name":"Alarm \"Tube at feed out not detected\"","desc":"","images":[],"causes":[{"cause":"Tube lost during the process","remedies":["FEEDOUT_LOST"],"cautions":["RESET"],"level":"operator"},{"cause":"Feed-out grippers not closing correctly","remedies":["FEEDOUT_PRESS"],"cautions":[],"level":"operator"}]},{"id":"alarm-light-barrier-at-tube-collector-blocked","section":"handling","name":"Alarm \"Light barrier at tube collector blocked\"","desc":"","images":[],"causes":[{"cause":"Tube or object sticking out of or hanging into the collector","remedies":["COLLECTOR"],"cautions":["RESET"],"level":"operator"}]},{"id":"warning-tube-collector-is-not-closed","section":"handling","name":"Warning \"Tube collector is not closed\"","desc":"","images":[],"causes":[{"cause":"Collector open","remedies":["COLLECTOR_CLOSE"],"cautions":[],"level":"operator"}]},{"id":"alarm-emergency-stop-pressed","section":"alarms","name":"Alarm \"Emergency Stop pressed\"","desc":"","images":[],"causes":[{"cause":"Emergency stop is latched","remedies":["ESTOP"],"cautions":["RESET"],"level":"operator"}]},{"id":"alarm-safety-door-opened-during-process","section":"alarms","name":"Alarm \"Safety door opened during process\"","desc":"","images":[],"causes":[{"cause":"Door opened while running","remedies":["DOOR_RELOAD"],"cautions":["RESET"],"level":"operator"}]},{"id":"alarm-immediate-stop-triggered","section":"alarms","name":"Alarm \"Immediate stop triggered\"","desc":"","images":[],"causes":[{"cause":"Immediate stop","remedies":["HMI_RESET"],"cautions":[],"level":"operator"}]},{"id":"alarm-no-air-pressure-connected","section":"alarms","name":"Alarm \"No air pressure connected\"","desc":"","images":[],"causes":[{"cause":"Main pressure switch","remedies":["AIR_SWITCH"],"cautions":[],"level":"operator"},{"cause":"Compressed-air supply","remedies":["AIR_SUPPLY"],"cautions":[],"level":"operator"}]},{"id":"alarm-tube-detected-despite-process-simulation","section":"alarms","name":"Alarm \"Tube detected despite process simulation\"","desc":"","images":[],"causes":[{"cause":"Tube present in simulation mode","remedies":["SIM"],"cautions":[],"level":"operator"}]},{"id":"alarm-ethercat-disconnected","section":"alarms","name":"Alarm \"EtherCat disconnected\"","desc":"","images":[],"causes":[{"cause":"Ethernet connector loose at a motor controller or the PLC","remedies":["ETHERCAT"],"cautions":[],"level":"operator"}]},{"id":"alarm-error-controller-axis-error-program-axis-picker-necking-feed-in-","section":"alarms","name":"Alarm \"Error controller \u2026 axis\" / \"Error program \u2026 axis\" (picker, necking, feed in, feed out, sensor axis)","desc":"","images":[],"causes":[{"cause":"Drive or program fault on the axis","remedies":["RESET_RESTART"],"cautions":[],"level":"operator"},{"cause":"\"Axis fork sensor\" error keeps returning with a tracking error in JetSym (older PLC software)","remedies":["PLC_290"],"cautions":["SWUPD"],"level":"service"},{"cause":"Festo axes suddenly have less force than they should","remedies":["FESTO_TORQUE"],"cautions":["SWUPD"],"level":"service"}]},{"id":"alarm-error-io-link-connection-picker-gripper","section":"alarms","name":"Alarm \"Error IO-Link connection picker gripper\"","desc":"","images":[],"causes":[{"cause":"IO-Link master or gripper connector disconnected","remedies":["IOLINK"],"cautions":[],"level":"operator"}]},{"id":"alarm-temperature-controller-error","section":"alarms","name":"Alarm \"Temperature controller error\"","desc":"","images":[],"causes":[{"cause":"Critical temperature-controller fault","remedies":["TECH"],"cautions":[],"level":"service"}]},{"id":"alarm-hardware-limit-reached-necking-axis-left-right-sensor-axis","section":"alarms","name":"Alarm \"Hardware limit \u2026 reached\" (necking axis left/right, sensor axis)","desc":"","images":[],"causes":[{"cause":"Left hardware limit of the left necking axis reached","remedies":["PUSH_R50"],"cautions":[],"level":"operator"},{"cause":"Right hardware limit of the right necking axis reached","remedies":["PUSH_L50"],"cautions":[],"level":"operator"},{"cause":"Right hardware limit of the sensor axis reached","remedies":["PUSH_L50"],"cautions":[],"level":"operator"}]},{"id":"alarm-software-limit-reached-necking-axis-left-right-fork-sensor-axis","section":"alarms","name":"Alarm \"Software limit \u2026 reached\" (necking axis left/right, fork sensor axis)","desc":"","images":[],"causes":[{"cause":"Left software limit reached (left necking axis, right necking axis, or fork sensor axis)","remedies":["SW_R"],"cautions":[],"level":"operator"},{"cause":"Right software limit reached (left necking axis, right necking axis, or fork sensor axis)","remedies":["SW_L"],"cautions":[],"level":"operator"},{"cause":"Right software limit of the right necking axis keeps recurring during the process","remedies":["SW_R_RECIPE"],"cautions":[],"level":"operator"}]},{"id":"alarm-avoid-collision-between-necking-axis-right-and-necking-axis-sens","section":"alarms","name":"Alarm \"Avoid collision between necking axis right and necking axis sensor\"","desc":"","images":[],"causes":[{"cause":"Right necking axis too close to the sensor axis","remedies":["COLLISION"],"cautions":[],"level":"operator"},{"cause":"Recurs when the axes return to the start position","remedies":["COLLISION_CYL"],"cautions":[],"level":"service"}]},{"id":"alarm-error-signal-gripper-die-grippers-centering-grippers-roller-grip","section":"alarms","name":"Alarm \"Error signal \u2026 gripper\" (die grippers, centering grippers, roller grippers, feed-out grippers)","desc":"","images":[],"causes":[{"cause":"Gripper blocked, or recipe gripper pressure too low","remedies":["GRIP_PRESS"],"cautions":[],"level":"operator"},{"cause":"\"Error signal feed in centering gripper\"","remedies":["RESET_RESTART"],"cautions":[],"level":"operator"}]},{"id":"alarm-error-signal-cylinder-necking-cylinder-diameter-sensor-feed-in-c","section":"alarms","name":"Alarm \"Error signal \u2026 cylinder\" (necking cylinder diameter sensor, feed-in cylinder)","desc":"","images":[],"causes":[{"cause":"Cylinder blocked","remedies":["CYL_BLOCK"],"cautions":[],"level":"operator"}]},{"id":"alarm-error-temperature-die-front-back-out-of-range","section":"alarms","name":"Alarm \"Error temperature Die front/back out of range\"","desc":"","images":[],"causes":[{"cause":"Wires to the split dies damaged","remedies":["DIE_WIRES"],"cautions":["HOT"],"level":"operator"}]},{"id":"warning-temperature-controller-not-ready","section":"warnings","name":"Warning \"Temperature controller not ready\"","desc":"","images":[],"causes":[{"cause":"Split die has not reached the set temperature yet","remedies":["TEMP_WAIT"],"cautions":[],"level":"operator"}]},{"id":"warning-necking-limit-left-reached","section":"warnings","name":"Warning \"Necking limit left reached\"","desc":"","images":[],"causes":[{"cause":"Required left stretching distance exceeds the axis travel","remedies":["LEFT_LIMIT"],"cautions":[],"level":"operator"},{"cause":"\"Tube detection sensitivity\" not set correctly","remedies":["SENS_SET"],"cautions":[],"level":"operator"}]},{"id":"warning-multiple-failed-tube-neckings-right-necking-failed-left-neckin","section":"warnings","name":"Warning \"Multiple failed tube neckings\" / \"Right necking failed\" / \"Left necking failed\"","desc":"","images":[],"causes":[{"cause":"Several tubes broke consecutively","remedies":["BROKEN_ABORT"],"cautions":["RESET"],"level":"operator"}]},{"id":"warning-safety-door-is-open","section":"warnings","name":"Warning \"Safety door is open\"","desc":"","images":[],"causes":[{"cause":"Door open","remedies":["DOOR_CLOSE"],"cautions":[],"level":"operator"}]},{"id":"warning-error-ionizer-feed-out","section":"warnings","name":"Warning \"Error ionizer feed out\"","desc":"","images":[],"causes":[{"cause":"Ionizer switched off or fan parts not snapped in","remedies":["ION_CHECK"],"cautions":[],"level":"operator"}]},{"id":"warning-maintenance-required-on-ionizer-at-feed-out","section":"warnings","name":"Warning \"Maintenance required on ionizer at feed out\"","desc":"","images":[],"causes":[{"cause":"Emitters need cleaning","remedies":["ION_CLEAN"],"cautions":["IONIZER"],"level":"operator"}]},{"id":"no-picture-on-the-touchscreen","section":"machine","name":"No picture on the touchscreen","desc":"","images":[],"causes":[{"cause":"PC not running","remedies":["PC"],"cautions":[],"level":"operator"},{"cause":"Touchscreen cables / plugs / control light","remedies":["TS_CABLES"],"cautions":[],"level":"operator"},{"cause":"Fuse","remedies":["FUSE"],"cautions":["ELEC"],"level":"service"}]},{"id":"cylinders-are-not-working","section":"machine","name":"Cylinders are not working","desc":"","images":[],"causes":[{"cause":"No compressed air in the machine","remedies":["AIR_SUPPLY"],"cautions":[],"level":"operator"},{"cause":"Control valves not set per work instruction","remedies":["VALVES"],"cautions":[],"level":"operator"}]},{"id":"axes-are-not-moving","section":"machine","name":"Axes are not moving","desc":"","images":[],"causes":[{"cause":"Motor controller shows an error","remedies":["MC_ERR"],"cautions":[],"level":"operator"},{"cause":"Axis standing on a limit switch","remedies":["LIMIT"],"cautions":[],"level":"operator"},{"cause":"Stepper-motor fuses","remedies":["STEP_FUSE"],"cautions":["ELEC"],"level":"service"}]},{"id":"heating-element-does-not-heat-up","section":"machine","name":"Heating element does not heat up","desc":"","images":[],"causes":[{"cause":"Fuse or temperature controller","remedies":["HEAT_FUSE"],"cautions":["ELEC"],"level":"service"},{"cause":"Release relay for the heating process","remedies":["HEAT_RELAY"],"cautions":["ELEC"],"level":"service"},{"cause":"Solid-state relay input / output","remedies":["SSR"],"cautions":["ELEC"],"level":"service"}]},{"id":"set-temperature-is-reached-very-slowly","section":"machine","name":"Set temperature is reached very slowly","desc":"","images":[],"causes":[{"cause":"Heat cartridges faulty","remedies":["CARTRIDGE"],"cautions":["ELEC"],"level":"service"}]},{"id":"temperature-display-shows-about-800-c-above-room-temperature","section":"machine","name":"Temperature display shows about 800 \u00b0C above room temperature","desc":"","images":[],"causes":[{"cause":"Temperature sensor disconnected or short-circuited","remedies":["TSENSOR"],"cautions":["ELEC"],"level":"service"}]},{"id":"process-does-not-start-after-pressing-start","section":"machine","name":"Process does not start after pressing \"Start\"","desc":"","images":[],"causes":[{"cause":"Alarm not cleared","remedies":["ESTOP_RESET"],"cautions":[],"level":"operator"},{"cause":"Control needs a restart","remedies":["MAIN_SWITCH"],"cautions":[],"level":"operator"}]},{"id":"cannot-connect-to-or-download-firmware-to-the-festo-motor-controllers","section":"machine","name":"Cannot connect to or download firmware to the Festo motor controllers","desc":"","images":[],"causes":[{"cause":"PC IP address outside the machine network range","remedies":["FESTO_IP"],"cautions":["SWUPD"],"level":"service"},{"cause":"PLC OS, ESI file and Festo firmware versions do not match","remedies":["FESTO_FW"],"cautions":["SWUPD"],"level":"service"}]},{"id":"annual-maintenance","section":"machine","name":"Annual maintenance","desc":"","images":[],"causes":[{"cause":"Linear axes need lubrication","remedies":["LUBE"],"cautions":["POWER"],"level":"operator"},{"cause":"Toothed belts need inspection","remedies":["BELT"],"cautions":["POWER"],"level":"service"}]}],"remedies":{"RESET_RESTART":"Press \"Reset\" on the HMI. If that does not clear it, restart the machine at the main switch. If the error keeps appearing, contact support.","GRIP_PRESS":"Make sure the gripper is not blocked, and that the gripper pressure in the recipe is set high enough to open and close it.","CYL_BLOCK":"Make sure the cylinder is not blocked.","PUSH_R50":"Push the axis by hand at least 50 mm to the right, then restart the machine to reset the axis reference points.","PUSH_L50":"Push the axis by hand at least 50 mm to the left, then restart the machine to reset the axis reference points.","SW_R":"Make sure the safety door is closed, then press \"Reset\" on the HMI. If that does not work, open the safety door and push the axis by hand at least 50 mm to the right.","SW_L":"Make sure the safety door is closed, then press \"Reset\" on the HMI. If that does not work, open the safety door and push the axis by hand at least 50 mm to the left.","SW_R_RECIPE":"If the error keeps happening during the process, decrease one or more of these recipe parameters: Start tab \u2192 \"Start pos. right axis\"; Right necking tab \u2192 \"Stretching distance\"; Left necking tab \u2192 \"Offset right axis\".","DIE_WIRES":"Check that the wires leading to the split dies are intact. If the error keeps appearing, contact support.","SENS_CLEAN":"Clean the fork sensor that detects the edge of the slug.","SENS_SET":"Set the recipe parameter \"Tube detection sensitivity\" correctly: read the fork-sensor value on the HMI with the necked sleeve in the sensor, then with un-necked tube; the parameter is 70 % of the difference (e.g. (2000 \u2212 1000) \u00d7 0.7 = 700). Check that the value varies less than this when un-necked tube is pulled through the sensor.","START_PRESS":"Reduce \"Start pressure die\" and \"Process pressure ramp die\" so the dies close more gently. The practical minimum is about 0.3 bar start pressure and 0.1 bar/s pressure ramp.","ACC_LOW":"Increase the axis \"Acceleration\" so the tube is pulled through the die while the die \u2014 with the slow pressure ramp \u2014 is still closing. The material then slides into the die instead of being compressed purely by force.","ACC_HIGH":"Reduce the axis \"Acceleration\" so the heat of the dies has time to transfer into the material before the tube is pulled.","CENTER":"Check that the tube is centred between the dies, not too high or too low. Compare the height of the left and right centering-gripper fingers by looking through the centering gripper from the side; misaligned fingers pin the tube against the top or bottom of the die.","TEMP_UP":"Increase \"Temperature die\".","DIES_CLEAN":"Clean the dies. Clean them regularly.","DIE_DIA":"Check that the die diameter is not too small for the tube (\"Diameter die\" must match the die actually installed \u2014 the diameter is engraved on BW-TEC dies, e.g. 260 = 2.6 mm).","SPEED_DOWN":"Reduce the stretching \"Speed\".","PRESTRETCH":"For large-diameter tube (above about 4 mm) with a large reduction ratio, enable \"Activate prestretching\" on the Prestretching tab. Always try without prestretching first; enable it only if the tube keeps breaking when the dies close. For very thick-walled tube, \"Number of runs\" can be set above 1.","PRETENSION":"On older machines with doors: block the white roll of the left roller gripper with a washer and set fPressureRollerGripperLeftForPretensioningTube to about 5 bar so the tube is under slight tension when the dies close. If the wheel is not blocked, this parameter must be 0 bar.","ANGLED_DIES":"Consider dies with angled contact surfaces (1610125) instead of parallel ones (1610068): they help small tubes centre in the middle so the tube is less likely to be clamped between the contact surfaces and break. Then set the advanced parameter \"Dies with angled contact surfaces\" to Yes.","ROLL_PRESS":"Reduce \"Roller gripper pressure right\" (recommended below 1 bar) and \"Roller gripper pressure left\" so the roll does not indent the still-hot tube leaving the dies.","ROLL_ADV":"If the indentation persists at minimum pressure: in Advanced settings set \"Close right roller gripper before moving offset right axis\" to No. If that makes the tube handling unreliable, leave it at Yes and instead increase \"Delay closing roller gripper\".","STRAIN":"Increase \"Strain relieve\" (distance the necking axis moves back after stretching) so the tension is relieved before the dies open. Otherwise the slug is pulled through the dies while they open and the die edges leave marks on it.","STRAIN_DELAY":"If a diameter increase right before the slug is observed, set \"Delay before strain relieve\". Use the delay only if the issue has actually been observed.","ANGLED_YES":"Set the advanced parameter \"Dies with angled contact surfaces\" to Yes. After the right neck the fork-sensor axis then moves a few millimetres left while the dies open, and after the left neck the feed-out grippers move right after gripping, so the tube is pulled free without damaging the neck. (Requires \"Close right roller gripper before moving offset right axis\" = Yes and \"Delay closing roller gripper\" = 0.)","SYNC":"Set the advanced parameter \"Axis synchronization during prestretching\" to Yes (recommended for tube diameter \u2264 2.5 mm) so the opposite axis moves with the necking axis and the tube is not pushed into a bend.","PRETENS_LEFT":"Set \"Pre-tension distance before left neck\" (recommended 0.3 \u00d7 strain relieve right neck for tube \u2264 2 mm) together with \"Keep tube gripped with right axis when starting left neck\" = Yes, so the tube is straight and centred when the dies close for the left neck.","GRIP_UP":"Increase \"Gripper pressure left and right\" (the centering grippers that pull the tube through the die).","OFFSET_GRIP":"For tube diameter above 3 mm set the advanced parameter \"Offset right necking axis before gripping tube\" to about 10 mm so all teeth of the right centering gripper engage the material and it can hold a higher pulling force.","BROKEN_ABORT":"The process stops when the recipe parameter \"Number of broken tubes until abort\" is exceeded. Several consecutive breaks point to a process problem \u2014 work through the problem \"Tube breaks during stretching\", then Reset and restart.","LEFT_LIMIT":"No neck was detected before the left axis reached its limit. Make sure the required left stretching distance does not exceed the travel of the left necking axis (use a shorter tube, or reduce the sleeve length via \"Offset right axis\").","PICK_FINGERS":"Choose the picking fingers for the tube: 2711204-002 standard (1.5\u20137 mm); 2711205-002 thin fingers for small tube (up to about 3 mm) \u2014 they bend more easily so only one tube is picked; 2711204-001 short fingers for very large / thick-walled tube that keeps hanging. Laser-engraved -NA fingers have more friction and raise the risk of picking two tubes.","STROKE_GRIP":"Set \"Stroke grip\" so the picking fingers are slightly bent when gripping \u2014 a second tube then falls out of the bottom. If the tube deforms too much before the fingers bend, switch to the thinner 2711205-00x fingers.","STROKE_OPEN":"Check \"Stroke open\" (opening of the picker gripper, as a percentage added to the tube diameter) and \"Diameter\" in the Picker parameters.","SENSOR_CORR":"Adjust \"Gripper sensor correction\": decrease it so the gripper dives deeper into the tube pile (tube sits higher between the fingers), increase it to dive less deep.","IONIZER_ON":"If tubes stick together from static charge, set \"Use ionizer at picker\" to Yes (only when the feed-in ionizer is fitted) and keep \"Use ionizer for reorder\" on so an air blow re-centres the remaining tubes in the hopper after several empty picks.","FILL_HOPPER":"Fill new raw tubes into the hopper.","PICKER_MANUAL":"Press the emergency stop and check by hand that the picker gripper fingers open and close freely without jamming. The finger sheets can be misaligned so that screw heads catch on the sheet when the gripper closes; realign them.","DISCHARGE_L":"Make sure nothing is in front of the left discharge monitoring sensor at the tube picker.","DISCHARGE_R":"Make sure nothing is in front of the right discharge monitoring sensor at the tube picker.","FEEDOUT_LOST":"The tube was lost during the process. Remove the tube from the machine, press Reset and continue the process.","COLLECTOR":"Remove the tube or object sticking out of (or hanging into) the tube collector.","COLLECTOR_CLOSE":"Close the tube collector.","FEEDOUT_PRESS":"Set \"Gripper pressure feed out\" to at least 1.5 bar so the feed-out grippers close correctly and in time.","ESTOP":"Release the emergency stop and press the blue illuminated reset button on top of the emergency-stop switch.","DOOR_RELOAD":"Close the safety door and reload the recipe.","DOOR_CLOSE":"Close the safety door.","HMI_RESET":"Press \"Reset\" on the HMI.","AIR_SWITCH":"Check the main pressure switch.","AIR_SUPPLY":"Check the compressed-air supply (6\u20138 bar / 87\u2013116 psi). Cylinders need at least 1 bar to work.","SIM":"A tube was detected while the process is in simulation mode. Remove the tube, or take the machine out of simulation.","ETHERCAT":"Check that the Ethernet connectors at the motor controllers and at the PLC are fully plugged in.","IOLINK":"Make sure the IO-Link master is connected to the PLC via Ethernet, and that the connector of the electrical gripper at the picker is still connected.","TECH":"Critical error: can only be resolved by a technician. Contact support.","COLLISION":"Push the right necking axis by hand at least 50 mm to the right, then restart the machine to reset the axis reference points.","COLLISION_CYL":"If this recurs when the axes return to the start position: the fork-sensor cylinder's retract signal may be arriving late because the cylinder has mechanical resistance over its last millimetres and briefly sticks. Have the cylinder checked and freed.","TEMP_WAIT":"Wait until the split die has reached the set temperature.","ION_CHECK":"Make sure the feed-out ionizer (the one with the fan) is powered on (toggle switch on the ionizer) and that all parts of the fan are correctly mounted and snapped in place.","ION_CLEAN":"Clean the ionizer emitters: switch the power supply off and confirm the fan has stopped; press part A of the emitter cartridge and pull the cartridge out towards the air-blow side; clean the eight emitters with a cotton swab soaked in reagent ethanol (\u2265 99.5 %); refit the cartridge so its terminals contact the body terminals, with no foreign matter on the connector.","PC":"Check that the PC is running.","TS_CABLES":"Check the touchscreen cables and plugs, and the touchscreen's control light.","FUSE":"Check the fuse.","VALVES":"Make sure the control valves are adjusted according to your work instruction.","MC_ERR":"Check whether the motor controllers display an error.","STEP_FUSE":"Check the fuses for the stepper motor.","LIMIT":"Check whether the axis is standing on a limit switch.","HEAT_FUSE":"Check the fuse and the temperature controller.","HEAT_RELAY":"Check the release relay for the heating process.","SSR":"Check the input and output of the solid-state relay.","CARTRIDGE":"Check the function of the heat cartridges.","TSENSOR":"The temperature sensor is probably disconnected or short-circuited. Check its wiring and connector.","ESTOP_RESET":"Press the emergency stop, reset the alarm, and try to start the process again.","MAIN_SWITCH":"Restart the machine by switching the main switch off and on.","FESTO_TORQUE":"In the Festo Automation Suite check the parameter \"Maximum Torque Symmetrical\" (P1.526796) on the affected axis \u2014 this value has been observed to drop by itself. Restore it to the correct value.","FESTO_IP":"Make sure the PC's IP address is set correctly in the machine's range (192.168.1.xxx); the Festo controllers are visible on the network but no connection can be established otherwise.","FESTO_FW":"Check that the PLC OS is at least V1.17 and the Festo controller firmware matches the ESI file (working combination: ESI Festo-CMMT-AS-MP-S1-CiA402-20240702 with firmware 35.9.2.5078). After loading new software or a new ESI file, run \"compare and download\" in JetSym.","PLC_290":"Update the necker PLC software to V2.9.0.0 or later, where the fork-sensor-axis torque reduction that caused tracking errors was removed. Follow the BW-TEC upgrade notes.","BELT":"Have the toothed belts checked (annual inspection) and replaced if necessary. Contact a BW-TEC technician.","LUBE":"Lubricate the three linear axes (right necking, left necking, fork sensor) once a year with an FDA/USDA-H1 grease: remove the axis cover strip to reach the ball-screw spindle.","SLUG_CORR":"Use \"Slug length correction\" to compensate a consistent difference between the measured slug length and the \"Slug length\" parameter. For slugs shorter than the 17 mm minimum, use \"Delay stop left axis\" on the Left necking tab."},"cautions":{"HOT":"The dies can be hot. Wait until the die temperature is below 50 \u00b0C (122 \u00b0F) before touching them.","POWER":"Disconnect the machine from power and from the compressed-air supply before any maintenance. Failure to do so can cause fatal injury.","ELEC":"Work on electrical components may only be carried out by qualified personnel.","IONIZER":"Switch the ionizer power supply OFF and confirm the fan has stopped before touching the emitters \u2014 energized emitters can cause electric shock, and the emitter tips are sharp.","ADV":"Advanced settings should only be changed after the main recipe is finished \u2014 their standard values are calculated from the other settings. Tick \"Manual\" to overwrite a calculated value.","RESET":"After clearing an alarm, press \"Reset\" on the HMI. A new process can only be started after Reset.","FINGERS":"Do not bend the picking fingers too far \u2014 they can be damaged.","SWUPD":"Software and firmware changes on the PLC and Festo controllers must follow the BW-TEC upgrade notes (PLC OS, ESI file and Festo firmware versions must match). Do not attempt without BW-TEC guidance.","UNDERFILL":"Too much strain relieve compresses the tube and can bend it."},"glossary":[{"group":"Machine areas","term":"Tube picker (separator)","text":"Picks single raw tubes out of the hopper with an electrical gripper and sheet-metal picking fingers; discharge monitoring sensors check that only one tube leaves."},{"group":"Machine areas","term":"Feed in","text":"Horizontal and vertical axes plus a roller gripper that bring the tube into the necking station."},{"group":"Machine areas","term":"Necker","text":"Heated split dies, left and right necking axes with centering and roller grippers, and the fork-sensor axis that defines the slug length."},{"group":"Machine areas","term":"Feed out","text":"Two pneumatic grippers that place the necked tube into the tube collector; an ionizer with fan reduces static cling."},{"group":"Process terms","term":"Neck / necking","text":"Pulling the heated tube through a split die smaller than the tube to reduce its diameter. Both ends are necked to the same diameter."},{"group":"Process terms","term":"Slug (parison)","text":"The un-necked section left in the middle of the tube. Its length is set by the distance between the die and the fork sensor (\"Slug length\", minimum 17 mm)."},{"group":"Process terms","term":"Sleeve","text":"The necked section on either side of the slug. Right sleeve length = \"Stretching distance\"; left sleeve length is controlled by \"Offset right axis\"."},{"group":"Process terms","term":"Prestretching","text":"An optional pre-pull for large-diameter tube with a large reduction ratio, used only if the tube keeps breaking when the dies close."},{"group":"Process terms","term":"Strain relieve","text":"The distance the necking axis moves back after stretching to release tension before the dies open."},{"group":"Key recipe parameters","term":"Start pressure die / Process pressure die / Process pressure ramp die","text":"The die closes at the start pressure (the tube moulds into the die as stretching starts), then ramps to the process pressure at the ramp rate."},{"group":"Key recipe parameters","term":"Speed / Acceleration","text":"Pulling speed through the die and how quickly it is reached."},{"group":"Key recipe parameters","term":"Tube detection sensitivity","text":"Fork-sensor threshold that stops the left axis when the slug edge is detected \u2014 70 % of the difference between the sleeve and un-necked tube readings."},{"group":"Key recipe parameters","term":"Number of broken tubes until abort","text":"How many consecutive broken tubes are tolerated before the automatic process stops."},{"group":"Limits","term":"Machine limits","text":"Raw tube 0.7\u20137 mm; neck-down 0.4\u20135.2 mm; travel 450 mm (L) / 730 mm (R); speed 0\u2013400 mm/s; process temperature 20\u2013200 \u00b0C; air 6\u20138 bar."}],"sections":{"process":"Process & product quality","handling":"Tube handling","alarms":"Alarms on the HMI","warnings":"Warnings on the HMI","machine":"Machine & electrical"}}],"images":{},"langs":[{"id":"en","label":"English"},{"id":"de","label":"Deutsch"},{"id":"es-ES","label":"Espa\u00f1ol (Espa\u00f1a)"},{"id":"es-419","label":"Espa\u00f1ol (Latinoam\u00e9rica)"}],"tr":{"de":{"Machine line":"Maschinenlinie","View":"Ansicht","Guided fix":"Gef\u00fchrte Behebung","Full matrix":"Gesamtmatrix","Mode":"Modus","Operator":"Bediener","MSI internal":"MSI intern","Language":"Sprache","Start over":"Neu beginnen","Cause":"Ursache","Adjustment":"Anpassung","potential causes, most likely first":"m\u00f6gliche Ursachen, wahrscheinlichste zuerst","adjustments, in the order to try them":"Anpassungen, in der empfohlenen Reihenfolge","Check and adjust":"Pr\u00fcfen und anpassen","What to do and why":"Was zu tun ist und warum","Caution":"Achtung","Yes, fixed":"Ja, behoben","No, next cause":"Nein, n\u00e4chste Ursache","No, next adjustment":"Nein, n\u00e4chste Anpassung","Not applicable, skip":"Nicht zutreffend, \u00fcberspringen","Back":"Zur\u00fcck","Did MSI Service resolve it, or do you want to move on?":"Hat der MSI-Service das Problem behoben, oder m\u00f6chten Sie fortfahren?","item.":"-Ma\u00dfnahme.","Resolved":"Behoben","Resolved \u2014 cause:":"Behoben \u2013 Ursache:","If the problem returns, start here first.":"Falls das Problem erneut auftritt, beginnen Sie hier.","Not resolved":"Nicht behoben","All listed causes tried without resolving the problem":"Alle aufgef\u00fchrten Ursachen wurden gepr\u00fcft, ohne das Problem zu beheben","Support summary (copy and send)":"Zusammenfassung f\u00fcr den Support (kopieren und senden)","Copy summary":"Zusammenfassung kopieren","Copied":"Kopiert","Troubleshoot this problem again":"Dieses Problem erneut durchgehen","Choose another problem":"Anderes Problem w\u00e4hlen","Change":"\u00c4ndern","Problem":"Problem","Potential cause":"M\u00f6gliche Ursache","Remedy":"Abhilfe","Cautions":"Hinweise","Run guided fix for this problem":"Gef\u00fchrte Behebung f\u00fcr dieses Problem starten","problem descriptions":"Problembeschreibungen","cause/remedy pairs":"Ursache/Abhilfe-Paare","Code glossary":"Code-Glossar","internal":"intern","Diagnostic codes":"Diagnosecodes","Caution codes":"Hinweiscodes","reference":"Referenz","Source:":"Quelle:","If the guided steps don't resolve the problem, contact":"Wenn die gef\u00fchrten Schritte das Problem nicht beheben, wenden Sie sich an","with the summary the tool prepares for you.":"mit der Zusammenfassung, die das Tool f\u00fcr Sie erstellt.","Internal mode shows source code references and service-level repair steps.":"Der interne Modus zeigt Quellcode-Referenzen und Reparaturschritte auf Service-Ebene.","fixed":"behoben","no change":"keine \u00c4nderung","skipped":"\u00fcbersprungen","MSI internal note":"Interner MSI-Hinweis","service":"Service","support summary":"Zusammenfassung f\u00fcr den Support","Machine line:":"Maschinenlinie:","Problem:":"Problem:","Date:":"Datum:","Steps worked through:":"Durchgef\u00fchrte Schritte:","FIXED":"BEHOBEN","tried, not fixed":"gepr\u00fcft, nicht behoben","skipped / not applicable":"\u00fcbersprungen / nicht zutreffend","Install this troubleshooter":"Diesen Troubleshooter installieren","Works offline on the shop floor.":"Funktioniert auch offline in der Fertigung.","Tap the Share button, then \"Add to Home Screen\".":"Tippen Sie auf \u201eTeilen\u201c und dann auf \u201eZum Home-Bildschirm\u201c.","Install":"Installieren","Tip types, tooling, parameters and materials":"Spitzentypen, Werkzeuge, Parameter und Materialien","glossary":"Glossar","Change problem":"Problem \u00e4ndern","BW-TEC 2711 Troubleshooter":"BW-TEC 2711 Troubleshooter","What is the machine doing?":"Was macht die Maschine?","Pick the symptom, or the alarm or warning as worded on the HMI.":"W\u00e4hlen Sie das Symptom oder den Alarm bzw. die Warnung mit dem Wortlaut vom HMI.","guided fix":"gef\u00fchrte Behebung","Resolve a 2711 automatic necker problem one likely cause at a time":"Beheben Sie ein Problem am automatischen Schlauchdehner 2711 Ursache f\u00fcr Ursache","Choose the symptom or HMI message. The tool walks you through the potential causes in order, with the checks and recipe adjustments for each. Causes that need a technician are marked for support.":"W\u00e4hlen Sie das Symptom oder die HMI-Meldung. Das Tool f\u00fchrt Sie der Reihe nach durch die m\u00f6glichen Ursachen mit den jeweiligen Pr\u00fcfungen und Rezepturanpassungen. Ursachen, die einen Techniker erfordern, sind f\u00fcr den Support gekennzeichnet.","After clearing any alarm, press \"Reset\" on the HMI before starting a new process.":"Nach dem Beheben eines Alarms \u201eReset\u201c am HMI dr\u00fccken, bevor ein neuer Prozess gestartet wird.","Note the recipe values (die temperature, start / process pressure, ramp, speed, acceleration) before changing anything, and change one parameter at a time.":"Notieren Sie die Rezepturwerte (Matrizentemperatur, Start-/Prozessdruck, Rampe, Geschwindigkeit, Beschleunigung), bevor Sie etwas \u00e4ndern, und \u00e4ndern Sie jeweils nur einen Parameter.","If nothing in the list resolves it, the tool prepares a summary you can send to support.":"Wenn keine der aufgef\u00fchrten Ma\u00dfnahmen hilft, erstellt das Tool eine Zusammenfassung, die Sie an den Support senden k\u00f6nnen.","Run the process again. Did this resolve the problem?":"Starten Sie den Prozess erneut. Wurde das Problem dadurch behoben?","Please add: machine serial number, PLC / HMI software version, recipe name, tube material and diameter, die diameter, and a photo of the HMI if an alarm is shown.":"Bitte erg\u00e4nzen: Seriennummer der Maschine, SPS-/HMI-Softwareversion, Rezepturname, Schlauchmaterial und -durchmesser, Matrizendurchmesser sowie ein Foto des HMI, falls ein Alarm angezeigt wird.","BW-TEC Support":"BW-TEC Support","Send the summary below to BW-TEC Support so they can pick up where you left off.":"Senden Sie die folgende Zusammenfassung an den BW-TEC Support, damit dieser dort weitermachen kann, wo Sie aufgeh\u00f6rt haben.","Save the recipe values that produced good parts so the next set-up starts from a known-good state.":"Speichern Sie die Rezepturwerte, mit denen gute Teile produziert wurden, damit die n\u00e4chste Einrichtung von einem bekannt guten Zustand ausgeht.","This step is carried out by a BW-TEC technician or qualified maintenance personnel. Contact {contact} and mention this cause.":"Dieser Schritt wird von einem BW-TEC-Techniker oder qualifiziertem Wartungspersonal durchgef\u00fchrt. Wenden Sie sich an {contact} und nennen Sie diese Ursache.","2711 troubleshooting matrix":"2711-Fehlerbehebungsmatrix","Process & product quality":"Prozess & Produktqualit\u00e4t","Tube handling":"Schlauchhandling","Alarms on the HMI":"Alarme am HMI","Warnings on the HMI":"Warnungen am HMI","Machine & electrical":"Maschine & Elektrik","User Manual Automatic Necking Machine Type 2711 (2711-01-02-03 E) and 2711 Support Notes Version A (12.02.2026)":"Handbuch zum automatischen Schlauchdehner 2711 (2711-01-02-03 E) und 2711 Support Notes Version A (12.02.2026)","Tube breaks during stretching (necking)":"Schlauch reisst beim Dehnen","The machine detects the break, ejects the tube and continues. Several breaks in a row stop the process (\"Multiple failed tube neckings\"). Work through the causes in order \u2014 the first three are the usual ones.":"Die Maschine erkennt den Riss, wirft den Schlauch aus und f\u00e4hrt fort. Mehrere Risse in Folge stoppen den Prozess (\u201eMehrere fehlgeschlagene Schlauchdehnungen\u201c). Gehen Sie die Ursachen der Reihe nach durch \u2013 die ersten drei sind die \u00fcblichen.","Dies close too hard, too early":"Matrizen schliessen zu hart und zu fr\u00fch","Axis acceleration too low \u2014 tube is compressed instead of sliding into the die":"Achsbeschleunigung zu niedrig \u2013 der Schlauch wird gestaucht, statt in die Matrize zu gleiten","Axis acceleration too high \u2014 no time for die heat to transfer into the material":"Achsbeschleunigung zu hoch \u2013 die Matrizenw\u00e4rme kann nicht in das Material \u00fcbergehen","Tube not centred between the dies (too high or too low) and jammed":"Schlauch nicht zwischen den Matrizen zentriert (zu hoch oder zu tief) und eingeklemmt","Die temperature too low":"Matrizentemperatur zu niedrig","Dies dirty":"Matrizen verschmutzt","Die diameter too small for the tube":"Matrizendurchmesser zu klein f\u00fcr den Schlauch","Stretching speed too high":"Dehngeschwindigkeit zu hoch","Large-diameter tube with a large reduction ratio breaking as the dies close":"Schlauch mit grossem Durchmesser und hohem Reduktionsverh\u00e4ltnis reisst beim Schliessen der Matrizen","Small tube breaking as the dies close (older machines with doors)":"Kleiner Schlauch reisst beim Schliessen der Matrizen (\u00e4ltere Maschinen mit T\u00fcren)","Small tube clamped between the die contact surfaces":"Kleiner Schlauch wird zwischen den Kontaktfl\u00e4chen der Matrize eingeklemmt","Slug (parison) length is irregular":"Ungereckte L\u00e4nge (Rohling) ist ungleichm\u00e4ssig","\"Tube detection sensitivity\" not set correctly":"\u201eEmpfindlichkeit Schlaucherkennung\u201c nicht korrekt eingestellt","Fork sensor that detects the edge of the slug is dirty":"Gabellichtschranke, die die Kante des Rohlings erkennt, ist verschmutzt","Measured length differs consistently from the set value":"Gemessene L\u00e4nge weicht konstant vom Sollwert ab","Machine reports a broken tube although the tube did not break":"Maschine erkennt gerissenen Schlauch, obwohl der Schlauch nicht gerissen ist","Fork sensor dirty":"Gabellichtschranke verschmutzt","Indentation in the tube from the roller gripper":"Eindruck im Schlauch durch den Rollen-Greifer","The right roller gripper closes on the freshly necked, still-hot tube and can leave a mark.":"Der rechte Rollen-Greifer schliesst auf dem frisch gedehnten, noch heissen Schlauch und kann eine Markierung hinterlassen.","Roller gripper pressure too high on the still-hot tube leaving the dies":"Druck des Rollen-Greifers zu hoch auf dem noch heissen Schlauch beim Verlassen der Matrizen","Indentation persists at minimum pressure":"Eindruck bleibt auch bei minimalem Druck","Marks from the split-die edges on the slug":"Markierungen der Matrizenkanten auf dem Rohling","Tube still under tension when the dies open \u2014 strain not relieved":"Schlauch steht beim \u00d6ffnen der Matrizen noch unter Zug \u2013 Spannung nicht entlastet","Diameter increase right before the slug":"Durchmesserzunahme unmittelbar vor dem Rohling","Necked tube stuck in one die half after the dies open \u2014 neck damaged when pulled free":"Gedehnter Schlauch bleibt nach dem \u00d6ffnen in einer Matrizenh\u00e4lfte h\u00e4ngen \u2013 Dehnung wird beim Herausreissen besch\u00e4digt","Dies with angled contact surfaces act as a funnel":"Matrizen mit schr\u00e4gen Kontaktfl\u00e4chen wirken wie ein Trichter","Tube bends during prestretching":"Schlauch knickt beim Vordehnen","Small, flexible tube pushed against the stationary opposite axis":"Kleiner, biegsamer Schlauch wird gegen die stillstehende Gegenachse geschoben","Tube sags or is off-centre when the dies close for the left neck":"Schlauch h\u00e4ngt durch oder ist beim Schliessen der Matrizen f\u00fcr die linke Dehnung nicht zentriert","Small tube bending under its own weight":"Kleiner Schlauch biegt sich unter dem Eigengewicht durch","Tube slips out of the centering gripper while stretching":"Schlauch rutscht beim Dehnen aus dem Zentrier-Greifer","Centering-gripper pressure too low":"Druck des Zentrier-Greifers zu niedrig","Large-diameter tube \u2014 not all gripper teeth engaged":"Schlauch mit grossem Durchmesser \u2013 nicht alle Greiferz\u00e4hne greifen","Tube is always pinched at the top or bottom of the die":"Schlauch wird immer oben oder unten in der Matrize eingeklemmt","Centering-gripper fingers not at the same height (parallel gripper misaligned)":"Greiffinger des Zentrier-Greifers nicht auf gleicher H\u00f6he (Parallelgreifer falsch ausgerichtet)","Picker picks two tubes at once":"Separierer greift zwei Schl\u00e4uche gleichzeitig","\"Stroke grip\" not bending the picking fingers slightly":"\u201eHub greifen\u201c biegt die Greiffinger nicht leicht durch","Picking fingers unsuitable for the tube diameter (e.g. high-friction -NA fingers on small tube)":"Greiffinger f\u00fcr den Schlauchdurchmesser ungeeignet (z. B. -NA-Finger mit hoher Reibung bei kleinem Schlauch)","Tubes stick together from static charge":"Schl\u00e4uche kleben durch statische Aufladung zusammen","Picker picks no tube (empty picks) or tubes hang from the fingers":"Separierer greift keinen Schlauch (Leergriffe) oder Schl\u00e4uche h\u00e4ngen an den Fingern","Gripper diving depth wrong":"Eintauchtiefe des Greifers falsch","Picking fingers unsuitable for the tube (hanging tubes on large / thick-walled tube)":"Greiffinger f\u00fcr den Schlauch ungeeignet (h\u00e4ngende Schl\u00e4uche bei grossem/dickwandigem Schlauch)","Opening stroke or tube diameter wrong in the Picker parameters":"\u00d6ffnungshub oder Schlauchdurchmesser in den Separierer-Parametern falsch","Remaining tubes not in the centre of the hopper":"Restliche Schl\u00e4uche liegen nicht in der Mitte des Magazins","Picker gripper does not close fully or behaves oddly":"Greifer des Separierers schliesst nicht vollst\u00e4ndig oder verh\u00e4lt sich seltsam","Warning \"Tube lack detected\"":"Warnung \u201eRohteilmangel erkannt\u201c","Hopper empty":"Magazin leer","Alarm \"Discharge monitoring sensor left/right at Tube Picker blocked\"":"Alarm \u201eSensor Austragung links/rechts Separierer blockiert\u201c","Something in front of the left sensor":"Etwas befindet sich vor dem linken Sensor","Something in front of the right sensor":"Etwas befindet sich vor dem rechten Sensor","Alarm \"Tube at feed out not detected\"":"Alarm \u201eSchlauch in Austragung nicht erkannt\u201c","Tube lost during the process":"Schlauch w\u00e4hrend des Prozesses verloren","Feed-out grippers not closing correctly":"Greifer der Austragung schliessen nicht korrekt","Alarm \"Light barrier at tube collector blocked\"":"Alarm \u201eLichtschranke in Ausgabe blockiert\u201c","Tube or object sticking out of or hanging into the collector":"Schlauch oder Gegenstand ragt aus der Austragsschublade heraus oder hinein","Warning \"Tube collector is not closed\"":"Warnung \u201eEntnahmefach ist nicht geschlossen\u201c","Collector open":"Austragsschublade offen","Alarm \"Emergency Stop pressed\"":"Alarm \u201eNot-Aus gedr\u00fcckt\u201c","Emergency stop is latched":"Not-Aus ist verriegelt","Alarm \"Safety door opened during process\"":"Alarm \u201eSicherheitst\u00fcre w\u00e4hrend Prozess ge\u00f6ffnet\u201c","Door opened while running":"T\u00fcr w\u00e4hrend des Betriebs ge\u00f6ffnet","Alarm \"Immediate stop triggered\"":"Alarm \u201eSofort Halt wurde ausgel\u00f6st\u201c","Immediate stop":"Sofort-Halt","Alarm \"No air pressure connected\"":"Alarm \u201eKein Niederdruck vorhanden\u201c","Main pressure switch":"Hauptdruckschalter","Compressed-air supply":"Druckluftversorgung","Alarm \"Tube detected despite process simulation\"":"Alarm \u201eSchlauch w\u00e4hrend aktivem Simulationsprozess erkannt\u201c","Tube present in simulation mode":"Schlauch im Simulationsmodus vorhanden","Alarm \"EtherCat disconnected\"":"Alarm \u201eEtherCat nicht verbunden\u201c","Ethernet connector loose at a motor controller or the PLC":"Ethernet-Stecker an einer Motorsteuerung oder der SPS lose","Alarm \"Error controller \u2026 axis\" / \"Error program \u2026 axis\" (picker, necking, feed in, feed out, sensor axis)":"Alarm \u201eFehler Regler \u2026 Achse\u201c / \u201eFehler Programm \u2026 Achse\u201c (Separierer, Dehnachse, Zuf\u00fchrung, Austragung, Sensorachse)","Drive or program fault on the axis":"Antriebs- oder Programmfehler an der Achse","\"Axis fork sensor\" error keeps returning with a tracking error in JetSym (older PLC software)":"Fehler \u201eAxis fork sensor\u201c kommt immer wieder mit Schleppfehler in JetSym (\u00e4ltere SPS-Software)","Festo axes suddenly have less force than they should":"Festo-Achsen haben pl\u00f6tzlich weniger Kraft als sie sollten","Alarm \"Error IO-Link connection picker gripper\"":"Alarm \u201eFehler IO-Link Verbindung Greifer Separierer\u201c","IO-Link master or gripper connector disconnected":"IO-Link-Master oder Greiferstecker nicht verbunden","Alarm \"Temperature controller error\"":"Alarm \u201eFehler Temperaturregler\u201c","Critical temperature-controller fault":"Kritischer Fehler des Temperaturreglers","Alarm \"Hardware limit \u2026 reached\" (necking axis left/right, sensor axis)":"Alarm \u201eEndschalter \u2026 erreicht\u201c (Dehnachse links/rechts, Sensorachse)","Left hardware limit of the left necking axis reached":"Endschalter links der linken Dehnachse erreicht","Right hardware limit of the right necking axis reached":"Endschalter rechts der rechten Dehnachse erreicht","Right hardware limit of the sensor axis reached":"Endschalter rechts der Sensorachse erreicht","Alarm \"Software limit \u2026 reached\" (necking axis left/right, fork sensor axis)":"Alarm \u201eSoftwaregrenze \u2026 erreicht\u201c (Dehnachse links/rechts, Sensorachse)","Left software limit reached (left necking axis, right necking axis, or fork sensor axis)":"Softwaregrenze links erreicht (linke Dehnachse, rechte Dehnachse oder Sensorachse)","Right software limit reached (left necking axis, right necking axis, or fork sensor axis)":"Softwaregrenze rechts erreicht (linke Dehnachse, rechte Dehnachse oder Sensorachse)","Right software limit of the right necking axis keeps recurring during the process":"Softwaregrenze rechts der rechten Dehnachse tritt w\u00e4hrend des Prozesses wiederholt auf","Alarm \"Avoid collision between necking axis right and necking axis sensor\"":"Alarm \u201eKollision zwischen Dehnachse rechts und Sensorachse vermeiden\u201c","Right necking axis too close to the sensor axis":"Rechte Dehnachse zu nah an der Sensorachse","Recurs when the axes return to the start position":"Tritt beim Zur\u00fcckfahren der Achsen auf die Startposition erneut auf","Alarm \"Error signal \u2026 gripper\" (die grippers, centering grippers, roller grippers, feed-out grippers)":"Alarm \u201eFehler Signalwechsel \u2026 Greifer\u201c (Matrizen-Greifer, Zentrier-Greifer, Rollen-Greifer, Greifer Austragung)","Gripper blocked, or recipe gripper pressure too low":"Greifer blockiert oder Greiferdruck in der Rezeptur zu niedrig","\"Error signal feed in centering gripper\"":"\u201eFehler Signalwechsel Zentrier-Greifer Zuf\u00fchrung\u201c","Alarm \"Error signal \u2026 cylinder\" (necking cylinder diameter sensor, feed-in cylinder)":"Alarm \u201eFehler Signalwechsel Zylinder \u2026\u201c (Zylinder Durchmessersensor, Zylinder Zuf\u00fchrung)","Cylinder blocked":"Zylinder blockiert","Alarm \"Error temperature Die front/back out of range\"":"Alarm \u201eFehler Temperatur Matrize vorne/hinten ausserhalb des Bereichs\u201c","Wires to the split dies damaged":"Kabel zu den zweigeteilten Matrizen besch\u00e4digt","Warning \"Temperature controller not ready\"":"Warnung \u201eProzess Temperatur noch nicht erreicht\u201c","Split die has not reached the set temperature yet":"Zweigeteilte Matrize hat die Solltemperatur noch nicht erreicht","Warning \"Necking limit left reached\"":"Warnung \u201eGrenze Dehnung erreicht\u201c","Required left stretching distance exceeds the axis travel":"Erforderliche linke Dehndistanz \u00fcberschreitet den Verfahrweg der Achse","Warning \"Multiple failed tube neckings\" / \"Right necking failed\" / \"Left necking failed\"":"Warnung \u201eMehrere fehlgeschlagene Schlauchdehnungen\u201c / \u201eDehnung rechts fehlgeschlagen\u201c / \u201eDehnung links fehlgeschlagen\u201c","Several tubes broke consecutively":"Mehrere Schl\u00e4uche sind nacheinander gerissen","Warning \"Safety door is open\"":"Warnung \u201eSicherheitst\u00fcre ist ge\u00f6ffnet\u201c","Door open":"T\u00fcr offen","Warning \"Error ionizer feed out\"":"Warnung \u201eFehler Ionisator Austragung\u201c","Ionizer switched off or fan parts not snapped in":"Ionisator ausgeschaltet oder L\u00fcfterteile nicht eingerastet","Warning \"Maintenance required on ionizer at feed out\"":"Warnung \u201eWartung Ionisator Austragung notwendig\u201c","Emitters need cleaning":"Emitter m\u00fcssen gereinigt werden","No picture on the touchscreen":"Kein Bild auf dem Touchscreen","PC not running":"PC l\u00e4uft nicht","Touchscreen cables / plugs / control light":"Touchscreen-Kabel / -Stecker / Kontrollleuchte","Fuse":"Sicherung","Cylinders are not working":"Zylinder funktionieren nicht","No compressed air in the machine":"Keine Druckluft in der Maschine","Control valves not set per work instruction":"Steuerventile nicht gem\u00e4ss Arbeitsanweisung eingestellt","Axes are not moving":"Achsen verfahren nicht","Motor controller shows an error":"Motorsteuerung zeigt einen Fehler","Axis standing on a limit switch":"Achse steht auf einem Endschalter","Stepper-motor fuses":"Sicherungen des Schrittmotors","Heating element does not heat up":"Heizelement heizt nicht","Fuse or temperature controller":"Sicherung oder Temperaturregler","Release relay for the heating process":"Freigaberelais f\u00fcr den Heizprozess","Solid-state relay input / output":"Ein-/Ausgang des Halbleiterrelais","Set temperature is reached very slowly":"Solltemperatur wird nur sehr langsam erreicht","Heat cartridges faulty":"Heizpatronen defekt","Temperature display shows about 800 \u00b0C above room temperature":"Temperaturanzeige zeigt ca. 800 \u00b0C \u00fcber Raumtemperatur","Temperature sensor disconnected or short-circuited":"Temperatursensor getrennt oder kurzgeschlossen","Process does not start after pressing \"Start\"":"Prozess startet nach Dr\u00fccken von \u201eStart\u201c nicht","Alarm not cleared":"Alarm nicht quittiert","Control needs a restart":"Steuerung muss neu gestartet werden","Cannot connect to or download firmware to the Festo motor controllers":"Keine Verbindung zu den Festo-Motorreglern bzw. Firmware l\u00e4sst sich nicht laden","PC IP address outside the machine network range":"IP-Adresse des PCs ausserhalb des Maschinennetzwerks","PLC OS, ESI file and Festo firmware versions do not match":"SPS-OS, ESI-Datei und Festo-Firmware passen nicht zusammen","Annual maintenance":"J\u00e4hrliche Wartung","Linear axes need lubrication":"Linearachsen m\u00fcssen geschmiert werden","Toothed belts need inspection":"Zahnriemen m\u00fcssen gepr\u00fcft werden","The dies can be hot. Wait until the die temperature is below 50 \u00b0C (122 \u00b0F) before touching them.":"Die Matrizen k\u00f6nnen heiss sein. Warten Sie, bis die Matrizentemperatur unter 50 \u00b0C liegt, bevor Sie sie ber\u00fchren.","Disconnect the machine from power and from the compressed-air supply before any maintenance. Failure to do so can cause fatal injury.":"Trennen Sie die Maschine vor jeder Wartung von der Stromversorgung und der Druckluft. Nichtbeachtung kann zu t\u00f6dlichen Verletzungen f\u00fchren.","Work on electrical components may only be carried out by qualified personnel.":"Arbeiten an elektrischen Komponenten d\u00fcrfen nur von qualifiziertem Personal durchgef\u00fchrt werden.","Switch the ionizer power supply OFF and confirm the fan has stopped before touching the emitters \u2014 energized emitters can cause electric shock, and the emitter tips are sharp.":"Schalten Sie die Stromversorgung des Ionisators AUS und vergewissern Sie sich, dass der L\u00fcfter steht, bevor Sie die Emitter ber\u00fchren \u2013 unter Spannung stehende Emitter k\u00f6nnen einen Stromschlag verursachen, und die Emitterspitzen sind scharf.","Advanced settings should only be changed after the main recipe is finished \u2014 their standard values are calculated from the other settings. Tick \"Manual\" to overwrite a calculated value.":"Erweiterte Einstellungen sollten erst ge\u00e4ndert werden, wenn die Hauptrezeptur fertig ist \u2013 ihre Standardwerte werden aus den \u00fcbrigen Einstellungen berechnet. Haken Sie \u201eManuell\u201c an, um einen berechneten Wert zu \u00fcberschreiben.","After clearing an alarm, press \"Reset\" on the HMI. A new process can only be started after Reset.":"Nach dem Beheben eines Alarms \u201eReset\u201c am HMI dr\u00fccken. Ein neuer Prozess kann erst nach dem Reset gestartet werden.","Do not bend the picking fingers too far \u2014 they can be damaged.":"Biegen Sie die Greiffinger nicht zu stark \u2013 sie k\u00f6nnen besch\u00e4digt werden.","Software and firmware changes on the PLC and Festo controllers must follow the BW-TEC upgrade notes (PLC OS, ESI file and Festo firmware versions must match). Do not attempt without BW-TEC guidance.":"Software- und Firmware-\u00c4nderungen an SPS und Festo-Reglern m\u00fcssen den BW-TEC-Upgrade-Hinweisen folgen (SPS-OS, ESI-Datei und Festo-Firmware m\u00fcssen zusammenpassen). Nicht ohne Anleitung von BW-TEC durchf\u00fchren.","Too much strain relieve compresses the tube and can bend it.":"Zu viel Entlastung staucht den Schlauch und kann ihn verbiegen.","Press \"Reset\" on the HMI. If that does not clear it, restart the machine at the main switch. If the error keeps appearing, contact support.":"Dr\u00fccken Sie \u201eReset\u201c am HMI. Wenn das nicht hilft, starten Sie die Maschine am Hauptschalter neu. Wenn der Fehler dauerhaft angezeigt wird, kontaktieren Sie den Support.","Make sure the gripper is not blocked, and that the gripper pressure in the recipe is set high enough to open and close it.":"Stellen Sie sicher, dass der Greifer nicht blockiert ist und dass der Greiferdruck in der Rezeptur hoch genug eingestellt ist, um ihn zu \u00f6ffnen und zu schliessen.","Make sure the cylinder is not blocked.":"Stellen Sie sicher, dass der Zylinder nicht blockiert ist.","Push the axis by hand at least 50 mm to the right, then restart the machine to reset the axis reference points.":"Schieben Sie die Achse von Hand mindestens 50 mm nach rechts und starten Sie die Maschine neu, um die Referenzpunkte der Achse zur\u00fcckzusetzen.","Push the axis by hand at least 50 mm to the left, then restart the machine to reset the axis reference points.":"Schieben Sie die Achse von Hand mindestens 50 mm nach links und starten Sie die Maschine neu, um die Referenzpunkte der Achse zur\u00fcckzusetzen.","Make sure the safety door is closed, then press \"Reset\" on the HMI. If that does not work, open the safety door and push the axis by hand at least 50 mm to the right.":"Stellen Sie sicher, dass die Sicherheitst\u00fcr geschlossen ist, und dr\u00fccken Sie dann \u201eReset\u201c am HMI. Wenn das nicht hilft, \u00f6ffnen Sie die Sicherheitst\u00fcr und schieben Sie die Achse von Hand mindestens 50 mm nach rechts.","Make sure the safety door is closed, then press \"Reset\" on the HMI. If that does not work, open the safety door and push the axis by hand at least 50 mm to the left.":"Stellen Sie sicher, dass die Sicherheitst\u00fcr geschlossen ist, und dr\u00fccken Sie dann \u201eReset\u201c am HMI. Wenn das nicht hilft, \u00f6ffnen Sie die Sicherheitst\u00fcr und schieben Sie die Achse von Hand mindestens 50 mm nach links.","If the error keeps happening during the process, decrease one or more of these recipe parameters: Start tab \u2192 \"Start pos. right axis\"; Right necking tab \u2192 \"Stretching distance\"; Left necking tab \u2192 \"Offset right axis\".":"Wenn der Fehler w\u00e4hrend des Prozesses weiterhin auftritt, verringern Sie einen oder mehrere dieser Rezepturparameter: Registerkarte Start \u2192 \u201eStartpos. rechte Achse\u201c; Registerkarte Rechts dehnen \u2192 \u201eDehnen Distanz\u201c; Registerkarte Links dehnen \u2192 \u201eOffset rechte Achse\u201c.","Check that the wires leading to the split dies are intact. If the error keeps appearing, contact support.":"Pr\u00fcfen Sie, ob die Kabel zu den zweigeteilten Matrizen unbesch\u00e4digt sind. Wenn der Fehler dauerhaft angezeigt wird, kontaktieren Sie den Supp
