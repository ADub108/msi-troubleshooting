ort.","Clean the fork sensor that detects the edge of the slug.":"Reinigen Sie die Gabellichtschranke, die die Kante des Rohlings erkennt.","Set the recipe parameter \"Tube detection sensitivity\" correctly: read the fork-sensor value on the HMI with the necked sleeve in the sensor, then with un-necked tube; the parameter is 70 % of the difference (e.g. (2000 \u2212 1000) \u00d7 0.7 = 700). Check that the value varies less than this when un-necked tube is pulled through the sensor.":"Stellen Sie den Rezepturparameter \u201eEmpfindlichkeit Schlaucherkennung\u201c korrekt ein: Lesen Sie den Wert der Gabellichtschranke am HMI mit der gedehnten H\u00fclse im Sensor ab, dann mit ungedehntem Schlauch; der Parameter betr\u00e4gt 70 % der Differenz (z. B. (2000 \u2212 1000) \u00d7 0,7 = 700). Pr\u00fcfen Sie, dass der Wert beim Durchziehen von ungedehntem Schlauch weniger schwankt als dieser Betrag.","Reduce \"Start pressure die\" and \"Process pressure ramp die\" so the dies close more gently. The practical minimum is about 0.3 bar start pressure and 0.1 bar/s pressure ramp.":"Verringern Sie \u201eStartdruck Matrize\u201c und \u201eProzessdruckrampe Matrize\u201c, damit die Matrizen sanfter schliessen. Das praktische Minimum liegt bei ca. 0,3 bar Startdruck und 0,1 bar/s Druckrampe.","Increase the axis \"Acceleration\" so the tube is pulled through the die while the die \u2014 with the slow pressure ramp \u2014 is still closing. The material then slides into the die instead of being compressed purely by force.":"Erh\u00f6hen Sie die \u201eBeschleunigung\u201c der Achse, damit der Schlauch durch die Matrize gezogen wird, w\u00e4hrend sich die Matrize \u2013 mit der langsamen Druckrampe \u2013 noch schliesst. Das Material gleitet dann in die Matrize, statt nur mit Kraft gestaucht zu werden.","Reduce the axis \"Acceleration\" so the heat of the dies has time to transfer into the material before the tube is pulled.":"Verringern Sie die \u201eBeschleunigung\u201c der Achse, damit die W\u00e4rme der Matrizen in das Material \u00fcbergehen kann, bevor der Schlauch gezogen wird.","Check that the tube is centred between the dies, not too high or too low. Compare the height of the left and right centering-gripper fingers by looking through the centering gripper from the side; misaligned fingers pin the tube against the top or bottom of the die.":"Pr\u00fcfen Sie, ob der Schlauch zwischen den Matrizen zentriert ist, nicht zu hoch oder zu tief. Vergleichen Sie die H\u00f6he der linken und rechten Greiffinger des Zentrier-Greifers, indem Sie von der Seite durch den Zentrier-Greifer schauen; falsch ausgerichtete Finger klemmen den Schlauch oben oder unten in der Matrize ein.","Increase \"Temperature die\".":"Erh\u00f6hen Sie \u201eTemperatur Matrize\u201c.","Clean the dies. Clean them regularly.":"Reinigen Sie die Matrizen. Reinigen Sie sie regelm\u00e4ssig.","Check that the die diameter is not too small for the tube (\"Diameter die\" must match the die actually installed \u2014 the diameter is engraved on BW-TEC dies, e.g. 260 = 2.6 mm).":"Pr\u00fcfen Sie, ob der Matrizendurchmesser nicht zu klein f\u00fcr den Schlauch ist (\u201eDurchmesser Matrize\u201c muss der tats\u00e4chlich eingebauten Matrize entsprechen \u2013 der Durchmesser ist auf BW-TEC-Matrizen eingraviert, z. B. 260 = 2,6 mm).","Reduce the stretching \"Speed\".":"Verringern Sie die \u201eGeschwindigkeit\u201c des Dehnens.","For large-diameter tube (above about 4 mm) with a large reduction ratio, enable \"Activate prestretching\" on the Prestretching tab. Always try without prestretching first; enable it only if the tube keeps breaking when the dies close. For very thick-walled tube, \"Number of runs\" can be set above 1.":"Bei Schl\u00e4uchen mit grossem Durchmesser (\u00fcber ca. 4 mm) und hohem Reduktionsverh\u00e4ltnis aktivieren Sie \u201eVordehnen aktivieren\u201c auf der Registerkarte Vordehnen. Versuchen Sie es immer zuerst ohne Vordehnen; aktivieren Sie es nur, wenn der Schlauch beim Schliessen der Matrizen immer wieder reisst. Bei sehr dickwandigem Schlauch kann \u201eAnzahl Durchl\u00e4ufe\u201c auf \u00fcber 1 gesetzt werden.","On older machines with doors: block the white roll of the left roller gripper with a washer and set fPressureRollerGripperLeftForPretensioningTube to about 5 bar so the tube is under slight tension when the dies close. If the wheel is not blocked, this parameter must be 0 bar.":"Bei \u00e4lteren Maschinen mit T\u00fcren: Blockieren Sie die weisse Rolle des linken Rollen-Greifers mit einer Unterlagsscheibe und setzen Sie fPressureRollerGripperLeftForPretensioningTube auf ca. 5 bar, damit der Schlauch beim Schliessen der Matrizen leicht vorgespannt ist. Wenn die Rolle nicht blockiert ist, muss dieser Parameter 0 bar betragen.","Consider dies with angled contact surfaces (1610125) instead of parallel ones (1610068): they help small tubes centre in the middle so the tube is less likely to be clamped between the contact surfaces and break. Then set the advanced parameter \"Dies with angled contact surfaces\" to Yes.":"Erw\u00e4gen Sie Matrizen mit schr\u00e4gen Kontaktfl\u00e4chen (1610125) statt paralleler (1610068): Sie helfen kleinen Schl\u00e4uchen, sich mittig zu zentrieren, sodass der Schlauch seltener zwischen den Kontaktfl\u00e4chen eingeklemmt wird und reisst. Setzen Sie dann den erweiterten Parameter \u201eMatrizen mit schr\u00e4gen Kontaktfl\u00e4chen\u201c auf Ja.","Reduce \"Roller gripper pressure right\" (recommended below 1 bar) and \"Roller gripper pressure left\" so the roll does not indent the still-hot tube leaving the dies.":"Verringern Sie \u201eDruck Rollen-Greifer rechts\u201c (empfohlen unter 1 bar) und \u201eDruck Rollen-Greifer links\u201c, damit die Rolle den noch heissen Schlauch beim Verlassen der Matrizen nicht eindr\u00fcckt.","If the indentation persists at minimum pressure: in Advanced settings set \"Close right roller gripper before moving offset right axis\" to No. If that makes the tube handling unreliable, leave it at Yes and instead increase \"Delay closing roller gripper\".":"Wenn der Eindruck auch bei minimalem Druck bleibt: Setzen Sie in den erweiterten Einstellungen \u201eRechten Rollen-Greifer vor Offset rechte Achse schliessen\u201c auf Nein. Wird das Schlauchhandling dadurch unzuverl\u00e4ssig, lassen Sie es auf Ja und erh\u00f6hen Sie stattdessen \u201eVerz\u00f6gerung Schliessen Rollen-Greifer\u201c.","Increase \"Strain relieve\" (distance the necking axis moves back after stretching) so the tension is relieved before the dies open. Otherwise the slug is pulled through the dies while they open and the die edges leave marks on it.":"Erh\u00f6hen Sie \u201eEntlastung\u201c (Distanz, die die Dehnachse nach dem Dehnen zur\u00fcckf\u00e4hrt), damit die Spannung vor dem \u00d6ffnen der Matrizen abgebaut wird. Sonst wird der Rohling beim \u00d6ffnen durch die Matrizen gezogen und die Matrizenkanten hinterlassen Markierungen.","If a diameter increase right before the slug is observed, set \"Delay before strain relieve\". Use the delay only if the issue has actually been observed.":"Wenn unmittelbar vor dem Rohling eine Durchmesserzunahme beobachtet wird, setzen Sie \u201eVerz\u00f6gerung vor Entlastung\u201c. Verwenden Sie die Verz\u00f6gerung nur, wenn das Problem tats\u00e4chlich beobachtet wurde.","Set the advanced parameter \"Dies with angled contact surfaces\" to Yes. After the right neck the fork-sensor axis then moves a few millimetres left while the dies open, and after the left neck the feed-out grippers move right after gripping, so the tube is pulled free without damaging the neck. (Requires \"Close right roller gripper before moving offset right axis\" = Yes and \"Delay closing roller gripper\" = 0.)":"Setzen Sie den erweiterten Parameter \u201eMatrizen mit schr\u00e4gen Kontaktfl\u00e4chen\u201c auf Ja. Nach der rechten Dehnung f\u00e4hrt die Sensorachse dann beim \u00d6ffnen der Matrizen einige Millimeter nach links, und nach der linken Dehnung fahren die Greifer der Austragung nach dem Greifen nach rechts, sodass der Schlauch freigezogen wird, ohne die Dehnung zu besch\u00e4digen. (Erfordert \u201eRechten Rollen-Greifer vor Offset rechte Achse schliessen\u201c = Ja und \u201eVerz\u00f6gerung Schliessen Rollen-Greifer\u201c = 0.)","Set the advanced parameter \"Axis synchronization during prestretching\" to Yes (recommended for tube diameter \u2264 2.5 mm) so the opposite axis moves with the necking axis and the tube is not pushed into a bend.":"Setzen Sie den erweiterten Parameter \u201eAchsensynchronisation beim Vordehnen\u201c auf Ja (empfohlen bei Schlauchdurchmesser \u2264 2,5 mm), damit die Gegenachse mit der Dehnachse mitf\u00e4hrt und der Schlauch nicht geknickt wird.","Set \"Pre-tension distance before left neck\" (recommended 0.3 \u00d7 strain relieve right neck for tube \u2264 2 mm) together with \"Keep tube gripped with right axis when starting left neck\" = Yes, so the tube is straight and centred when the dies close for the left neck.":"Setzen Sie \u201eVorspanndistanz vor linker Dehnung\u201c (empfohlen 0,3 \u00d7 Entlastung rechte Dehnung bei Schlauch \u2264 2 mm) zusammen mit \u201eSchlauch mit rechter Achse beim Start der linken Dehnung gegriffen halten\u201c = Ja, damit der Schlauch beim Schliessen der Matrizen f\u00fcr die linke Dehnung gerade und zentriert ist.","Increase \"Gripper pressure left and right\" (the centering grippers that pull the tube through the die).":"Erh\u00f6hen Sie \u201eGreiferdruck links und rechts\u201c (die Zentrier-Greifer, die den Schlauch durch die Matrize ziehen).","For tube diameter above 3 mm set the advanced parameter \"Offset right necking axis before gripping tube\" to about 10 mm so all teeth of the right centering gripper engage the material and it can hold a higher pulling force.":"Bei Schlauchdurchmesser \u00fcber 3 mm setzen Sie den erweiterten Parameter \u201eOffset rechte Dehnachse vor Greifen des Schlauchs\u201c auf ca. 10 mm, damit alle Z\u00e4hne des rechten Zentrier-Greifers in das Material greifen und eine h\u00f6here Zugkraft gehalten werden kann.","The process stops when the recipe parameter \"Number of broken tubes until abort\" is exceeded. Several consecutive breaks point to a process problem \u2014 work through the problem \"Tube breaks during stretching\", then Reset and restart.":"Der Prozess stoppt, wenn der Rezepturparameter \u201eAnzahl gerissene Schl\u00e4uche bis Abbruch\u201c \u00fcberschritten wird. Mehrere Risse in Folge deuten auf ein Prozessproblem hin \u2013 arbeiten Sie das Problem \u201eSchlauch reisst beim Dehnen\u201c durch, dann Reset und Neustart.","No neck was detected before the left axis reached its limit. Make sure the required left stretching distance does not exceed the travel of the left necking axis (use a shorter tube, or reduce the sleeve length via \"Offset right axis\").":"Bis zum Erreichen der Grenze der linken Achse wurde keine Dehnung erkannt. Stellen Sie sicher, dass die erforderliche linke Dehndistanz den Verfahrweg der linken Dehnachse nicht \u00fcberschreitet (k\u00fcrzeren Schlauch verwenden oder die H\u00fclsenl\u00e4nge \u00fcber \u201eOffset rechte Achse\u201c verringern).","Choose the picking fingers for the tube: 2711204-002 standard (1.5\u20137 mm); 2711205-002 thin fingers for small tube (up to about 3 mm) \u2014 they bend more easily so only one tube is picked; 2711204-001 short fingers for very large / thick-walled tube that keeps hanging. Laser-engraved -NA fingers have more friction and raise the risk of picking two tubes.":"W\u00e4hlen Sie die Greiffinger passend zum Schlauch: 2711204-002 Standard (1,5\u20137 mm); 2711205-002 d\u00fcnne Finger f\u00fcr kleinen Schlauch (bis ca. 3 mm) \u2013 sie biegen sich leichter, sodass nur ein Schlauch gegriffen wird; 2711204-001 kurze Finger f\u00fcr sehr grossen/dickwandigen Schlauch, der immer wieder h\u00e4ngen bleibt. Lasergravierte -NA-Finger haben mehr Reibung und erh\u00f6hen das Risiko, zwei Schl\u00e4uche zu greifen.","Set \"Stroke grip\" so the picking fingers are slightly bent when gripping \u2014 a second tube then falls out of the bottom. If the tube deforms too much before the fingers bend, switch to the thinner 2711205-00x fingers.":"Stellen Sie \u201eHub greifen\u201c so ein, dass die Greiffinger beim Greifen leicht durchgebogen sind \u2013 ein zweiter Schlauch f\u00e4llt dann unten heraus. Verformt sich der Schlauch zu stark, bevor sich die Finger biegen, wechseln Sie zu den d\u00fcnneren Fingern 2711205-00x.","Check \"Stroke open\" (opening of the picker gripper, as a percentage added to the tube diameter) and \"Diameter\" in the Picker parameters.":"Pr\u00fcfen Sie \u201eHub \u00f6ffnen\u201c (\u00d6ffnung des Separierer-Greifers als Prozentsatz, der zum Schlauchdurchmesser addiert wird) und \u201eDurchmesser\u201c in den Separierer-Parametern.","Adjust \"Gripper sensor correction\": decrease it so the gripper dives deeper into the tube pile (tube sits higher between the fingers), increase it to dive less deep.":"Passen Sie \u201eGreifersensor-Korrektur\u201c an: verringern, damit der Greifer tiefer in den Schlauchstapel eintaucht (Schlauch sitzt h\u00f6her zwischen den Fingern), erh\u00f6hen, um weniger tief einzutauchen.","If tubes stick together from static charge, set \"Use ionizer at picker\" to Yes (only when the feed-in ionizer is fitted) and keep \"Use ionizer for reorder\" on so an air blow re-centres the remaining tubes in the hopper after several empty picks.":"Wenn Schl\u00e4uche durch statische Aufladung zusammenkleben, setzen Sie \u201eIonisator am Separierer verwenden\u201c auf Ja (nur wenn der Ionisator an der Zuf\u00fchrung eingebaut ist) und lassen Sie \u201eIonisator zum Neuordnen verwenden\u201c eingeschaltet, damit ein Luftstoss die restlichen Schl\u00e4uche nach mehreren Leergriffen wieder in die Mitte des Magazins bringt.","Fill new raw tubes into the hopper.":"F\u00fcllen Sie neue Rohschl\u00e4uche in das Magazin.","Press the emergency stop and check by hand that the picker gripper fingers open and close freely without jamming. The finger sheets can be misaligned so that screw heads catch on the sheet when the gripper closes; realign them.":"Dr\u00fccken Sie den Not-Aus und pr\u00fcfen Sie von Hand, ob sich die Greiffinger des Separierers frei \u00f6ffnen und schliessen lassen, ohne zu klemmen. Die Greiffingerbleche k\u00f6nnen so verschoben sein, dass sich die Schraubenk\u00f6pfe beim Schliessen des Greifers im Blech verhaken; richten Sie sie neu aus.","Make sure nothing is in front of the left discharge monitoring sensor at the tube picker.":"Stellen Sie sicher, dass sich nichts vor dem linken Sensor zur \u00dcberwachung der Austragung am Separierer befindet.","Make sure nothing is in front of the right discharge monitoring sensor at the tube picker.":"Stellen Sie sicher, dass sich nichts vor dem rechten Sensor zur \u00dcberwachung der Austragung am Separierer befindet.","The tube was lost during the process. Remove the tube from the machine, press Reset and continue the process.":"Der Schlauch ist w\u00e4hrend des Prozesses verloren gegangen. Entfernen Sie den Schlauch aus der Maschine, dr\u00fccken Sie Reset und setzen Sie den Prozess fort.","Remove the tube or object sticking out of (or hanging into) the tube collector.":"Entfernen Sie den Schlauch oder Gegenstand, der aus der Austragsschublade herausragt (oder in sie hineinh\u00e4ngt).","Close the tube collector.":"Schliessen Sie die Austragsschublade.","Set \"Gripper pressure feed out\" to at least 1.5 bar so the feed-out grippers close correctly and in time.":"Setzen Sie \u201eGreiferdruck Austragung\u201c auf mindestens 1,5 bar, damit die Greifer der Austragung korrekt und rechtzeitig schliessen.","Release the emergency stop and press the blue illuminated reset button on top of the emergency-stop switch.":"Geben Sie den Not-Aus-Schalter frei und dr\u00fccken Sie die blau leuchtende Reset-Taste oberhalb des Not-Aus-Schalters.","Close the safety door and reload the recipe.":"Schliessen Sie die Sicherheitst\u00fcr und laden Sie die Rezeptur erneut.","Close the safety door.":"Schliessen Sie die Sicherheitst\u00fcr.","Press \"Reset\" on the HMI.":"Dr\u00fccken Sie \u201eReset\u201c am HMI.","Check the main pressure switch.":"\u00dcberpr\u00fcfen Sie den Hauptdruckschalter.","Check the compressed-air supply (6\u20138 bar / 87\u2013116 psi). Cylinders need at least 1 bar to work.":"\u00dcberpr\u00fcfen Sie die Druckluftversorgung (6\u20138 bar / 87\u2013116 psi). Die Zylinder ben\u00f6tigen mindestens 1 bar.","A tube was detected while the process is in simulation mode. Remove the tube, or take the machine out of simulation.":"W\u00e4hrend des Simulationsmodus wurde ein Schlauch erkannt. Entfernen Sie den Schlauch oder beenden Sie die Simulation.","Check that the Ethernet connectors at the motor controllers and at the PLC are fully plugged in.":"Pr\u00fcfen Sie, ob die Ethernet-Stecker an den Motorsteuerungen und an der SPS vollst\u00e4ndig eingesteckt sind.","Make sure the IO-Link master is connected to the PLC via Ethernet, and that the connector of the electrical gripper at the picker is still connected.":"Stellen Sie sicher, dass der IO-Link-Master per Ethernet mit der SPS verbunden ist und dass der Stecker des elektrischen Greifers am Separierer noch steckt.","Critical error: can only be resolved by a technician. Contact support.":"Kritischer Fehler: Kann nur von einem Techniker behoben werden. Kontaktieren Sie den Support.","Push the right necking axis by hand at least 50 mm to the right, then restart the machine to reset the axis reference points.":"Schieben Sie die rechte Dehnachse von Hand mindestens 50 mm nach rechts und starten Sie die Maschine neu, um die Referenzpunkte der Achse zur\u00fcckzusetzen.","If this recurs when the axes return to the start position: the fork-sensor cylinder's retract signal may be arriving late because the cylinder has mechanical resistance over its last millimetres and briefly sticks. Have the cylinder checked and freed.":"Wenn dies beim Zur\u00fcckfahren der Achsen auf die Startposition erneut auftritt: Das R\u00fcckzugssignal des Zylinders der Gabellichtschranke kommt m\u00f6glicherweise zu sp\u00e4t, weil der Zylinder auf den letzten Millimetern mechanisch schwerg\u00e4ngig ist und kurz stecken bleibt. Zylinder pr\u00fcfen und gangbar machen lassen.","Wait until the split die has reached the set temperature.":"Warten Sie, bis die zweigeteilte Matrize die Solltemperatur erreicht hat.","Make sure the feed-out ionizer (the one with the fan) is powered on (toggle switch on the ionizer) and that all parts of the fan are correctly mounted and snapped in place.":"Stellen Sie sicher, dass der Ionisator der Austragung (der mit dem L\u00fcfter) eingeschaltet ist (Kippschalter am Ionisator) und dass alle Teile des L\u00fcfters korrekt montiert und eingerastet sind.","Clean the ionizer emitters: switch the power supply off and confirm the fan has stopped; press part A of the emitter cartridge and pull the cartridge out towards the air-blow side; clean the eight emitters with a cotton swab soaked in reagent ethanol (\u2265 99.5 %); refit the cartridge so its terminals contact the body terminals, with no foreign matter on the connector.":"Reinigen Sie die Emitter des Ionisators: Stromversorgung ausschalten und sicherstellen, dass der L\u00fcfter steht; Teil A der Emitterkassette dr\u00fccken und die Kassette zur Luftaustrittsseite herausziehen; die acht Emitter mit einem in Reagenz-Ethanol (\u2265 99,5 %) getr\u00e4nkten Wattest\u00e4bchen reinigen; Kassette so einsetzen, dass ihre Kontakte die Kontakte des Geh\u00e4uses ber\u00fchren und keine Fremdk\u00f6rper am Stecker haften.","Check that the PC is running.":"Pr\u00fcfen Sie, ob der PC l\u00e4uft.","Check the touchscreen cables and plugs, and the touchscreen's control light.":"\u00dcberpr\u00fcfen Sie die Kabel und Stecker des Touchscreens sowie seine Kontrollleuchte.","Check the fuse.":"\u00dcberpr\u00fcfen Sie die Sicherung.","Make sure the control valves are adjusted according to your work instruction.":"Stellen Sie sicher, dass die Steuerventile gem\u00e4ss Ihrer Arbeitsanweisung eingestellt sind.","Check whether the motor controllers display an error.":"Pr\u00fcfen Sie, ob die Motorsteuerungen einen Fehler anzeigen.","Check the fuses for the stepper motor.":"\u00dcberpr\u00fcfen Sie die Sicherungen f\u00fcr den Schrittmotor.","Check whether the axis is standing on a limit switch.":"Pr\u00fcfen Sie, ob die Achse auf einem Endschalter steht.","Check the fuse and the temperature controller.":"\u00dcberpr\u00fcfen Sie die Sicherung und den Temperaturregler.","Check the release relay for the heating process.":"\u00dcberpr\u00fcfen Sie das Freigaberelais f\u00fcr den Heizprozess.","Check the input and output of the solid-state relay.":"\u00dcberpr\u00fcfen Sie Ein- und Ausgang des Halbleiterrelais.","Check the function of the heat cartridges.":"\u00dcberpr\u00fcfen Sie die Funktion der Heizpatronen.","The temperature sensor is probably disconnected or short-circuited. Check its wiring and connector.":"Der Temperatursensor ist wahrscheinlich getrennt oder kurzgeschlossen. Pr\u00fcfen Sie Verkabelung und Stecker.","Press the emergency stop, reset the alarm, and try to start the process again.":"Dr\u00fccken Sie den Not-Aus, quittieren Sie den Alarm und versuchen Sie, den Prozess erneut zu starten.","Restart the machine by switching the main switch off and on.":"Starten Sie die Maschine neu, indem Sie den Hauptschalter aus- und wieder einschalten.","In the Festo Automation Suite check the parameter \"Maximum Torque Symmetrical\" (P1.526796) on the affected axis \u2014 this value has been observed to drop by itself. Restore it to the correct value.":"Pr\u00fcfen Sie in der Festo Automation Suite den Parameter \u201eMaximum Torque Symmetrical\u201c (P1.526796) an der betroffenen Achse \u2013 es wurde beobachtet, dass dieser Wert von allein absinkt. Stellen Sie den korrekten Wert wieder her.","Make sure the PC's IP address is set correctly in the machine's range (192.168.1.xxx); the Festo controllers are visible on the network but no connection can be established otherwise.":"Stellen Sie sicher, dass die IP-Adresse des PCs korrekt im Bereich der Maschine (192.168.1.xxx) eingestellt ist; die Festo-Regler werden sonst zwar im Netzwerk erkannt, es kann aber keine Verbindung aufgebaut werden.","Check that the PLC OS is at least V1.17 and the Festo controller firmware matches the ESI file (working combination: ESI Festo-CMMT-AS-MP-S1-CiA402-20240702 with firmware 35.9.2.5078). After loading new software or a new ESI file, run \"compare and download\" in JetSym.":"Pr\u00fcfen Sie, ob das SPS-OS mindestens V1.17 ist und die Firmware der Festo-Regler zur ESI-Datei passt (funktionierende Kombination: ESI Festo-CMMT-AS-MP-S1-CiA402-20240702 mit Firmware 35.9.2.5078). Nach dem Laden neuer Software oder einer neuen ESI-Datei in JetSym \u201eVergleichen und herunterladen\u201c ausf\u00fchren.","Update the necker PLC software to V2.9.0.0 or later, where the fork-sensor-axis torque reduction that caused tracking errors was removed. Follow the BW-TEC upgrade notes.":"Aktualisieren Sie die SPS-Software des Schlauchdehners auf V2.9.0.0 oder neuer, in der die Drehmomentreduktion der Sensorachse, die Schleppfehler verursachte, entfernt wurde. Befolgen Sie die BW-TEC-Upgrade-Hinweise.","Have the toothed belts checked (annual inspection) and replaced if necessary. Contact a BW-TEC technician.":"Lassen Sie die Zahnriemen pr\u00fcfen (j\u00e4hrliche Inspektion) und bei Bedarf ersetzen. Kontaktieren Sie einen BW-TEC-Techniker.","Lubricate the three linear axes (right necking, left necking, fork sensor) once a year with an FDA/USDA-H1 grease: remove the axis cover strip to reach the ball-screw spindle.":"Schmieren Sie die drei Linearachsen (Dehnachse rechts, Dehnachse links, Sensorachse) einmal j\u00e4hrlich mit einem FDA/USDA-H1-konformen Fett: Entfernen Sie den Abdeckstreifen der Achse, um an die Kugelgewindespindel zu gelangen.","Use \"Slug length correction\" to compensate a consistent difference between the measured slug length and the \"Slug length\" parameter. For slugs shorter than the 17 mm minimum, use \"Delay stop left axis\" on the Left necking tab.":"Verwenden Sie \u201eKorrektur ungereckte L\u00e4nge\u201c, um eine konstante Abweichung zwischen gemessener und eingestellter \u201eUngereckte L\u00e4nge\u201c auszugleichen. F\u00fcr Rohlinge k\u00fcrzer als das Minimum von 17 mm verwenden Sie \u201eVerz\u00f6gerung Stopp linke Achse\u201c auf der Registerkarte Links dehnen.","Machine areas":"Maschinenbereiche","Tube picker (separator)":"Separierer","Picks single raw tubes out of the hopper with an electrical gripper and sheet-metal picking fingers; discharge monitoring sensors check that only one tube leaves.":"Greift einzelne Rohschl\u00e4uche mit einem elektrischen Greifer und Greiffingerblechen aus dem Magazin; Sensoren zur Austragungs\u00fcberwachung pr\u00fcfen, dass nur ein Schlauch entnommen wird.","Feed in":"Zuf\u00fchrung","Horizontal and vertical axes plus a roller gripper that bring the tube into the necking station.":"Horizontale und vertikale Achse sowie ein Rollen-Greifer, die den Schlauch in die Dehnstation bringen.","Necker":"Dehnstation","Heated split dies, left and right necking axes with centering and roller grippers, and the fork-sensor axis that defines the slug length.":"Beheizte zweigeteilte Matrizen, linke und rechte Dehnachse mit Zentrier- und Rollen-Greifern sowie die Sensorachse, die die ungereckte L\u00e4nge definiert.","Feed out":"Austragung","Two pneumatic grippers that place the necked tube into the tube collector; an ionizer with fan reduces static cling.":"Zwei pneumatische Greifer, die den gedehnten Schlauch in die Austragsschublade legen; ein Ionisator mit L\u00fcfter reduziert statische Anhaftung.","Process terms":"Prozessbegriffe","Neck / necking":"Dehnung / Dehnen","Pulling the heated tube through a split die smaller than the tube to reduce its diameter. Both ends are necked to the same diameter.":"Der erw\u00e4rmte Schlauch wird durch eine zweigeteilte Matrize gezogen, die kleiner ist als der Schlauch, um seinen Durchmesser zu reduzieren. Beide Enden werden auf denselben Durchmesser gedehnt.","Slug (parison)":"Rohling (ungereckte L\u00e4nge)","The un-necked section left in the middle of the tube. Its length is set by the distance between the die and the fork sensor (\"Slug length\", minimum 17 mm).":"Der ungedehnte Abschnitt in der Mitte des Schlauchs. Seine L\u00e4nge wird durch den Abstand zwischen Matrize und Gabellichtschranke festgelegt (\u201eUngereckte L\u00e4nge\u201c, mindestens 17 mm).","Sleeve":"H\u00fclse","The necked section on either side of the slug. Right sleeve length = \"Stretching distance\"; left sleeve length is controlled by \"Offset right axis\".":"Der gedehnte Abschnitt beidseits des Rohlings. L\u00e4nge der rechten H\u00fclse = \u201eDehnen Distanz\u201c; die L\u00e4nge der linken H\u00fclse wird \u00fcber \u201eOffset rechte Achse\u201c gesteuert.","Prestretching":"Vordehnen","An optional pre-pull for large-diameter tube with a large reduction ratio, used only if the tube keeps breaking when the dies close.":"Ein optionaler Vorzug f\u00fcr Schl\u00e4uche mit grossem Durchmesser und hohem Reduktionsverh\u00e4ltnis, nur wenn der Schlauch beim Schliessen der Matrizen immer wieder reisst.","Strain relieve":"Entlastung","The distance the necking axis moves back after stretching to release tension before the dies open.":"Die Distanz, die die Dehnachse nach dem Dehnen zur\u00fcckf\u00e4hrt, um die Spannung vor dem \u00d6ffnen der Matrizen abzubauen.","Key recipe parameters":"Wichtige Rezepturparameter","Start pressure die / Process pressure die / Process pressure ramp die":"Startdruck Matrize / Prozessdruck Matrize / Prozessdruckrampe Matrize","The die closes at the start pressure (the tube moulds into the die as stretching starts), then ramps to the process pressure at the ramp rate.":"Die Matrize schliesst mit dem Startdruck (der Schlauch formt sich beim Beginn des Dehnens in die Matrize), dann steigt der Druck mit der Rampenrate auf den Prozessdruck.","Speed / Acceleration":"Geschwindigkeit / Beschleunigung","Pulling speed through the die and how quickly it is reached.":"Zuggeschwindigkeit durch die Matrize und wie schnell sie erreicht wird.","Tube detection sensitivity":"Empfindlichkeit Schlaucherkennung","Fork-sensor threshold that stops the left axis when the slug edge is detected \u2014 70 % of the difference between the sleeve and un-necked tube readings.":"Schwellwert der Gabellichtschranke, der die linke Achse stoppt, wenn die Kante des Rohlings erkannt wird \u2013 70 % der Differenz zwischen den Messwerten von H\u00fclse und ungedehntem Schlauch.","Number of broken tubes until abort":"Anzahl gerissene Schl\u00e4uche bis Abbruch","How many consecutive broken tubes are tolerated before the automatic process stops.":"Wie viele nacheinander gerissene Schl\u00e4uche toleriert werden, bevor der automatische Prozess stoppt.","Limits":"Grenzwerte","Machine limits":"Maschinengrenzen","Raw tube 0.7\u20137 mm; neck-down 0.4\u20135.2 mm; travel 450 mm (L) / 730 mm (R); speed 0\u2013400 mm/s; process temperature 20\u2013200 \u00b0C; air 6\u20138 bar.":"Rohschlauch 0,7\u20137 mm; Dehnung auf 0,4\u20135,2 mm; Verfahrweg 450 mm (L) / 730 mm (R); Geschwindigkeit 0\u2013400 mm/s; Prozesstemperatur 20\u2013200 \u00b0C; Druckluft 6\u20138 bar."},"es-ES":{"Machine line":"L\u00ednea de m\u00e1quina","View":"Vista","Guided fix":"Soluci\u00f3n guiada","Full matrix":"Matriz completa","Mode":"Modo","Operator":"Operador","MSI internal":"MSI interno","Language":"Idioma","Start over":"Empezar de nuevo","Cause":"Causa","Adjustment":"Ajuste","potential causes, most likely first":"causas posibles, la m\u00e1s probable primero","adjustments, in the order to try them":"ajustes, en el orden en que deben probarse","Check and adjust":"Comprobar y ajustar","What to do and why":"Qu\u00e9 hacer y por qu\u00e9","Caution":"Precauci\u00f3n","Yes, fixed":"S\u00ed, resuelto","No, next cause":"No, siguiente causa","No, next adjustment":"No, siguiente ajuste","Not applicable, skip":"No aplica, omitir","Back":"Atr\u00e1s","Did MSI Service resolve it, or do you want to move on?":"\u00bfLo resolvi\u00f3 el Servicio de MSI o desea continuar?","item.":"\u2014 tarea de servicio.","Resolved":"Resuelto","Resolved \u2014 cause:":"Resuelto \u2014 causa:","If the problem returns, start here first.":"Si el problema vuelve a aparecer, empiece por aqu\u00ed.","Not resolved":"No resuelto","All listed causes tried without resolving the problem":"Se han probado todas las causas indicadas sin resolver el problema","Support summary (copy and send)":"Resumen para el soporte (copiar y enviar)","Copy summary":"Copiar resumen","Copied":"Copiado","Troubleshoot this problem again":"Repetir la soluci\u00f3n de este problema","Choose another problem":"Elegir otro problema","Change":"Cambiar","Problem":"Problema","Potential cause":"Causa posible","Remedy":"Soluci\u00f3n","Cautions":"Precauciones","Run guided fix for this problem":"Iniciar la soluci\u00f3n guiada de este problema","problem descriptions":"descripciones de problemas","cause/remedy pairs":"pares causa/soluci\u00f3n","Code glossary":"Glosario de c\u00f3digos","internal":"interno","Diagnostic codes":"C\u00f3digos de diagn\u00f3stico","Caution codes":"C\u00f3digos de precauci\u00f3n","reference":"referencia","Source:":"Fuente:","If the guided steps don't resolve the problem, contact":"Si los pasos guiados no resuelven el problema, contacte con","with the summary the tool prepares for you.":"con el resumen que la herramienta prepara para usted.","Internal mode shows source code references and service-level repair steps.":"El modo interno muestra las referencias de c\u00f3digos de la fuente y los pasos de reparaci\u00f3n de nivel de servicio.","fixed":"resuelto","no change":"sin cambios","skipped":"omitido","MSI internal note":"Nota interna de MSI","service":"servicio","support summary":"resumen para el soporte","Machine line:":"L\u00ednea de m\u00e1quina:","Problem:":"Problema:","Date:":"Fecha:","Steps worked through:":"Pasos realizados:","FIXED":"RESUELTO","tried, not fixed":"probado, no resuelto","skipped / not applicable":"omitido / no aplica","Install this troubleshooter":"Instalar esta gu\u00eda de soluci\u00f3n de problemas","Works offline on the shop floor.":"Funciona sin conexi\u00f3n en la planta.","Tap the Share button, then \"Add to Home Screen\".":"Pulse el bot\u00f3n Compartir y luego \u00abA\u00f1adir a pantalla de inicio\u00bb.","Install":"Instalar","Tip types, tooling, parameters and materials":"Tipos de punta, herramental, par\u00e1metros y materiales","glossary":"glosario","Change problem":"Cambiar de problema","BW-TEC 2711 Troubleshooter":"Gu\u00eda de soluci\u00f3n de problemas BW-TEC 2711","What is the machine doing?":"\u00bfQu\u00e9 est\u00e1 haciendo la m\u00e1quina?","Pick the symptom, or the alarm or warning as worded on the HMI.":"Elija el s\u00edntoma, o la alarma o advertencia tal como aparece en el HMI.","guided fix":"soluci\u00f3n guiada","Resolve a 2711 automatic necker problem one likely cause at a time":"Resuelva un problema del estrechador autom\u00e1tico 2711 una causa probable a la vez","Choose the symptom or HMI message. The tool walks you through the potential causes in order, with the checks and recipe adjustments for each. Causes that need a technician are marked for support.":"Elija el s\u00edntoma o el mensaje del HMI. La herramienta le gu\u00eda por las causas posibles en orden, con las comprobaciones y los ajustes de receta de cada una. Las causas que requieren un t\u00e9cnico est\u00e1n marcadas para el soporte.","After clearing any alarm, press \"Reset\" on the HMI before starting a new process.":"D ality":"Proceso y calidad del producto","Tube handling":"Manipulaci\u00f3n del tubo","Alarms on the HMI":"Alarmas en el HMI","Warnings on the HMI":"Advertencias en el HMI","Machine & electrical":"M\u00e1quina y sistema el\u00e9ctrico","User Manual Automatic Necking Machine Type 2711 (2711-01-02-03 E) and 2711 Support Notes Version A (12.02.2026)":"Manual de usuario de la m\u00e1quina de estrechado autom\u00e1tico tipo 2711 (2711-01-02-03 E) y notas de soporte 2711 versi\u00f3n A (12.02.2026)","Tube breaks during stretching (necking)":"El tubo se rompe durante el estirado (estrechado)","The machine detects the break, ejects the tube and continues. Several breaks in a row stop the process (\"Multiple failed tube neckings\"). Work through the causes in order \u2014 the first three are the usual ones.":"La m\u00e1quina detecta la rotura, expulsa el tubo y contin\u00faa. Varias roturas seguidas detienen el proceso (\u00abMultiple failed tube neckings\u00bb). Recorra las causas en orden: las tres primeras son las habituales.","Dies close too hard, too early":"Las matrices cierran con demasiada fuerza y demasiado pronto","Axis acceleration too low \u2014 tube is compressed instead of sliding into the die":"Aceleraci\u00f3n del eje demasiado baja: el tubo se comprime en lugar de deslizarse en la matriz","Axis acceleration too high \u2014 no time for die heat to transfer into the material":"Aceleraci\u00f3n del eje demasiado alta: el calor de la matriz no tiene tiempo de transferirse al material","Tube not centred between the dies (too high or too low) and jammed":"El tubo no est\u00e1 centrado entre las matrices (demasiado alto o bajo) y queda atascado","Die temperature too low":"Temperatura de la matriz demasiado baja","Dies dirty":"Matrices sucias","Die diameter too small for the tube":"Di\u00e1metro de la matriz demasiado peque\u00f1o para el tubo","Stretching speed too high":"Velocidad de estirado demasiado alta","Large-diameter tube with a large reduction ratio breaking as the dies close":"Tubo de gran di\u00e1metro con una relaci\u00f3n de reducci\u00f3n alta se rompe al cerrar las matrices","Small tube breaking as the dies close (older machines with doors)":"Tubo peque\u00f1o se rompe al cerrar las matrices (m\u00e1quinas antiguas con puertas)","Small tube clamped between the die contact surfaces":"Tubo peque\u00f1o queda pinzado entre las superficies de contacto de la matriz","Slug (parison) length is irregular":"La longitud del tramo sin estrechar (preforma) es irregular","\"Tube detection sensitivity\" not set correctly":"\u00abTube detection sensitivity\u00bb (sensibilidad de detecci\u00f3n del tubo) mal ajustada","Fork sensor that detects the edge of the slug is dirty":"El sensor de horquilla que detecta el borde de la preforma est\u00e1 sucio","Measured length differs consistently from the set value":"La longitud medida difiere sistem\u00e1ticamente del valor ajustado","Machine reports a broken tube although the tube did not break":"La m\u00e1quina indica tubo roto aunque el tubo no se rompi\u00f3","Fork sensor dirty":"Sensor de horquilla sucio","Indentation in the tube from the roller gripper":"Marca (hendidura) en el tubo por la pinza de rodillo","The right roller gripper closes on the freshly necked, still-hot tube and can leave a mark.":"La pinza de rodillo derecha se cierra sobre el tubo reci\u00e9n estrechado y todav\u00eda caliente, y puede dejar una marca.","Roller gripper pressure too high on the still-hot tube leaving the dies":"Presi\u00f3n de la pinza de rodillo demasiado alta sobre el tubo a\u00fan caliente que sale de las matrices","Indentation persists at minimum pressure":"La marca persiste con la presi\u00f3n m\u00ednima","Marks from the split-die edges on the slug":"Marcas de los bordes de la matriz partida en la preforma","Tube still under tension when the dies open \u2014 strain not relieved":"El tubo sigue en tensi\u00f3n cuando se abren las matrices: no se ha aliviado la tensi\u00f3n","Diameter increase right before the slug":"Aumento de di\u00e1metro justo antes de la preforma","Necked tube stuck in one die half after the dies open \u2014 neck damaged when pulled free":"El tubo estrechado queda pegado en una mitad de la matriz al abrirse: el cuello se da\u00f1a al liberarlo","Dies with angled contact surfaces act as a funnel":"Las matrices con superficies de contacto inclinadas act\u00faan como un embudo","Tube bends during prestretching":"El tubo se dobla durante el preestirado","Small, flexible tube pushed against the stationary opposite axis":"Tubo peque\u00f1o y flexible empujado contra el eje opuesto inm\u00f3vil","Tube sags or is off-centre when the dies close for the left neck":"El tubo cuelga o est\u00e1 descentrado cuando las matrices cierran para el cuello izquierdo","Small tube bending under its own weight":"Tubo peque\u00f1o que se dobla por su propio peso","Tube slips out of the centering gripper while stretching":"El tubo se escapa de la pinza de centrado durante el estirado","Centering-gripper pressure too low":"Presi\u00f3n de la pinza de centrado demasiado baja","Large-diameter tube \u2014 not all gripper teeth engaged":"Tubo de gran di\u00e1metro: no todos los dientes de la pinza agarran","Tube is always pinched at the top or bottom of the die":"El tubo siempre queda pinzado en la parte superior o inferior de la matriz","Centering-gripper fingers not at the same height (parallel gripper misaligned)":"Los dedos de la pinza de centrado no est\u00e1n a la misma altura (pinza paralela desalineada)","Picker picks two tubes at once":"El separador toma dos tubos a la vez","\"Stroke grip\" not bending the picking fingers slightly":"\u00abStroke grip\u00bb (carrera de agarre) no flexiona ligeramente los dedos de toma","Picking fingers unsuitable for the tube diameter (e.g. high-friction -NA fingers on small tube)":"Dedos de toma inadecuados para el di\u00e1metro del tubo (p. ej. dedos -NA de alta fricci\u00f3n con tubo peque\u00f1o)","Tubes stick together from static charge":"Los tubos se pegan entre s\u00ed por carga est\u00e1tica","Picker picks no tube (empty picks) or tubes hang from the fingers":"El separador no toma ning\u00fan tubo (tomas vac\u00edas) o los tubos cuelgan de los dedos","Gripper diving depth wrong":"Profundidad de inmersi\u00f3n de la pinza incorrecta","Picking fingers unsuitable for the tube (hanging tubes on large / thick-walled tube)":"Dedos de toma inadecuados para el tubo (tubos colgando con tubo grande / de pared gruesa)","Opening stroke or tube diameter wrong in the Picker parameters":"Carrera de apertura o di\u00e1metro del tubo incorrectos en los par\u00e1metros del separador","Remaining tubes not in the centre of the hopper":"Los tubos restantes no est\u00e1n en el centro de la tolva","Picker gripper does not close fully or behaves oddly":"La pinza del separador no cierra del todo o se comporta de forma extra\u00f1a","Warning \"Tube lack detected\"":"Advertencia \u00abTube lack detected\u00bb","Hopper empty":"Tolva vac\u00eda","Alarm \"Discharge monitoring sensor left/right at Tube Picker blocked\"":"Alarma \u00abDischarge monitoring sensor left/right at Tube Picker blocked\u00bb","Something in front of the left sensor":"Hay algo delante del sensor izquierdo","Something in front of the right sensor":"Hay algo delante del sensor derecho","Alarm \"Tube at feed out not detected\"":"Alarma \u00abTube at feed out not detected\u00bb","Tube lost during the process":"Tubo perdido durante el proceso","Feed-out grippers not closing correctly":"Las pinzas de descarga no cierran correctamente","Alarm \"Light barrier at tube collector blocked\"":"Alarma \u00abLight barrier at tube collector blocked\u00bb","Tube or object sticking out of or hanging into the collector":"Tubo u objeto que sobresale del colector o cuelga dentro de \u00e9l","Warning \"Tube collector is not closed\"":"Advertencia \u00abTube collector is not closed\u00bb","Collector open":"Colector abierto","Alarm \"Emergency Stop pressed\"":"Alarma \u00abEmergency Stop pressed\u00bb","Emergency stop is latched":"Parada de emergencia enclavada","Alarm \"Safety door opened during process\"":"Alarma \u00abSafety door opened during process\u00bb","Door opened while running":"Puerta abierta durante el funcionamiento","Alarm \"Immediate stop triggered\"":"Alarma \u00abImmediate stop triggered\u00bb","Immediate stop":"Parada inmediata","Alarm \"No air pressure connected\"":"Alarma \u00abNo air pressure connected\u00bb","Main pressure switch":"Presostato principal","Compressed-air supply":"Suministro de aire comprimido","Alarm \"Tube detected despite process simulation\"":"Alarma \u00abTube detected despite process simulation\u00bb","Tube present in simulation mode":"Hay un tubo presente en modo simulaci\u00f3n","Alarm \"EtherCat disconnected\"":"Alarma \u00abEtherCat disconnected\u00bb","Ethernet connector loose at a motor controller or the PLC":"Conector Ethernet suelto en un controlador de motor o en el PLC","Alarm \"Error controller \u2026 axis\" / \"Error program \u2026 axis\" (picker, necking, feed in, feed out, sensor axis)":"Alarma \u00abError controller \u2026 axis\u00bb / \u00abError program \u2026 axis\u00bb (separador, estrechado, alimentaci\u00f3n, descarga, eje del sensor)","Drive or program fault on the axis":"Fallo de accionamiento o de programa en el eje","\"Axis fork sensor\" error keeps returning with a tracking error in JetSym (older PLC software)":"El error \u00abAxis fork sensor\u00bb reaparece con un error de seguimiento en JetSym (software de PLC antiguo)","Festo axes suddenly have less force than they should":"Los ejes Festo tienen de repente menos fuerza de la debida","Alarm \"Error IO-Link connection picker gripper\"":"Alarma \u00abError IO-Link connection picker gripper\u00bb","IO-Link master or gripper connector disconnected":"Maestro IO-Link o conector de la pinza desconectado","Alarm \"Temperature controller error\"":"Alarma \u00abTemperature controller error\u00bb","Critical temperature-controller fault":"Fallo cr\u00edtico del controlador de temperatura","Alarm \"Hardware limit \u2026 reached\" (necking axis left/right, sensor axis)":"Alarma \u00abHardware limit \u2026 reached\u00bb (eje de estrechado izquierdo/derecho, eje del sensor)","Left hardware limit of the left necking axis reached":"L\u00edmite f\u00edsico izquierdo del eje de estrechado izquierdo alcanzado","Right hardware limit of the right necking axis reached":"L\u00edmite f\u00edsico derecho del eje de estrechado derecho alcanzado","Right hardware limit of the sensor axis reached":"L\u00edmite f\u00edsico derecho del eje del sensor alcanzado","Alarm \"Software limit \u2026 reached\" (necking axis left/right, fork sensor axis)":"Alarma \u00abSoftware limit \u2026 reached\u00bb (eje de estrechado izquierdo/derecho, eje del sensor de horquilla)","Left software limit reached (left necking axis, right necking axis, or fork sensor axis)":"L\u00edmite de software izquierdo alcanzado (eje de estrechado izquierdo, derecho o eje del sensor de horquilla)","Right software limit reached (left necking axis, right necking axis, or fork sensor axis)":"L\u00edmite de software derecho alcanzado (eje de estrechado izquierdo, derecho o eje del sensor de horquilla)","Right software limit of the right necking axis keeps recurring during the process":"El l\u00edmite de software derecho del eje de estrechado derecho se repite durante el proceso","Alarm \"Avoid collision between necking axis right and necking axis sensor\"":"Alarma \u00abAvoid collision between necking axis right and necking axis sensor\u00bb","Right necking axis too close to the sensor axis":"Eje de estrechado derecho demasiado cerca del eje del sensor","Recurs when the axes return to the start position":"Se repite cuando los ejes vuelven a la posici\u00f3n inicial","Alarm \"Error signal \u2026 gripper\" (die grippers, centering grippers, roller grippers, feed-out grippers)":"Alarma \u00abError signal \u2026 gripper\u00bb (pinzas de matriz, de centrado, de rodillo, de descarga)","Gripper blocked, or recipe gripper pressure too low":"Pinza bloqueada, o presi\u00f3n de pinza de la receta demasiado baja","\"Error signal feed in centering gripper\"":"\u00abError signal feed in centering gripper\u00bb","Alarm \"Error signal \u2026 cylinder\" (necking cylinder diameter sensor, feed-in cylinder)":"Alarma \u00abError signal \u2026 cylinder\u00bb (cilindro del sensor de di\u00e1metro, cilindro de alimentaci\u00f3n)","Cylinder blocked":"Cilindro bloqueado","Alarm \"Error temperature Die front/back out of range\"":"Alarma \u00abError temperature Die front/back out of range\u00bb","Wires to the split dies damaged":"Cables a las matrices partidas da\u00f1ados","Warning \"Temperature controller not ready\"":"Advertencia \u00abTemperature controller not ready\u00bb","Split die has not reached the set temperature yet":"La matriz partida a\u00fan no ha alcanzado la temperatura ajustada","Warning \"Necking limit left reached\"":"Advertencia \u00abNecking limit left reached\u00bb","Required left stretching distance exceeds the axis travel":"La distancia de estirado izquierda necesaria supera el recorrido del eje","Warning \"Multiple failed tube neckings\" / \"Right necking failed\" / \"Left necking failed\"":"Advertencia \u00abMultiple failed tube neckings\u00bb / \u00abRight necking failed\u00bb / \u00abLeft necking failed\u00bb","Several tubes broke consecutively":"Varios tubos se rompieron consecutivamente","Warning \"Safety door is open\"":"Advertencia \u00abSafety door is open\u00bb","Door open":"Puerta abierta","Warning \"Error ionizer feed out\"":"Advertencia \u00abError ionizer feed out\u00bb","Ionizer switched off or fan parts not snapped in":"Ionizador apagado o piezas del ventilador no encajadas","Warning \"Maintenance required on ionizer at feed out\"":"Advertencia \u00abMaintenance required on ionizer at feed out\u00bb","Emitters need cleaning":"Los emisores necesitan limpieza","No picture on the touchscreen":"No hay imagen en la pantalla t\u00e1ctil","PC not running":"El PC no est\u00e1 en marcha","Touchscreen cables / plugs / control light":"Cables / conectores / luz de control de la pantalla t\u00e1ctil","Fuse":"Fusible","Cylinders are not working":"Los cilindros no funcionan","No compressed air in the machine":"No hay aire comprimido en la m\u00e1quina","Control valves not set per work instruction":"V\u00e1lvulas de control no ajustadas seg\u00fan la instrucci\u00f3n de trabajo","Axes are not moving":"Los ejes no se mueven","Motor controller shows an error":"El controlador de motor muestra un error","Axis standing on a limit switch":"El eje est\u00e1 sobre un final de carrera","Stepper-motor fuses":"Fusibles del motor paso a paso","Heating element does not heat up":"El elemento calefactor no calienta","Fuse or temperature controller":"Fusible o controlador de temperatura","Release relay for the heating process":"Rel\u00e9 de habilitaci\u00f3n del proceso de calentamiento","Solid-state relay input / output":"Entrada / salida del rel\u00e9 de estado s\u00f3lido","Set temperature is reached very slowly":"La temperatura ajustada se alcanza muy lentamente","Heat cartridges faulty":"Cartuchos calefactores defectuosos","Temperature display shows about 800 \u00b0C above room temperature":"La pantalla de temperatura muestra unos 800 \u00b0C por encima de la temperatura ambiente","Temperature sensor disconnected or short-circuited":"Sensor de temperatura desconectado o en cortocircuito","Process does not start after pressing \"Start\"":"El proceso no arranca tras pulsar \u00abStart\u00bb","Alarm not cleared":"Alarma no reconocida","Control needs a restart":"El control necesita un reinicio","Cannot connect to or download firmware to the Festo motor controllers":"No se puede conectar con los controladores de motor Festo ni descargar el firmware","PC IP address outside the machine network range":"Direcci\u00f3n IP del PC fuera del rango de red de la m\u00e1quina","PLC OS, ESI file and Festo firmware versions do not match":"Las versiones del SO del PLC, del archivo ESI y del firmware Festo no coinciden","Annual maintenance":"Mantenimiento anual","Linear axes need lubrication":"Los ejes lineales necesitan lubricaci\u00f3n","Toothed belts need inspection":"Las correas dentadas necesitan inspecci\u00f3n","The dies can be hot. Wait until the die temperature is below 50 \u00b0C (122 \u00b0F) before touching them.":"Las matrices pueden estar calientes. Espere a que la temperatura de la matriz baje de 50 \u00b0C (122 \u00b0F) antes de tocarlas.","Disconnect the machine from power and from the compressed-air supply before any maintenance. Failure to do so can cause fatal injury.":"Desconecte la m\u00e1quina de la alimentaci\u00f3n el\u00e9ctrica y del aire comprimido antes de cualquier mantenimiento. No hacerlo puede causar lesiones mortales.","Work on electrical components may only be carried out by qualified personnel.":"Los trabajos en componentes el\u00e9ctricos solo puede realizarlos personal cualificado.","Switch the ionizer power supply OFF and confirm the fan has stopped before touching the emitters \u2014 energized emitters can cause electric shock, and the emitter tips are sharp.":"Apague la alimentaci\u00f3n del ionizador y confirme que el ventilador se ha detenido antes de tocar los emisores: los emisores energizados pueden causar descarga el\u00e9ctrica y sus puntas son afiladas.","Advanced settings should only be changed after the main recipe is finished \u2014 their standard values are calculated from the other settings. Tick \"Manual\" to overwrite a calculated value.":"Los ajustes avanzados solo deben cambiarse cuando la receta principal est\u00e9 terminada: sus valores est\u00e1ndar se calculan a partir de los dem\u00e1s ajustes. Marque \u00abManual\u00bb para sobrescribir un valor calculado.","After clearing an alarm, press \"Reset\" on the HMI. A new process can only be started after Reset.":"Despu\u00e9s de resolver una alarma, pulse \u00abReset\u00bb en el HMI. Solo despu\u00e9s del Reset puede iniciarse un nuevo proceso.","Do not bend the picking fingers too far \u2014 they can be damaged.":"No doble demasiado los dedos de toma: pueden da\u00f1arse.","Software and firmware changes on the PLC and Festo controllers must follow the BW-TEC upgrade notes (PLC OS, ESI file and Festo firmware versions must match). Do not attempt without BW-TEC guidance.":"Los cambios de software y firmware en el PLC y los controladores Festo deben seguir las notas de actualizaci\u00f3n de BW-TEC (las versiones del SO del PLC, del archivo ESI y del firmware Festo deben coincidir). No lo intente sin la gu\u00eda de BW-TEC.","Too much strain relieve compresses the tube and can bend it.":"Un alivio de tensi\u00f3n excesivo comprime el tubo y puede doblarlo.","Press \"Reset\" on the HMI. If that does not clear it, restart the machine at the main switch. If the error keeps appearing, contact support.":"Pulse \u00abReset\u00bb en el HMI. Si no se borra, reinicie la m\u00e1quina con el interruptor principal. Si el error sigue apareciendo, contacte con el soporte.","Make sure the gripper is not blocked, and that the gripper pressure in the recipe is set high enough to open and close it.":"Aseg\u00farese de que la pinza no est\u00e9 bloqueada y de que la presi\u00f3n de pinza de la receta sea suficiente para abrirla y cerrarla.","Make sure the cylinder is not blocked.":"Aseg\u00farese de que el cilindro no est\u00e9 bloqueado.","Push the axis by hand at least 50 mm to the right, then restart the machine to reset the axis reference points.":"Empuje el eje a mano al menos 50 mm hacia la derecha y reinicie la m\u00e1quina para restablecer los puntos de referencia del eje.","Push the axis by hand at least 50 mm to the left, then restart the machine to reset the axis reference points.":"Empuje el eje a mano al menos 50 mm hacia la izquierda y reinicie la m\u00e1quina para restablecer los puntos de referencia del eje.","Make sure the safety door is closed, then press \"Reset\" on the HMI. If that does not work, open the safety door and push the axis by hand at least 50 mm to the right.":"Aseg\u00farese de que la puerta de seguridad est\u00e9 cerrada y pulse \u00abReset\u00bb en el HMI. Si no funciona, abra la puerta de seguridad y empuje el eje a mano al menos 50 mm hacia la derecha.","Make sure the safety door is closed, then press \"Reset\" on the HMI. If that does not work, open the safety door and push the axis by hand at least 50 mm to the left.":"Aseg\u00farese de que la puerta de seguridad est\u00e9 cerrada y pulse \u00abReset\u00bb en el HMI. Si no funciona, abra la puerta de seguridad y empuje el eje a mano al menos 50 mm hacia la izquierda.","If the error keeps happening during the process, decrease one or more of these recipe parameters: Start tab \u2192 \"Start pos. right axis\"; Right necking tab \u2192 \"Stretching distance\"; Left necking tab \u2192 \"Offset right axis\".":"Si el error se repite durante el proceso, reduzca uno o varios de estos par\u00e1metros de receta: pesta\u00f1a Start \u2192 \u00abStart pos. right axis\u00bb; pesta\u00f1a Right necking \u2192 \u00abStretching distance\u00bb; pesta\u00f1a Left necking \u2192 \u00abOffset right axis\u00bb.","Check that the wires leading to the split dies are intact. If the error keeps appearing, contact support.":"Compruebe que los cables que van a las matrices partidas est\u00e9n intactos. Si el error sigue apareciendo, contacte con el soporte.","Clean the fork sensor that detects the edge of the slug.":"Limpie el sensor de horquilla que detecta el borde de la preforma.","Set the recipe parameter \"Tube detection sensitivity\" correctly: read the fork-sensor value on the HMI with the necked sleeve in the sensor, then with un-necked tube; the parameter is 70 % of the difference (e.g. (2000 \u2212 1000) \u00d7 0.7 = 700). Check that the value varies less than this when un-necked tube is pulled through the sensor.":"Ajuste correctamente el par\u00e1metro \u00abTube detection sensitivity\u00bb: lea el valor del sensor de horquilla en el HMI con la funda estrechada dentro del sensor y luego con tubo sin estrechar; el par\u00e1metro es el 70 % de la diferencia (p. ej. (2000 \u2212 1000) \u00d7 0,7 = 700). Compruebe que el valor var\u00eda menos que esta cifra al pasar tubo sin estrechar por el sensor.","Reduce \"Start pressure die\" and \"Process pressure ramp die\" so the dies close more gently. The practical minimum is about 0.3 bar start pressure and 0.1 bar/s pressure ramp.":"Reduzca \u00abStart pressure die\u00bb y \u00abProcess pressure ramp die\u00bb para que las matrices cierren con m\u00e1s suavidad. El m\u00ednimo pr\u00e1ctico es unos 0,3 bar de presi\u00f3n inicial y 0,1 bar/s de rampa de presi\u00f3n.","Increase the axis \"Acceleration\" so the tube is pulled through the die while the die \u2014 with the slow pressure ramp \u2014 is still closing. The material then slides into the die instead of being compressed purely by force.":"Aumente la \u00abAcceleration\u00bb del eje para que el tubo se tire a trav\u00e9s de la matriz mientras esta \u2014con la rampa de presi\u00f3n lenta\u2014 todav\u00eda se est\u00e1 cerrando. As\u00ed el material se desliza en la matriz en lugar de comprimirse solo por fuerza.","Reduce the axis \"Acceleration\" so the heat of the dies has time to transfer into the material before the tube is pulled.":"Reduzca la \u00abAcceleration\u00bb del eje para que el calor de las matrices tenga tiempo de transferirse al material antes de tirar del tubo.","Check that the tube is centred between the dies, not too high or too low. Compare the height of the left and right centering-gripper fingers by looking through the centering gripper from the side; misaligned fingers pin the tube against the top or bottom of the die.":"Compruebe que el tubo est\u00e9 centrado entre las matrices, ni demasiado alto ni demasiado bajo. Compare la altura de los dedos izquierdo y derecho de la pinza de centrado mirando a trav\u00e9s de ella desde el lateral; unos dedos desalineados pinzan el tubo contra la parte superior o inferior de la matriz.","Increase \"Temperature die\".":"Aumente \u00abTemperature die\u00bb.","Clean the dies. Clean them regularly.":"Limpie las matrices. L\u00edmpielas con regularidad.","Check that the die diameter is not too small for the tube (\"Diameter die\" must match the die actually installed \u2014 the diameter is engraved on BW-TEC dies, e.g. 260 = 2.6 mm).":"Compruebe que el di\u00e1metro de la matriz no sea demasiado peque\u00f1o para el tubo (\u00abDiameter die\u00bb debe coincidir con la matriz instalada; el di\u00e1metro est\u00e1 grabado en las matrices BW-TEC, p. ej. 260 = 2,6 mm).","Reduce the stretching \"Speed\".":"Reduzca la \u00abSpeed\u00bb (velocidad) de estirado.","For large-diameter tube (above about 4 mm) with a large reduction ratio, enable \"Activate prestretching\" on the Prestretching tab. Always try without prestretching first; enable it only if the tube keeps breaking when the dies close. For very thick-walled tube, \"Number of runs\" can be set above 1.":"Para tubo de gran di\u00e1metro (m\u00e1s de unos 4 mm) con una relaci\u00f3n de reducci\u00f3n alta, active \u00abActivate prestretching\u00bb en la pesta\u00f1a Prestretching. Pruebe siempre primero sin preestirado; act\u00edvelo solo si el tubo sigue rompi\u00e9ndose al cerrar las matrices. Para tubo de pared muy gruesa, \u00abNumber of runs\u00bb puede ajustarse por encima de 1.","On older machines with doors: block the white roll of the left roller gripper with a washer and set fPressureRollerGripperLeftForPretensioningTube to about 5 bar so the tube is under slight tension when the dies close. If the wheel is not blocked, this parameter must be 0 bar.":"En m\u00e1quinas antiguas con puertas: bloquee el rodillo blanco de la pinza de rodillo izquierda con una arandela y ajuste fPressureRollerGripperLeftForPretensioningTube a unos 5 bar para que el tubo est\u00e9 ligeramente tensado al cerrar las matrices. Si el rodillo no est\u00e1 bloqueado, este par\u00e1metro debe ser 0 bar.","Consider dies with angled contact surfaces (1610125) instead of parallel ones (1610068): they help small tubes centre in the middle so the tube is less likely to be clamped between the contact surfaces and break. Then set the advanced parameter \"Dies with angled contact surfaces\" to Yes.":"Considere matrices con superficies de contacto inclinadas (1610125) en lugar de paralelas (1610068): ayudan a que los tubos peque\u00f1os se centren, de modo que es menos probable que el tubo quede pinzado entre las superficies de contacto y se rompa. Ajuste entonces el par\u00e1metro avanzado \u00abDies with angled contact surfaces\u00bb a Yes.","Reduce \"Roller gripper pressure right\" (recommended below 1 bar) and \"Roller gripper pressure left\" so the roll does not indent the still-hot tube leaving the dies.":"Reduzca \u00abRoller gripper pressure right\u00bb (recomendado por debajo de 1 bar) y \u00abRoller gripper pressure left\u00bb para que el rodillo no marque el tubo a\u00fan caliente que sale de las matrices.","If the indentation persists at minimum pressure: in Advanced settings set \"Close right roller gripper before moving offset right axis\" to No. If that makes the tube handling unreliable, leave it at Yes and instead increase \"Delay closing roller gripper\".":"Si la marca persiste con la presi\u00f3n m\u00ednima: en Advanced settings ajuste \u00abClose right roller gripper before moving offset right axis\u00bb a No. Si con ello la manipulaci\u00f3n del tubo deja de ser fiable, d\u00e9jelo en Yes y aumente en su lugar \u00abDelay closing roller gripper\u00bb.","Increase \"Strain relieve\" (distance the necking axis moves back after stretching) so the tension is relieved before the dies open. Otherwise the slug is pulled through the dies while they open and the die edges leave marks on it.":"Aumente \u00abStrain relieve\u00bb (distancia que retrocede el eje de estrechado tras el estirado) para que la tensi\u00f3n se alivie antes de abrir las matrices. De lo contrario, la preforma es arrastrada por las matrices mientras se abren y los bordes dejan marcas.","If a diameter increase right before the slug is observed, set \"Delay before strain relieve\". Use the delay only if the issue has actually been observed.":"Si se observa un aumento de di\u00e1metro justo antes de la preforma, ajuste \u00abDelay before strain relieve\u00bb. Use el retardo solo si el problema se ha observado realmente.","Set the advanced parameter \"Dies with angled contact surfaces\" to Yes. After the right neck the fork-sensor axis then moves a few millimetres left while the dies open, and after the left neck the feed-out grippers move right after gripping, so the tube is pulled free without damaging the neck. (Requires \"Close right roller gripper before moving offset right axis\" = Yes and \"Delay closing roller gripper\" = 0.)":"Ajuste el par\u00e1metro avanzado \u00abDies with angled contact surfaces\u00bb a Yes. Tras el cuello derecho, el eje del sensor de horquilla se desplaza unos mil\u00edmetros a la izquierda mientras se abren las matrices, y tras el cuello izquierdo las pinzas de descarga se desplazan a la derecha despu\u00e9s de agarrar, de modo que el tubo se libera sin da\u00f1ar el cuello. (Requiere \u00abClose right roller gripper before moving offset right axis\u00bb = Yes y \u00abDelay closing roller gripper\u00bb = 0.)","Set the advanced parameter \"Axis synchronization during prestretching\" to Yes (recommended for tube diameter \u2264 2.5 mm) so the opposite axis moves with the necking axis and the tube is not pushed into a bend.":"Ajuste el par\u00e1metro avanzado \u00abAxis synchronization during prestretching\u00bb a Yes (recomendado para di\u00e1metro de tubo \u2264 2,5 mm) para que el eje opuesto se mueva con el eje de estrechado y el tubo no se doble.","Set \"Pre-tension distance before left neck\" (recommended 0.3 \u00d7 strain relieve right neck for tube \u2264 2 mm) together with \"Keep tube gripped with right axis when starting left neck\" = Yes, so the tube is straight and centred when the dies close for the left neck.":"Ajuste \u00abPre-tension distance before left neck\u00bb (recomendado 0,3 \u00d7 strain relieve del cuello derecho para tubo \u2264 2 mm) junto con \u00abKeep tube gripped with right axis when starting left neck\u00bb = Yes, para que el tubo est\u00e9 recto y centrado cuando las matrices cierren para el cuello izquierdo.","Increase \"Gripper pressure left and right\" (the centering grippers that pull the tube through the die).":"Aumente \u00abGripper pressure left and right\u00bb (las pinzas de centrado que tiran del tubo a trav\u00e9s de la matriz).","For tube diameter above 3 mm set the advanced parameter \"Offset right necking axis before gripping tube\" to about 10 mm so all teeth of the right centering gripper engage the material and it can hold a higher pulling force.":"Para di\u00e1metro de tubo superior a 3 mm, ajuste el par\u00e1metro avanzado \u00abOffset right necking axis before gripping tube\u00bb a unos 10 mm para que todos los dientes de la pinza de centrado derecha agarren el material y soporten una mayor fuerza de tracci\u00f3n.","The process stops when the recipe parameter \"Number of broken tubes until abort\" is exceeded. Several consecutive breaks point to a process problem \u2014 work through the problem \"Tube breaks during stretching\", then Reset and restart.":"El proceso se detiene cuando se supera el par\u00e1metro de receta \u00abNumber of broken tubes until abort\u00bb. Varias roturas consecutivas indican un problema de proceso: recorra el problema \u00abEl tubo se rompe durante el estirado\u00bb, luego Reset y reinicie.","No neck was detected before the left axis reached its limit. Make sure the required left stretching distance does not exceed the travel of the left necking axis (use a shorter tube, or reduce the sleeve length via \"Offset right axis\").":"No se detect\u00f3 ning\u00fan cuello antes de que el eje izquierdo alcanzara su l\u00edmite. Aseg\u00farese de que la distancia de estirado izquierda necesaria no supere el recorrido del eje de estrechado izquierdo (use un tubo m\u00e1s corto o reduzca la longitud de la funda mediante \u00abOffset right axis\u00bb).","Choose the picking fingers for the tube: 2711204-002 standard (1.5\u20137 mm); 2711205-002 thin fingers for small tube (up to about 3 mm) \u2014 they bend more easily so only one tube is picked; 2711204-001 short fingers for very large / thick-walled tube that keeps hanging. Laser-engraved -NA fingers have more friction and raise the risk of picking two tubes.":"Elija los dedos de toma seg\u00fan el tubo: 2711204-002 est\u00e1ndar (1,5\u20137 mm); 2711205-002 dedos finos para tubo peque\u00f1o (hasta unos 3 mm), que se flexionan m\u00e1s f\u00e1cilmente y as\u00ed solo toman un tubo; 2711204-001 dedos cortos para tubo muy grande / de pared gruesa que sigue qued\u00e1ndose colgado. Los dedos -NA grabados por l\u00e1ser tienen m\u00e1s fricci\u00f3n y aumentan el riesgo de tomar dos tubos.","Set \"Stroke grip\" so the picking fingers are slightly bent when gripping \u2014 a second tube then falls out of the bottom. If the tube deforms too much before the fingers bend, switch to the thinner 2711205-00x fingers.":"Ajuste \u00abStroke grip\u00bb de modo que los dedos de toma queden ligeramente flexionados al agarrar: un segundo tubo cae entonces por la parte inferior. Si el tubo se deforma demasiado antes de que los dedos se flexionen, cambie a los dedos m\u00e1s finos 2711205-00x.","Check \"Stroke open\" (opening of the picker gripper, as a percentage added to the tube diameter) and \"Diameter\" in the Picker parameters.":"Compruebe \u00abStroke open\u00bb (apertura de la pinza del separador, como porcentaje a\u00f1adido al di\u00e1metro del tubo) y \u00abDiameter\u00bb en los par\u00e1metros del separador.","Adjust \"Gripper sensor correction\": decrease it so the gripper dives deeper into the tube pile (tube sits higher between the fingers), increase it to dive less deep.":"Ajuste \u00abGripper sensor correction\u00bb: red\u00fazcalo para que la pinza se hunda m\u00e1s en la pila de tubos (el tubo queda m\u00e1s arriba entre los dedos), aum\u00e9ntelo para que se hunda menos.","If tubes stick together from static charge, set \"Use ionizer at picker\" to Yes (only when the feed-in ionizer is fitted) and keep \"Use ionizer for reorder\" on so an air blow re-centres the remaining tubes in the hopper after several empty picks.":"Si los tubos se pegan entre s\u00ed por carga est\u00e1tica, ajuste \u00abUse ionizer at picker\u00bb a Yes (solo si est\u00e1 instalado el ionizador de alimentaci\u00f3n) y mantenga activado \u00abUse ionizer for reorder\u00bb para que un soplo de aire vuelva a centrar los tubos restantes en la tolva tras varias tomas vac\u00edas.","Fill new raw tubes into the hopper.":"Cargue tubos nuevos en la tolva.","Press the emergency stop and check by hand that the picker gripper fingers open and close freely without jamming. The finger sheets can be misaligned so that screw heads catch on the sheet when the gripper closes; realign them.":"Pulse la parada de emergencia y compruebe a mano que los dedos de la pinza del separador abren y cierran libremente sin atascarse. Las chapas de los dedos pueden estar desalineadas de modo que las cabezas de los tornillos se enganchen en la chapa al cerrar la pinza; realin\u00e9elas.","Make sure nothing is in front of the left discharge monitoring sensor at the tube picker.":"Aseg\u00farese de que no haya nada delante del sensor izquierdo de control de descarga del separador.","Make sure nothing is in front of the right discharge monitoring sensor at the tube picker.":"Aseg\u00farese de que no haya nada delante del sensor derecho de control de descarga del separador.","The tube was lost during the process. Remove the tube from the machine, press Reset and continue the process.":"El tubo se perdi\u00f3 durante el proceso. Retire el tubo de la m\u00e1quina, pulse Reset y contin\u00fae el proceso.","Remove the tube or object sticking out of (or hanging into) the tube collector.":"Retire el tubo u objeto que sobresale del colector de tubos (o cuelga dentro de \u00e9l).","Close the tube collector.":"Cierre el colector de tubos.","Set \"Gripper pressure feed out\" to at least 1.5 bar so the feed-out grippers close correctly and in time.":"Ajuste \u00abGripper pressure feed out\u00bb a al menos 1,5 bar para que las pinzas de descarga cierren correctamente y a tiempo.","Release the emergency stop and press the blue illuminated reset button on top of the emergency-stop switch.":"Desenclave la parada de emergencia y pulse el bot\u00f3n de reset azul iluminado situado encima del interruptor de parada de emergencia.","Close the safety door and reload the recipe.":"Cierre la puerta de seguridad y vuelva a cargar la receta.","Close the safety door.":"Cierre la puerta de seguridad.","Press \"Reset\" on the HMI.":"Pulse \u00abReset\u00bb en el HMI.","Check the main pressure switch.":"Compruebe el presostato principal.","Check the compressed-air supply (6\u20138 bar / 87\u2013116 psi). Cylinders need at least 1 bar to work.":"Compruebe el suministro de aire comprimido (6\u20138 bar / 87\u2013116 psi). Los cilindros necesitan al menos 1 bar para funcionar.","A tube was detected while the process is in simulation mode. Remove the tube, or take the machine out of simulation.":"Se detect\u00f3 un tubo mientras el proceso est\u00e1 en modo simulaci\u00f3n. Retire el tubo o saque la m\u00e1quina del modo simulaci\u00f3n.","Check that the Ethernet connectors at the motor controllers and at the PLC are fully plugged in.":"Compruebe que los conectores Ethernet de los controladores de motor y del PLC est\u00e9n totalmente enchufados.","Make sure the IO-Link master is connected to the PLC via Ethernet, and that the connector of the electrical gripper at the picker is still connected.":"Aseg\u00farese de que el maestro IO-Link est\u00e9 conectado al PLC por Ethernet y de que el conector de la pinza el\u00e9ctrica del separador siga conectado.","Critical error: can only be resolved by a technician. Contact support.":"Error cr\u00edtico: solo puede resolverlo un t\u00e9cnico. Contacte con el soporte.","Push the right necking axis by hand at least 50 mm to the right, then restart the machine to reset the axis reference points.":"Empuje el eje de estrechado derecho a mano al menos 50 mm hacia la derecha y reinicie la m\u00e1quina para restablecer los puntos de referencia del eje.","If this recurs when the axes return to the start position: the fork-sensor cylinder's retract signal may be arriving late because the cylinder has mechanical resistance over its last millimetres and briefly sticks. Have the cylinder checked and freed.":"Si se repite cuando los ejes vuelven a la posici\u00f3n inicial: la se\u00f1al de retracci\u00f3n del cilindro del sensor de horquilla puede llegar tarde porque el cilindro tiene resistencia mec\u00e1nica en sus \u00faltimos mil\u00edmetros y se atasca brevemente. Haga revisar y liberar el cilindro.","Wait until the split die has reached the set temperature.":"Espere a que la matriz partida alcance la temperatura ajustada.","Make sure the feed-out ionizer (the one with the fan) is powered on (toggle switch on the ionizer) and that all parts of the fan are correctly mounted and snapped in place.":"Aseg\u00farese de que el ionizador de descarga (el del ventilador) est\u00e9 encendido (interruptor basculante en el ionizador) y de que todas las piezas del ventilador est\u00e9n correctamente montadas y encajadas.","Clean the ionizer emitters: switch the power supply off and confirm the fan has stopped; press part A of the emitter cartridge and pull the cartridge out towards the air-blow side; clean the eight emitters with a cotton swab soaked in reagent ethanol (\u2265 99.5 %); refit the cartridge so its terminals contact the body terminals, with no foreign matter on the connector.":"Limpie los emisores del ionizador: apague la alimentaci\u00f3n y confirme que el ventilador se ha detenido; presione la parte A del cartucho de emisores y extr\u00e1igalo hacia el lado del soplado de aire; limpie los ocho emisores con un bastoncillo de algod\u00f3n empapado en etanol reactivo (\u2265 99,5 %); vuelva a colocar el cartucho de modo que sus terminales contacten con los del cuerpo, sin materias extra\u00f1as en el conector.","Check that the PC is running.":"Compruebe que el PC est\u00e9 en marcha.","Check the touchscreen cables and plugs, and the touchscreen's control light.":"Compruebe los cables y conectores de la pantalla t\u00e1ctil y su luz de control.","Check the fuse.":"Compruebe el fusible.","Make sure the control valves are adjusted according to your work instruction.":"Aseg\u00farese de que las v\u00e1lvulas de control est\u00e9n ajustadas seg\u00fan su instrucci\u00f3n de trabajo.","Check whether the motor controllers display an error.":"Compruebe si los controladores de motor muestran alg\u00fan error.","Check the fuses for the stepper motor.":"Compruebe los fusibles del motor paso a paso.","Check whether the axis is standing on a limit switch.":"Compruebe si el eje est\u00e1 sobre un final de carrera.","Check the fuse and the temperature controller.":"Compruebe el fusible y el controlador de temperatura.","Check the release relay for the heating process.":"Compruebe el rel\u00e9 de habilitaci\u00f3n del proceso de calentamiento.","Check the input and output of the solid-state relay.":"Compruebe la entrada y la salida del rel\u00e9 de estado s\u00f3lido.","Check the function of the heat cartridges.":"Compruebe el funcionamiento de los cartuchos calefactores.","The temperature sensor is probably disconnected or short-circuited. Check its wiring and connector.":"El sensor de temperatura probablemente est\u00e1 desconectado o en cortocircuito. Compruebe su cableado y conector.","Press the emergency stop, reset the alarm, and try to start the process again.":"Pulse la parada de emergencia, reconozca la alarma e intente iniciar el proceso de nuevo.","Restart the machine by switching the main switch off and on.":"Reinicie la m\u00e1quina apagando y encendiendo el interruptor principal.","In the Festo Automation Suite check the parameter \"Maximum Torque Symmetrical\" (P1.526796) on the affected axis \u2014 this value has been observed to drop by itself. Restore it to the correct value.":"En Festo Automation Suite compruebe el par\u00e1metro \u00abMaximum Torque Symmetrical\u00bb (P1.526796) en el eje afectado: se ha observado que este valor baja por s\u00ed solo. Restablezca el valor correcto.","Make sure the PC's IP address is set correctly in the machine's range (192.168.1.xxx); the Festo controllers are visible on the network but no connection can be established otherwise.":"Aseg\u00farese de que la direcci\u00f3n IP del PC est\u00e9 configurada correctamente dentro del rango de la m\u00e1quina (192.168.1.xxx); de lo contrario los controladores Festo son visibles en la red pero no se puede establecer conexi\u00f3n.","Check that the PLC OS is at least V1.17 and the Festo controller firmware matches the ESI file (working combination: ESI Festo-CMMT-AS-MP-S1-CiA402-20240702 with firmware 35.9.2.5078). After loading new software or a new ESI file, run \"compare and download\" in JetSym.":"Compruebe que el SO del PLC sea al menos V1.17 y que el firmware de los controladores Festo coincida con el archivo ESI (combinaci\u00f3n v\u00e1lida: ESI Festo-CMMT-AS-MP-S1-CiA402-20240702 con firmware 35.9.2.5078). Tras cargar software nuevo o un archivo ESI nuevo, ejecute \u00abcomparar y descargar\u00bb en JetSym.","Update the necker PLC software to V2.9.0.0 or later, where the fork-sensor-axis torque reduction that caused tracking errors was removed. Follow the BW-TEC upgrade notes.":"Actualice el software del PLC del estrechador a V2.9.0.0 o posterior, donde se elimin\u00f3 la reducci\u00f3n de par del eje del sensor de horquilla que causaba errores de seguimiento. Siga las notas de actualizaci\u00f3n de BW-TEC.","Have the toothed belts checked (annual inspection) and replaced if necessary. Contact a BW-TEC technician.":"Haga revisar las correas dentadas (inspecci\u00f3n anual) y sustituirlas si es necesario. Contacte con un t\u00e9cnico de BW-TEC.","Lubricate the three linear axes (right necking, left necking, fork sensor) once a year with an FDA/USDA-H1 grease: remove the axis cover strip to reach the ball-screw spindle.":"Lubrique los tres ejes lineales (estrechado derecho, estrechado izquierdo, sensor de horquilla) una vez al a\u00f1o con una grasa FDA/USDA-H1: retire la tira de cubierta del eje para acceder al husillo de bolas.","Use \"Slug length correction\" to compensate a consistent difference between the measured slug length and the \"Slug length\" parameter. For slugs shorter than the 17 mm minimum, use \"Delay stop left axis\" on the Left necking tab.":"Use \u00abSlug length correction\u00bb para compensar una diferencia constante entre la longitud de preforma medida y el par\u00e1metro \u00abSlug length\u00bb. Para preformas m\u00e1s cortas que el m\u00ednimo de 17 mm, use \u00abDelay stop left axis\u00bb en la pesta\u00f1a Left necking.","Machine areas":"Zonas de la m\u00e1quina","Tube picker (separator)":"Separador de tubos (picker)","Picks single raw tubes out of the hopper with an electrical gripper and sheet-metal picking fingers; discharge monitoring sensors check that only one tube leaves.":"Toma tubos individuales de la tolva con una pinza el\u00e9ctrica y dedos de toma de chapa; los sensores de control de descarga comprueban que salga solo un tubo.","Feed in":"Alimentaci\u00f3n","Horizontal and vertical axes plus a roller gripper that bring the tube into the necking station.":"Ejes
