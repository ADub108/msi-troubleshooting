horizontal y vertical m\u00e1s una pinza de rodillo que llevan el tubo a la estaci\u00f3n de estrechado.","Necker":"Estaci\u00f3n de estrechado","Heated split dies, left and right necking axes with centering and roller grippers, and the fork-sensor axis that defines the slug length.":"Matrices partidas calefactadas, ejes de estrechado izquierdo y derecho con pinzas de centrado y de rodillo, y el eje del sensor de horquilla que define la longitud de la preforma.","Feed out":"Descarga","Two pneumatic grippers that place the necked tube into the tube collector; an ionizer with fan reduces static cling.":"Dos pinzas neum\u00e1ticas que depositan el tubo estrechado en el colector; un ionizador con ventilador reduce la adherencia est\u00e1tica.","Process terms":"T\u00e9rminos del proceso","Neck / necking":"Cuello / estrechado","Pulling the heated tube through a split die smaller than the tube to reduce its diameter. Both ends are necked to the same diameter.":"Tirar del tubo caliente a trav\u00e9s de una matriz partida m\u00e1s peque\u00f1a que el tubo para reducir su di\u00e1metro. Ambos extremos se estrechan al mismo di\u00e1metro.","Slug (parison)":"Preforma (tramo sin estrechar)","The un-necked section left in the middle of the tube. Its length is set by the distance between the die and the fork sensor (\"Slug length\", minimum 17 mm).":"El tramo sin estrechar que queda en el centro del tubo. Su longitud la define la distancia entre la matriz y el sensor de horquilla (\u00abSlug length\u00bb, m\u00ednimo 17 mm).","Sleeve":"Funda","The necked section on either side of the slug. Right sleeve length = \"Stretching distance\"; left sleeve length is controlled by \"Offset right axis\".":"El tramo estrechado a cada lado de la preforma. Longitud de la funda derecha = \u00abStretching distance\u00bb; la longitud de la funda izquierda se controla con \u00abOffset right axis\u00bb.","Prestretching":"Preestirado","An optional pre-pull for large-diameter tube with a large reduction ratio, used only if the tube keeps breaking when the dies close.":"Un pretirado opcional para tubo de gran di\u00e1metro con relaci\u00f3n de reducci\u00f3n alta, usado solo si el tubo sigue rompi\u00e9ndose al cerrar las matrices.","Strain relieve":"Alivio de tensi\u00f3n","The distance the necking axis moves back after stretching to release tension before the dies open.":"La distancia que retrocede el eje de estrechado tras el estirado para liberar la tensi\u00f3n antes de que se abran las matrices.","Key recipe parameters":"Par\u00e1metros clave de la receta","Start pressure die / Process pressure die / Process pressure ramp die":"Start pressure die / Process pressure die / Process pressure ramp die","The die closes at the start pressure (the tube moulds into the die as stretching starts), then ramps to the process pressure at the ramp rate.":"La matriz cierra a la presi\u00f3n inicial (el tubo se amolda a la matriz al iniciarse el estirado) y luego sube a la presi\u00f3n de proceso seg\u00fan la rampa.","Speed / Acceleration":"Velocidad / Aceleraci\u00f3n","Pulling speed through the die and how quickly it is reached.":"Velocidad de tracci\u00f3n a trav\u00e9s de la matriz y rapidez con que se alcanza.","Tube detection sensitivity":"Tube detection sensitivity (sensibilidad de detecci\u00f3n del tubo)","Fork-sensor threshold that stops the left axis when the slug edge is detected \u2014 70 % of the difference between the sleeve and un-necked tube readings.":"Umbral del sensor de horquilla que detiene el eje izquierdo al detectar el borde de la preforma: el 70 % de la diferencia entre las lecturas de la funda y del tubo sin estrechar.","Number of broken tubes until abort":"Number of broken tubes until abort (n\u00famero de tubos rotos hasta abortar)","How many consecutive broken tubes are tolerated before the automatic process stops.":"Cu\u00e1ntos tubos rotos consecutivos se toleran antes de que se detenga el proceso autom\u00e1tico.","Limits":"L\u00edmites","Machine limits":"L\u00edmites de la m\u00e1quina","Raw tube 0.7\u20137 mm; neck-down 0.4\u20135.2 mm; travel 450 mm (L) / 730 mm (R); speed 0\u2013400 mm/s; process temperature 20\u2013200 \u00b0C; air 6\u20138 bar.":"Tubo bruto 0,7\u20137 mm; estrechado a 0,4\u20135,2 mm; recorrido 450 mm (izq.) / 730 mm (der.); velocidad 0\u2013400 mm/s; temperatura de proceso 20\u2013200 \u00b0C; aire 6\u20138 bar."},"es-419":{"Machine line":"L\u00ednea de m\u00e1quina","View":"Vista","Guided fix":"Soluci\u00f3n guiada","Full matrix":"Matriz completa","Mode":"Modo","Operator":"Operador","MSI internal":"MSI interno","Language":"Idioma","Start over":"Empezar de nuevo","Cause":"Causa","Adjustment":"Ajuste","potential causes, most likely first":"causas posibles, la m\u00e1s probable primero","adjustments, in the order to try them":"ajustes, en el orden en que deben probarse","Check and adjust":"Revisar y ajustar","What to do and why":"Qu\u00e9 hacer y por qu\u00e9","Caution":"Precauci\u00f3n","Yes, fixed":"S\u00ed, resuelto","No, next cause":"No, siguiente causa","No, next adjustment":"No, siguiente ajuste","Not applicable, skip":"No aplica, omitir","Back":"Atr\u00e1s","Did MSI Service resolve it, or do you want to move on?":"\u00bfLo resolvi\u00f3 el Servicio de MSI o desea continuar?","item.":"\u2014 tarea de servicio.","Resolved":"Resuelto","Resolved \u2014 cause:":"Resuelto \u2014 causa:","If the problem returns, start here first.":"Si el problema vuelve a aparecer, empiece por aqu\u00ed.","Not resolved":"No resuelto","All listed causes tried without resolving the problem":"Se han probado todas las causas indicadas sin resolver el problema","Support summary (copy and send)":"Resumen para el soporte (copiar y enviar)","Copy summary":"Copiar resumen","Copied":"Copiado","Troubleshoot this problem again":"Repetir la soluci\u00f3n de este problema","Choose another problem":"Elegir otro problema","Change":"Cambiar","Problem":"Problema","Potential cause":"Causa posible","Remedy":"Soluci\u00f3n","Cautions":"Precauciones","Run guided fix for this problem":"Iniciar la soluci\u00f3n guiada de este problema","problem descriptions":"descripciones de problemas","cause/remedy pairs":"pares causa/soluci\u00f3n","Code glossary":"Glosario de c\u00f3digos","internal":"interno","Diagnostic codes":"C\u00f3digos de diagn\u00f3stico","Caution codes":"C\u00f3digos de precauci\u00f3n","reference":"referencia","Source:":"Fuente:","If the guided steps don't resolve the problem, contact":"Si los pasos guiados no resuelven el problema, contacte a","with the summary the tool prepares for you.":"con el resumen que la herramienta prepara para usted.","Internal mode shows source code references and service-level repair steps.":"El modo interno muestra las referencias de c\u00f3digos de la fuente y los pasos de reparaci\u00f3n de nivel de servicio.","fixed":"resuelto","no change":"sin cambios","skipped":"omitido","MSI internal note":"Nota interna de MSI","service":"servicio","support summary":"resumen para el soporte","Machine line:":"L\u00ednea de m\u00e1quina:","Problem:":"Problema:","Date:":"Fecha:","Steps worked through:":"Pasos realizados:","FIXED":"RESUELTO","tried, not fixed":"probado, no resuelto","skipped / not applicable":"omitido / no aplica","Install this troubleshooter":"Instalar esta gu\u00eda de soluci\u00f3n de problemas","Works offline on the shop floor.":"Funciona sin conexi\u00f3n en la planta.","Tap the Share button, then \"Add to Home Screen\".":"Toque el bot\u00f3n Compartir y luego \u00abAgregar a pantalla de inicio\u00bb.","Install":"Instalar","Tip types, tooling, parameters and materials":"Tipos de punta, herramental, par\u00e1metros y materiales","glossary":"glosario","Change problem":"Cambiar de problema","BW-TEC 2711 Troubleshooter":"Gu\u00eda de soluci\u00f3n de problemas BW-TEC 2711","What is the machine doing?":"\u00bfQu\u00e9 est\u00e1 haciendo la m\u00e1quina?","Pick the symptom, or the alarm or warning as worded on the HMI.":"Elija el s\u00edntoma, o la alarma o advertencia tal como aparece en el HMI.","guided fix":"soluci\u00f3n guiada","Resolve a 2711 automatic necker problem one likely cause at a time":"Resuelva un problema del estrechador autom\u00e1tico 2711 una causa probable a la vez","Choose the symptom or HMI message. The tool walks you through the potential causes in order, with the checks and recipe adjustments for each. Causes that need a technician are marked for support.":"Elija el s\u00edntoma o el mensaje del HMI. La herramienta lo gu\u00eda por las causas posibles en orden, con las revisiones y los ajustes de receta de cada una. Las causas que requieren un t\u00e9cnico est\u00e1n marcadas para el soporte.","After clearing any alarm, press \"Reset\" on the HMI before starting a new process.":"Despu\u00e9s de resolver cualquier alarma, presione \u00abReset\u00bb en el HMI antes de iniciar un nuevo proceso.","Note the recipe values (die temperature, start / process pressure, ramp, speed, acceleration) before changing anything, and change one parameter at a time.":"Anote los valores de la receta (temperatura de matriz, presi\u00f3n inicial / de proceso, rampa, velocidad, aceleraci\u00f3n) antes de cambiar nada, y cambie un par\u00e1metro cada vez.","If nothing in the list resolves it, the tool prepares a summary you can send to support.":"Si nada de la lista lo resuelve, la herramienta prepara un resumen que puede enviar al soporte.","Run the process again. Did this resolve the problem?":"Ejecute el proceso de nuevo. \u00bfSe resolvi\u00f3 el problema?","Please add: machine serial number, PLC / HMI software version, recipe name, tube material and diameter, die diameter, and a photo of the HMI if an alarm is shown.":"Agregue: n\u00famero de serie de la m\u00e1quina, versi\u00f3n de software del PLC / HMI, nombre de la receta, material y di\u00e1metro del tubo, di\u00e1metro de la matriz y una foto del HMI si se muestra una alarma.","BW-TEC Support":"Soporte de BW-TEC","Send the summary below to BW-TEC Support so they can pick up where you left off.":"Env\u00ede el resumen siguiente al Soporte de BW-TEC para que puedan continuar desde donde usted lo dej\u00f3.","Save the recipe values that produced good parts so the next set-up starts from a known-good state.":"Guarde los valores de receta que produjeron piezas buenas para que la pr\u00f3xima configuraci\u00f3n parta de un estado conocido y v\u00e1lido.","This step is carried out by a BW-TEC technician or qualified maintenance personnel. Contact {contact} and mention this cause.":"Este paso lo realiza un t\u00e9cnico de BW-TEC o personal de mantenimiento calificado. Contacte a {contact} e indique esta causa.","2711 troubleshooting matrix":"Matriz de soluci\u00f3n de problemas del 2711","Process & product quality":"Proceso y calidad del producto","Tube handling":"Manipulaci\u00f3n del tubo","Alarms on the HMI":"Alarmas en el HMI","Warnings on the HMI":"Advertencias en el HMI","Machine & electrical":"M\u00e1quina y sistema el\u00e9ctrico","User Manual Automatic Necking Machine Type 2711 (2711-01-02-03 E) and 2711 Support Notes Version A (12.02.2026)":"Manual de usuario de la m\u00e1quina de estrechado autom\u00e1tico tipo 2711 (2711-01-02-03 E) y notas de soporte 2711 versi\u00f3n A (12.02.2026)","Tube breaks during stretching (necking)":"El tubo se rompe durante el estirado (estrechado)","The machine detects the break, ejects the tube and continues. Several breaks in a row stop the process (\"Multiple failed tube neckings\"). Work through the causes in order \u2014 the first three are the usual ones.":"La m\u00e1quina detecta la rotura, expulsa el tubo y contin\u00faa. Varias roturas seguidas detienen el proceso (\u00abMultiple failed tube neckings\u00bb). Recorra las causas en orden: las tres primeras son las habituales.","Dies close too hard, too early":"Las matrices cierran con demasiada fuerza y demasiado pronto","Axis acceleration too low \u2014 tube is compressed instead of sliding into the die":"Aceleraci\u00f3n del eje demasiado baja: el tubo se comprime en lugar de deslizarse en la matriz","Axis acceleration too high \u2014 no time for die heat to transfer into the material":"Aceleraci\u00f3n del eje demasiado alta: el calor de la matriz no tiene tiempo de transferirse al material","Tube not centred between the dies (too high or too low) and jammed":"El tubo no est\u00e1 centrado entre las matrices (demasiado alto o bajo) y queda atascado","Die temperature too low":"Temperatura de la matriz demasiado baja","Dies dirty":"Matrices sucias","Die diameter too small for the tube":"Di\u00e1metro de la matriz demasiado peque\u00f1o para el tubo","Stretching speed too high":"Velocidad de estirado demasiado alta","Large-diameter tube with a large reduction ratio breaking as the dies close":"Tubo de gran di\u00e1metro con una relaci\u00f3n de reducci\u00f3n alta se rompe al cerrar las matrices","Small tube breaking as the dies close (older machines with doors)":"Tubo peque\u00f1o se rompe al cerrar las matrices (m\u00e1quinas antiguas con puertas)","Small tube clamped between the die contact surfaces":"Tubo peque\u00f1o queda pinzado entre las superficies de contacto de la matriz","Slug (parison) length is irregular":"La longitud del tramo sin estrechar (preforma) es irregular","\"Tube detection sensitivity\" not set correctly":"\u00abTube detection sensitivity\u00bb (sensibilidad de detecci\u00f3n del tubo) mal ajustada","Fork sensor that detects the edge of the slug is dirty":"El sensor de horquilla que detecta el borde de la preforma est\u00e1 sucio","Measured length differs consistently from the set value":"La longitud medida difiere sistem\u00e1ticamente del valor ajustado","Machine reports a broken tube although the tube did not break":"La m\u00e1quina indica tubo roto aunque el tubo no se rompi\u00f3","Fork sensor dirty":"Sensor de horquilla sucio","Indentation in the tube from the roller gripper":"Marca (hendidura) en el tubo por la pinza de rodillo","The right roller gripper closes on the freshly necked, still-hot tube and can leave a mark.":"La pinza de rodillo derecha se cierra sobre el tubo reci\u00e9n estrechado y todav\u00eda caliente, y puede dejar una marca.","Roller gripper pressure too high on the still-hot tube leaving the dies":"Presi\u00f3n de la pinza de rodillo demasiado alta sobre el tubo a\u00fan caliente que sale de las matrices","Indentation persists at minimum pressure":"La marca persiste con la presi\u00f3n m\u00ednima","Marks from the split-die edges on the slug":"Marcas de los bordes de la matriz partida en la preforma","Tube still under tension when the dies open \u2014 strain not relieved":"El tubo sigue en tensi\u00f3n cuando se abren las matrices: no se ha aliviado la tensi\u00f3n","Diameter increase right before the slug":"Aumento de di\u00e1metro justo antes de la preforma","Necked tube stuck in one die half after the dies open \u2014 neck damaged when pulled free":"El tubo estrechado queda pegado en una mitad de la matriz al abrirse: el cuello se da\u00f1a al liberarlo","Dies with angled contact surfaces act as a funnel":"Las matrices con superficies de contacto inclinadas act\u00faan como un embudo","Tube bends during prestretching":"El tubo se dobla durante el preestirado","Small, flexible tube pushed against the stationary opposite axis":"Tubo peque\u00f1o y flexible empujado contra el eje opuesto inm\u00f3vil","Tube sags or is off-centre when the dies close for the left neck":"El tubo cuelga o est\u00e1 descentrado cuando las matrices cierran para el cuello izquierdo","Small tube bending under its own weight":"Tubo peque\u00f1o que se dobla por su propio peso","Tube slips out of the centering gripper while stretching":"El tubo se escapa de la pinza de centrado durante el estirado","Centering-gripper pressure too low":"Presi\u00f3n de la pinza de centrado demasiado baja","Large-diameter tube \u2014 not all gripper teeth engaged":"Tubo de gran di\u00e1metro: no todos los dientes de la pinza agarran","Tube is always pinched at the top or bottom of the die":"El tubo siempre queda pinzado en la parte superior o inferior de la matriz","Centering-gripper fingers not at the same height (parallel gripper misaligned)":"Los dedos de la pinza de centrado no est\u00e1n a la misma altura (pinza paralela desalineada)","Picker picks two tubes at once":"El separador toma dos tubos a la vez","\"Stroke grip\" not bending the picking fingers slightly":"\u00abStroke grip\u00bb (carrera de agarre) no flexiona ligeramente los dedos de toma","Picking fingers unsuitable for the tube diameter (e.g. high-friction -NA fingers on small tube)":"Dedos de toma inadecuados para el di\u00e1metro del tubo (p. ej. dedos -NA de alta fricci\u00f3n con tubo peque\u00f1o)","Tubes stick together from static charge":"Los tubos se pegan entre s\u00ed por carga est\u00e1tica","Picker picks no tube (empty picks) or tubes hang from the fingers":"El separador no toma ning\u00fan tubo (tomas vac\u00edas) o los tubos cuelgan de los dedos","Gripper diving depth wrong":"Profundidad de inmersi\u00f3n de la pinza incorrecta","Picking fingers unsuitable for the tube (hanging tubes on large / thick-walled tube)":"Dedos de toma inadecuados para el tubo (tubos colgando con tubo grande / de pared gruesa)","Opening stroke or tube diameter wrong in the Picker parameters":"Carrera de apertura o di\u00e1metro del tubo incorrectos en los par\u00e1metros del separador","Remaining tubes not in the centre of the hopper":"Los tubos restantes no est\u00e1n en el centro de la tolva","Picker gripper does not close fully or behaves oddly":"La pinza del separador no cierra del todo o se comporta de forma extra\u00f1a","Warning \"Tube lack detected\"":"Advertencia \u00abTube lack detected\u00bb","Hopper empty":"Tolva vac\u00eda","Alarm \"Discharge monitoring sensor left/right at Tube Picker blocked\"":"Alarma \u00abDischarge monitoring sensor left/right at Tube Picker blocked\u00bb","Something in front of the left sensor":"Hay algo delante del sensor izquierdo","Something in front of the right sensor":"Hay algo delante del sensor derecho","Alarm \"Tube at feed out not detected\"":"Alarma \u00abTube at feed out not detected\u00bb","Tube lost during the process":"Tubo perdido durante el proceso","Feed-out grippers not closing correctly":"Las pinzas de descarga no cierran correctamente","Alarm \"Light barrier at tube collector blocked\"":"Alarma \u00abLight barrier at tube collector blocked\u00bb","Tube or object sticking out of or hanging into the collector":"Tubo u objeto que sobresale del colector o cuelga dentro de \u00e9l","Warning \"Tube collector is not closed\"":"Advertencia \u00abTube collector is not closed\u00bb","Collector open":"Colector abierto","Alarm \"Emergency Stop pressed\"":"Alarma \u00abEmergency Stop pressed\u00bb","Emergency stop is latched":"Parada de emergencia enclavada","Alarm \"Safety door opened during process\"":"Alarma \u00abSafety door opened during process\u00bb","Door opened while running":"Puerta abierta durante el funcionamiento","Alarm \"Immediate stop triggered\"":"Alarma \u00abImmediate stop triggered\u00bb","Immediate stop":"Parada inmediata","Alarm \"No air pressure connected\"":"Alarma \u00abNo air pressure connected\u00bb","Main pressure switch":"Presostato principal","Compressed-air supply":"Suministro de aire comprimido","Alarm \"Tube detected despite process simulation\"":"Alarma \u00abTube detected despite process simulation\u00bb","Tube present in simulation mode":"Hay un tubo presente en modo simulaci\u00f3n","Alarm \"EtherCat disconnected\"":"Alarma \u00abEtherCat disconnected\u00bb","Ethernet connector loose at a motor controller or the PLC":"Conector Ethernet suelto en un controlador de motor o en el PLC","Alarm \"Error controller \u2026 axis\" / \"Error program \u2026 axis\" (picker, necking, feed in, feed out, sensor axis)":"Alarma \u00abError controller \u2026 axis\u00bb / \u00abError program \u2026 axis\u00bb (separador, estrechado, alimentaci\u00f3n, descarga, eje del sensor)","Drive or program fault on the axis":"Falla de accionamiento o de programa en el eje","\"Axis fork sensor\" error keeps returning with a tracking error in JetSym (older PLC software)":"El error \u00abAxis fork sensor\u00bb reaparece con un error de seguimiento en JetSym (software de PLC antiguo)","Festo axes suddenly have less force than they should":"Los ejes Festo tienen de repente menos fuerza de la debida","Alarm \"Error IO-Link connection picker gripper\"":"Alarma \u00abError IO-Link connection picker gripper\u00bb","IO-Link master or gripper connector disconnected":"Maestro IO-Link o conector de la pinza desconectado","Alarm \"Temperature controller error\"":"Alarma \u00abTemperature controller error\u00bb","Critical temperature-controller fault":"Falla cr\u00edtica del controlador de temperatura","Alarm \"Hardware limit \u2026 reached\" (necking axis left/right, sensor axis)":"Alarma \u00abHardware limit \u2026 reached\u00bb (eje de estrechado izquierdo/derecho, eje del sensor)","Left hardware limit of the left necking axis reached":"L\u00edmite f\u00edsico izquierdo del eje de estrechado izquierdo alcanzado","Right hardware limit of the right necking axis reached":"L\u00edmite f\u00edsico derecho del eje de estrechado derecho alcanzado","Right hardware limit of the sensor axis reached":"L\u00edmite f\u00edsico derecho del eje del sensor alcanzado","Alarm \"Software limit \u2026 reached\" (necking axis left/right, fork sensor axis)":"Alarma \u00abSoftware limit \u2026 reached\u00bb (eje de estrechado izquierdo/derecho, eje del sensor de horquilla)","Left software limit reached (left necking axis, right necking axis, or fork sensor axis)":"L\u00edmite de software izquierdo alcanzado (eje de estrechado izquierdo, derecho o eje del sensor de horquilla)","Right software limit reached (left necking axis, right necking axis, or fork sensor axis)":"L\u00edmite de software derecho alcanzado (eje de estrechado izquierdo, derecho o eje del sensor de horquilla)","Right software limit of the right necking axis keeps recurring during the process":"El l\u00edmite de software derecho del eje de estrechado derecho se repite durante el proceso","Alarm \"Avoid collision between necking axis right and necking axis sensor\"":"Alarma \u00abAvoid collision between necking axis right and necking axis sensor\u00bb","Right necking axis too close to the sensor axis":"Eje de estrechado derecho demasiado cerca del eje del sensor","Recurs when the axes return to the start position":"Se repite cuando los ejes vuelven a la posici\u00f3n inicial","Alarm \"Error signal \u2026 gripper\" (die grippers, centering grippers, roller grippers, feed-out grippers)":"Alarma \u00abError signal \u2026 gripper\u00bb (pinzas de matriz, de centrado, de rodillo, de descarga)","Gripper blocked, or recipe gripper pressure too low":"Pinza bloqueada, o presi\u00f3n de pinza de la receta demasiado baja","\"Error signal feed in centering gripper\"":"\u00abError signal feed in centering gripper\u00bb","Alarm \"Error signal \u2026 cylinder\" (necking cylinder diameter sensor, feed-in cylinder)":"Alarma \u00abError signal \u2026 cylinder\u00bb (cilindro del sensor de di\u00e1metro, cilindro de alimentaci\u00f3n)","Cylinder blocked":"Cilindro bloqueado","Alarm \"Error temperature Die front/back out of range\"":"Alarma \u00abError temperature Die front/back out of range\u00bb","Wires to the split dies damaged":"Cables a las matrices partidas da\u00f1ados","Warning \"Temperature controller not ready\"":"Advertencia \u00abTemperature controller not ready\u00bb","Split die has not reached the set temperature yet":"La matriz partida a\u00fan no ha alcanzado la temperatura ajustada","Warning \"Necking limit left reached\"":"Advertencia \u00abNecking limit left reached\u00bb","Required left stretching distance exceeds the axis travel":"La distancia de estirado izquierda necesaria supera el recorrido del eje","Warning \"Multiple failed tube neckings\" / \"Right necking failed\" / \"Left necking failed\"":"Advertencia \u00abMultiple failed tube neckings\u00bb / \u00abRight necking failed\u00bb / \u00abLeft necking failed\u00bb","Several tubes broke consecutively":"Varios tubos se rompieron consecutivamente","Warning \"Safety door is open\"":"Advertencia \u00abSafety door is open\u00bb","Door open":"Puerta abierta","Warning \"Error ionizer feed out\"":"Advertencia \u00abError ionizer feed out\u00bb","Ionizer switched off or fan parts not snapped in":"Ionizador apagado o piezas del ventilador no encajadas","Warning \"Maintenance required on ionizer at feed out\"":"Advertencia \u00abMaintenance required on ionizer at feed out\u00bb","Emitters need cleaning":"Los emisores necesitan limpieza","No picture on the touchscreen":"No hay imagen en la pantalla t\u00e1ctil","PC not running":"La PC no est\u00e1 encendida","Touchscreen cables / plugs / control light":"Cables / conectores / luz de control de la pantalla t\u00e1ctil","Fuse":"Fusible","Cylinders are not working":"Los cilindros no funcionan","No compressed air in the machine":"No hay aire comprimido en la m\u00e1quina","Control valves not set per work instruction":"V\u00e1lvulas de control no ajustadas seg\u00fan la instrucci\u00f3n de trabajo","Axes are not moving":"Los ejes no se mueven","Motor controller shows an error":"El controlador de motor muestra un error","Axis standing on a limit switch":"El eje est\u00e1 sobre un final de carrera","Stepper-motor fuses":"Fusibles del motor paso a paso","Heating element does not heat up":"El elemento calefactor no calienta","Fuse or temperature controller":"Fusible o controlador de temperatura","Release relay for the heating process":"Rel\u00e9 de habilitaci\u00f3n del proceso de calentamiento","Solid-state relay input / output":"Entrada / salida del rel\u00e9 de estado s\u00f3lido","Set temperature is reached very slowly":"La temperatura ajustada se alcanza muy lentamente","Heat cartridges faulty":"Cartuchos calefactores defectuosos","Temperature display shows about 800 \u00b0C above room temperature":"La pantalla de temperatura muestra unos 800 \u00b0C por encima de la temperatura ambiente","Temperature sensor disconnected or short-circuited":"Sensor de temperatura desconectado o en cortocircuito","Process does not start after pressing \"Start\"":"El proceso no arranca tras presionar \u00abStart\u00bb","Alarm not cleared":"Alarma no reconocida","Control needs a restart":"El control necesita un reinicio","Cannot connect to or download firmware to the Festo motor controllers":"No se puede conectar con los controladores de motor Festo ni descargar el firmware","PC IP address outside the machine network range":"Direcci\u00f3n IP de la PC fuera del rango de red de la m\u00e1quina","PLC OS, ESI file and Festo firmware versions do not match":"Las versiones del SO del PLC, del archivo ESI y del firmware Festo no coinciden","Annual maintenance":"Mantenimiento anual","Linear axes need lubrication":"Los ejes lineales necesitan lubricaci\u00f3n","Toothed belts need inspection":"Las bandas dentadas necesitan inspecci\u00f3n","The dies can be hot. Wait until the die temperature is below 50 \u00b0C (122 \u00b0F) before touching them.":"Las matrices pueden estar calientes. Espere a que la temperatura de la matriz baje de 50 \u00b0C (122 \u00b0F) antes de tocarlas.","Disconnect the machine from power and from the compressed-air supply before any maintenance. Failure to do so can cause fatal injury.":"Desconecte la m\u00e1quina de la alimentaci\u00f3n el\u00e9ctrica y del aire comprimido antes de cualquier mantenimiento. No hacerlo puede causar lesiones mortales.","Work on electrical components may only be carried out by qualified personnel.":"Los trabajos en componentes el\u00e9ctricos solo puede realizarlos personal calificado.","Switch the ionizer power supply OFF and confirm the fan has stopped before touching the emitters \u2014 energized emitters can cause electric shock, and the emitter tips are sharp.":"Apague la alimentaci\u00f3n del ionizador y confirme que el ventilador se ha detenido antes de tocar los emisores: los emisores energizados pueden causar descarga el\u00e9ctrica y sus puntas son afiladas.","Advanced settings should only be changed after the main recipe is finished \u2014 their standard values are calculated from the other settings. Tick \"Manual\" to overwrite a calculated value.":"Los ajustes avanzados solo deben cambiarse cuando la receta principal est\u00e9 terminada: sus valores est\u00e1ndar se calculan a partir de los dem\u00e1s ajustes. Marque \u00abManual\u00bb para sobrescribir un valor calculado.","After clearing an alarm, press \"Reset\" on the HMI. A new process can only be started after Reset.":"Despu\u00e9s de resolver una alarma, presione \u00abReset\u00bb en el HMI. Solo despu\u00e9s del Reset puede iniciarse un nuevo proceso.","Do not bend the picking fingers too far \u2014 they can be damaged.":"No doble demasiado los dedos de toma: pueden da\u00f1arse.","Software and firmware changes on the PLC and Festo controllers must follow the BW-TEC upgrade notes (PLC OS, ESI file and Festo firmware versions must match). Do not attempt without BW-TEC guidance.":"Los cambios de software y firmware en el PLC y los controladores Festo deben seguir las notas de actualizaci\u00f3n de BW-TEC (las versiones del SO del PLC, del archivo ESI y del firmware Festo deben coincidir). No lo intente sin la gu\u00eda de BW-TEC.","Too much strain relieve compresses the tube and can bend it.":"Un alivio de tensi\u00f3n excesivo comprime el tubo y puede doblarlo.","Press \"Reset\" on the HMI. If that does not clear it, restart the machine at the main switch. If the error keeps appearing, contact support.":"Presione \u00abReset\u00bb en el HMI. Si no se borra, reinicie la m\u00e1quina con el interruptor principal. Si el error sigue apareciendo, contacte al soporte.","Make sure the gripper is not blocked, and that the gripper pressure in the recipe is set high enough to open and close it.":"Aseg\u00farese de que la pinza no est\u00e9 bloqueada y de que la presi\u00f3n de pinza de la receta sea suficiente para abrirla y cerrarla.","Make sure the cylinder is not blocked.":"Aseg\u00farese de que el cilindro no est\u00e9 bloqueado.","Push the axis by hand at least 50 mm to the right, then restart the machine to reset the axis reference points.":"Empuje el eje a mano al menos 50 mm hacia la derecha y reinicie la m\u00e1quina para restablecer los puntos de referencia del eje.","Push the axis by hand at least 50 mm to the left, then restart the machine to reset the axis reference points.":"Empuje el eje a mano al menos 50 mm hacia la izquierda y reinicie la m\u00e1quina para restablecer los puntos de referencia del eje.","Make sure the safety door is closed, then press \"Reset\" on the HMI. If that does not work, open the safety door and push the axis by hand at least 50 mm to the right.":"Aseg\u00farese de que la puerta de seguridad est\u00e9 cerrada y presione \u00abReset\u00bb en el HMI. Si no funciona, abra la puerta de seguridad y empuje el eje a mano al menos 50 mm hacia la derecha.","Make sure the safety door is closed, then press \"Reset\" on the HMI. If that does not work, open the safety door and push the axis by hand at least 50 mm to the left.":"Aseg\u00farese de que la puerta de seguridad est\u00e9 cerrada y presione \u00abReset\u00bb en el HMI. Si no funciona, abra la puerta de seguridad y empuje el eje a mano al menos 50 mm hacia la izquierda.","If the error keeps happening during the process, decrease one or more of these recipe parameters: Start tab \u2192 \"Start pos. right axis\"; Right necking tab \u2192 \"Stretching distance\"; Left necking tab \u2192 \"Offset right axis\".":"Si el error se repite durante el proceso, reduzca uno o varios de estos par\u00e1metros de receta: pesta\u00f1a Start \u2192 \u00abStart pos. right axis\u00bb; pesta\u00f1a Right necking \u2192 \u00abStretching distance\u00bb; pesta\u00f1a Left necking \u2192 \u00abOffset right axis\u00bb.","Check that the wires leading to the split dies are intact. If the error keeps appearing, contact support.":"Revise que los cables que van a las matrices partidas est\u00e9n intactos. Si el error sigue apareciendo, contacte al soporte.","Clean the fork sensor that detects the edge of the slug.":"Limpie el sensor de horquilla que detecta el borde de la preforma.","Set the recipe parameter \"Tube detection sensitivity\" correctly: read the fork-sensor value on the HMI with the necked sleeve in the sensor, then with un-necked tube; the parameter is 70 % of the difference (e.g. (2000 \u2212 1000) \u00d7 0.7 = 700). Check that the value varies less than this when un-necked tube is pulled through the sensor.":"Ajuste correctamente el par\u00e1metro \u00abTube detection sensitivity\u00bb: lea el valor del sensor de horquilla en el HMI con la funda estrechada dentro del sensor y luego con tubo sin estrechar; el par\u00e1metro es el 70 % de la diferencia (p. ej. (2000 \u2212 1000) \u00d7 0.7 = 700). Revise que el valor var\u00ede menos que esta cifra al pasar tubo sin estrechar por el sensor.","Reduce \"Start pressure die\" and \"Process pressure ramp die\" so the dies close more gently. The practical minimum is about 0.3 bar start pressure and 0.1 bar/s pressure ramp.":"Reduzca \u00abStart pressure die\u00bb y \u00abProcess pressure ramp die\u00bb para que las matrices cierren con m\u00e1s suavidad. El m\u00ednimo pr\u00e1ctico es unos 0.3 bar de presi\u00f3n inicial y 0.1 bar/s de rampa de presi\u00f3n.","Increase the axis \"Acceleration\" so the tube is pulled through the die while the die \u2014 with the slow pressure ramp \u2014 is still closing. The material then slides into the die instead of being compressed purely by force.":"Aumente la \u00abAcceleration\u00bb del eje para que el tubo se tire a trav\u00e9s de la matriz mientras esta \u2014con la rampa de presi\u00f3n lenta\u2014 todav\u00eda se est\u00e1 cerrando. As\u00ed el material se desliza en la matriz en lugar de comprimirse solo por fuerza.","Reduce the axis \"Acceleration\" so the heat of the dies has time to transfer into the material before the tube is pulled.":"Reduzca la \u00abAcceleration\u00bb del eje para que el calor de las matrices tenga tiempo de transferirse al material antes de tirar del tubo.","Check that the tube is centred between the dies, not too high or too low. Compare the height of the left and right centering-gripper fingers by looking through the centering gripper from the side; misaligned fingers pin the tube against the top or bottom of the die.":"Revise que el tubo est\u00e9 centrado entre las matrices, ni demasiado alto ni demasiado bajo. Compare la altura de los dedos izquierdo y derecho de la pinza de centrado mirando a trav\u00e9s de ella desde el lateral; unos dedos desalineados pinzan el tubo contra la parte superior o inferior de la matriz.","Increase \"Temperature die\".":"Aumente \u00abTemperature die\u00bb.","Clean the dies. Clean them regularly.":"Limpie las matrices. L\u00edmpielas con regularidad.","Check that the die diameter is not too small for the tube (\"Diameter die\" must match the die actually installed \u2014 the diameter is engraved on BW-TEC dies, e.g. 260 = 2.6 mm).":"Revise que el di\u00e1metro de la matriz no sea demasiado peque\u00f1o para el tubo (\u00abDiameter die\u00bb debe coincidir con la matriz instalada; el di\u00e1metro est\u00e1 grabado en las matrices BW-TEC, p. ej. 260 = 2.6 mm).","Reduce the stretching \"Speed\".":"Reduzca la \u00abSpeed\u00bb (velocidad) de estirado.","For large-diameter tube (above about 4 mm) with a large reduction ratio, enable \"Activate prestretching\" on the Prestretching tab. Always try without prestretching first; enable it only if the tube keeps breaking when the dies close. For very thick-walled tube, \"Number of runs\" can be set above 1.":"Para tubo de gran di\u00e1metro (m\u00e1s de unos 4 mm) con una relaci\u00f3n de reducci\u00f3n alta, active \u00abActivate prestretching\u00bb en la pesta\u00f1a Prestretching. Pruebe siempre primero sin preestirado; act\u00edvelo solo si el tubo sigue rompi\u00e9ndose al cerrar las matrices. Para tubo de pared muy gruesa, \u00abNumber of runs\u00bb puede ajustarse por encima de 1.","On older machines with doors: block the white roll of the left roller gripper with a washer and set fPressureRollerGripperLeftForPretensioningTube to about 5 bar so the tube is under slight tension when the dies close. If the wheel is not blocked, this parameter must be 0 bar.":"En m\u00e1quinas antiguas con puertas: bloquee el rodillo blanco de la pinza de rodillo izquierda con una arandela y ajuste fPressureRollerGripperLeftForPretensioningTube a unos 5 bar para que el tubo est\u00e9 ligeramente tensado al cerrar las matrices. Si el rodillo no est\u00e1 bloqueado, este par\u00e1metro debe ser 0 bar.","Consider dies with angled contact surfaces (1610125) instead of parallel ones (1610068): they help small tubes centre in the middle so the tube is less likely to be clamped between the contact surfaces and break. Then set the advanced parameter \"Dies with angled contact surfaces\" to Yes.":"Considere matrices con superficies de contacto inclinadas (1610125) en lugar de paralelas (1610068): ayudan a que los tubos peque\u00f1os se centren, de modo que es menos probable que el tubo quede pinzado entre las superficies de contacto y se rompa. Ajuste entonces el par\u00e1metro avanzado \u00abDies with angled contact surfaces\u00bb a Yes.","Reduce \"Roller gripper pressure right\" (recommended below 1 bar) and \"Roller gripper pressure left\" so the roll does not indent the still-hot tube leaving the dies.":"Reduzca \u00abRoller gripper pressure right\u00bb (recomendado por debajo de 1 bar) y \u00abRoller gripper pressure left\u00bb para que el rodillo no marque el tubo a\u00fan caliente que sale de las matrices.","If the indentation persists at minimum pressure: in Advanced settings set \"Close right roller gripper before moving offset right axis\" to No. If that makes the tube handling unreliable, leave it at Yes and instead increase \"Delay closing roller gripper\".":"Si la marca persiste con la presi\u00f3n m\u00ednima: en Advanced settings ajuste \u00abClose right roller gripper before moving offset right axis\u00bb a No. Si con ello la manipulaci\u00f3n del tubo deja de ser confiable, d\u00e9jelo en Yes y aumente en su lugar \u00abDelay closing roller gripper\u00bb.","Increase \"Strain relieve\" (distance the necking axis moves back after stretching) so the tension is relieved before the dies open. Otherwise the slug is pulled through the dies while they open and the die edges leave marks on it.":"Aumente \u00abStrain relieve\u00bb (distancia que retrocede el eje de estrechado tras el estirado) para que la tensi\u00f3n se alivie antes de abrir las matrices. De lo contrario, la preforma es arrastrada por las matrices mientras se abren y los bordes dejan marcas.","If a diameter increase right before the slug is observed, set \"Delay before strain relieve\". Use the delay only if the issue has actually been observed.":"Si se observa un aumento de di\u00e1metro justo antes de la preforma, ajuste \u00abDelay before strain relieve\u00bb. Use el retardo solo si el problema se ha observado realmente.","Set the advanced parameter \"Dies with angled contact surfaces\" to Yes. After the right neck the fork-sensor axis then moves a few millimetres left while the dies open, and after the left neck the feed-out grippers move right after gripping, so the tube is pulled free without damaging the neck. (Requires \"Close right roller gripper before moving offset right axis\" = Yes and \"Delay closing roller gripper\" = 0.)":"Ajuste el par\u00e1metro avanzado \u00abDies with angled contact surfaces\u00bb a Yes. Tras el cuello derecho, el eje del sensor de horquilla se desplaza unos mil\u00edmetros a la izquierda mientras se abren las matrices, y tras el cuello izquierdo las pinzas de descarga se desplazan a la derecha despu\u00e9s de agarrar, de modo que el tubo se libera sin da\u00f1ar el cuello. (Requiere \u00abClose right roller gripper before moving offset right axis\u00bb = Yes y \u00abDelay closing roller gripper\u00bb = 0.)","Set the advanced parameter \"Axis synchronization during prestretching\" to Yes (recommended for tube diameter \u2264 2.5 mm) so the opposite axis moves with the necking axis and the tube is not pushed into a bend.":"Ajuste el par\u00e1metro avanzado \u00abAxis synchronization during prestretching\u00bb a Yes (recomendado para di\u00e1metro de tubo \u2264 2.5 mm) para que el eje opuesto se mueva con el eje de estrechado y el tubo no se doble.","Set \"Pre-tension distance before left neck\" (recommended 0.3 \u00d7 strain relieve right neck for tube \u2264 2 mm) together with \"Keep tube gripped with right axis when starting left neck\" = Yes, so the tube is straight and centred when the dies close for the left neck.":"Ajuste \u00abPre-tension distance before left neck\u00bb (recomendado 0.3 \u00d7 strain relieve del cuello derecho para tubo \u2264 2 mm) junto con \u00abKeep tube gripped with right axis when starting left neck\u00bb = Yes, para que el tubo est\u00e9 recto y centrado cuando las matrices cierren para el cuello izquierdo.","Increase \"Gripper pressure left and right\" (the centering grippers that pull the tube through the die).":"Aumente \u00abGripper pressure left and right\u00bb (las pinzas de centrado que tiran del tubo a trav\u00e9s de la matriz).","For tube diameter above 3 mm set the advanced parameter \"Offset right necking axis before gripping tube\" to about 10 mm so all teeth of the right centering gripper engage the material and it can hold a higher pulling force.":"Para di\u00e1metro de tubo superior a 3 mm, ajuste el par\u00e1metro avanzado \u00abOffset right necking axis before gripping tube\u00bb a unos 10 mm para que todos los dientes de la pinza de centrado derecha agarren el material y soporten una mayor fuerza de tracci\u00f3n.","The process stops when the recipe parameter \"Number of broken tubes until abort\" is exceeded. Several consecutive breaks point to a process problem \u2014 work through the problem \"Tube breaks during stretching\", then Reset and restart.":"El proceso se detiene cuando se supera el par\u00e1metro de receta \u00abNumber of broken tubes until abort\u00bb. Varias roturas consecutivas indican un problema de proceso: recorra el problema \u00abEl tubo se rompe durante el estirado\u00bb, luego Reset y reinicie.","No neck was detected before the left axis reached its limit. Make sure the required left stretching distance does not exceed the travel of the left necking axis (use a shorter tube, or reduce the sleeve length via \"Offset right axis\").":"No se detect\u00f3 ning\u00fan cuello antes de que el eje izquierdo alcanzara su l\u00edmite. Aseg\u00farese de que la distancia de estirado izquierda necesaria no supere el recorrido del eje de estrechado izquierdo (use un tubo m\u00e1s corto o reduzca la longitud de la funda mediante \u00abOffset right axis\u00bb).","Choose the picking fingers for the tube: 2711204-002 standard (1.5\u20137 mm); 2711205-002 thin fingers for small tube (up to about 3 mm) \u2014 they bend more easily so only one tube is picked; 2711204-001 short fingers for very large / thick-walled tube that keeps hanging. Laser-engraved -NA fingers have more friction and raise the risk of picking two tubes.":"Elija los dedos de toma seg\u00fan el tubo: 2711204-002 est\u00e1ndar (1.5\u20137 mm); 2711205-002 dedos finos para tubo peque\u00f1o (hasta unos 3 mm), que se flexionan m\u00e1s f\u00e1cilmente y as\u00ed solo toman un tubo; 2711204-001 dedos cortos para tubo muy grande / de pared gruesa que sigue qued\u00e1ndose colgado. Los dedos -NA grabados por l\u00e1ser tienen m\u00e1s fricci\u00f3n y aumentan el riesgo de tomar dos tubos.","Set \"Stroke grip\" so the picking fingers are slightly bent when gripping \u2014 a second tube then falls out of the bottom. If the tube deforms too much before the fingers bend, switch to the thinner 2711205-00x fingers.":"Ajuste \u00abStroke grip\u00bb de modo que los dedos de toma queden ligeramente flexionados al agarrar: un segundo tubo cae entonces por la parte inferior. Si el tubo se deforma demasiado antes de que los dedos se flexionen, cambie a los dedos m\u00e1s finos 2711205-00x.","Check \"Stroke open\" (opening of the picker gripper, as a percentage added to the tube diameter) and \"Diameter\" in the Picker parameters.":"Revise \u00abStroke open\u00bb (apertura de la pinza del separador, como porcentaje agregado al di\u00e1metro del tubo) y \u00abDiameter\u00bb en los par\u00e1metros del separador.","Adjust \"Gripper sensor correction\": decrease it so the gripper dives deeper into the tube pile (tube sits higher between the fingers), increase it to dive less deep.":"Ajuste \u00abGripper sensor correction\u00bb: red\u00fazcalo para que la pinza se hunda m\u00e1s en la pila de tubos (el tubo queda m\u00e1s arriba entre los dedos), aum\u00e9ntelo para que se hunda menos.","If tubes stick together from static charge, set \"Use ionizer at picker\" to Yes (only when the feed-in ionizer is fitted) and keep \"Use ionizer for reorder\" on so an air blow re-centres the remaining tubes in the hopper after several empty picks.":"Si los tubos se pegan entre s\u00ed por carga est\u00e1tica, ajuste \u00abUse ionizer at picker\u00bb a Yes (solo si est\u00e1 instalado el ionizador de alimentaci\u00f3n) y mantenga activado \u00abUse ionizer for reorder\u00bb para que un soplo de aire vuelva a centrar los tubos restantes en la tolva tras varias tomas vac\u00edas.","Fill new raw tubes into the hopper.":"Cargue tubos nuevos en la tolva.","Press the emergency stop and check by hand that the picker gripper fingers open and close freely without jamming. The finger sheets can be misaligned so that screw heads catch on the sheet when the gripper closes; realign them.":"Presione la parada de emergencia y revise a mano que los dedos de la pinza del separador abran y cierren libremente sin atascarse. Las l\u00e1minas de los dedos pueden estar desalineadas de modo que las cabezas de los tornillos se enganchen en la l\u00e1mina al cerrar la pinza; realin\u00e9elas.","Make sure nothing is in front of the left discharge monitoring sensor at the tube picker.":"Aseg\u00farese de que no haya nada delante del sensor izquierdo de control de descarga del separador.","Make sure nothing is in front of the right discharge monitoring sensor at the tube picker.":"Aseg\u00farese de que no haya nada delante del sensor derecho de control de descarga del separador.","The tube was lost during the process. Remove the tube from the machine, press Reset and continue the process.":"El tubo se perdi\u00f3 durante el proceso. Retire el tubo de la m\u00e1quina, presione Reset y contin\u00fae el proceso.","Remove the tube or object sticking out of (or hanging into) the tube collector.":"Retire el tubo u objeto que sobresale del colector de tubos (o cuelga dentro de \u00e9l).","Close the tube collector.":"Cierre el colector de tubos.","Set \"Gripper pressure feed out\" to at least 1.5 bar so the feed-out grippers close correctly and in time.":"Ajuste \u00abGripper pressure feed out\u00bb a al menos 1.5 bar para que las pinzas de descarga cierren correctamente y a tiempo.","Release the emergency stop and press the blue illuminated reset button on top of the emergency-stop switch.":"Desenclave la parada de emergencia y presione el bot\u00f3n de reset azul iluminado situado encima del interruptor de parada de emergencia.","Close the safety door and reload the recipe.":"Cierre la puerta de seguridad y vuelva a cargar la receta.","Close the safety door.":"Cierre la puerta de seguridad.","Press \"Reset\" on the HMI.":"Presione \u00abReset\u00bb en el HMI.","Check the main pressure switch.":"Revise el presostato principal.","Check the compressed-air supply (6\u20138 bar / 87\u2013116 psi). Cylinders need at least 1 bar to work.":"Revise el suministro de aire comprimido (6\u20138 bar / 87\u2013116 psi). Los cilindros necesitan al menos 1 bar para funcionar.","A tube was detected while the process is in simulation mode. Remove the tube, or take the machine out of simulation.":"Se detect\u00f3 un tubo mientras el proceso est\u00e1 en modo simulaci\u00f3n. Retire el tubo o saque la m\u00e1quina del modo simulaci\u00f3n.","Check that the Ethernet connectors at the motor controllers and at the PLC are fully plugged in.":"Revise que los conectores Ethernet de los controladores de motor y del PLC est\u00e9n totalmente conectados.","Make sure the IO-Link master is connected to the PLC via Ethernet, and that the connector of the electrical gripper at the picker is still connected.":"Aseg\u00farese de que el maestro IO-Link est\u00e9 conectado al PLC por Ethernet y de que el conector de la pinza el\u00e9ctrica del separador siga conectado.","Critical error: can only be resolved by a technician. Contact support.":"Error cr\u00edtico: solo puede resolverlo un t\u00e9cnico. Contacte al soporte.","Push the right necking axis by hand at least 50 mm to the right, then restart the machine to reset the axis reference points.":"Empuje el eje de estrechado derecho a mano al menos 50 mm hacia la derecha y reinicie la m\u00e1quina para restablecer los puntos de referencia del eje.","If this recurs when the axes return to the start position: the fork-sensor cylinder's retract signal may be arriving late because the cylinder has mechanical resistance over its last millimetres and briefly sticks. Have the cylinder checked and freed.":"Si se repite cuando los ejes vuelven a la posici\u00f3n inicial: la se\u00f1al de retracci\u00f3n del cilindro del sensor de horquilla puede llegar tarde porque el cilindro tiene resistencia mec\u00e1nica en sus \u00faltimos mil\u00edmetros y se atasca brevemente. Haga revisar y liberar el cilindro.","Wait until the split die has reached the set temperature.":"Espere a que la matriz partida alcance la temperatura ajustada.","Make sure the feed-out ionizer (the one with the fan) is powered on (toggle switch on the ionizer) and that all parts of the fan are correctly mounted and snapped in place.":"Aseg\u00farese de que el ionizador de descarga (el del ventilador) est\u00e9 encendido (interruptor basculante en el ionizador) y de que todas las piezas del ventilador est\u00e9n correctamente montadas y encajadas.","Clean the ionizer emitters: switch the power supply off and confirm the fan has stopped; press part A of the emitter cartridge and pull the cartridge out towards the air-blow side; clean the eight emitters with a cotton swab soaked in reagent ethanol (\u2265 99.5 %); refit the cartridge so its terminals contact the body terminals, with no foreign matter on the connector.":"Limpie los emisores del ionizador: apague la alimentaci\u00f3n y confirme que el ventilador se ha detenido; presione la parte A del cartucho de emisores y extr\u00e1igalo hacia el lado del soplado de aire; limpie los ocho emisores con un hisopo de algod\u00f3n empapado en etanol reactivo (\u2265 99.5 %); vuelva a colocar el cartucho de modo que sus terminales contacten con los del cuerpo, sin materias extra\u00f1as en el conector.","Check that the PC is running.":"Revise que la PC est\u00e9 encendida.","Check the touchscreen cables and plugs, and the touchscreen's control light.":"Revise los cables y conectores de la pantalla t\u00e1ctil y su luz de control.","Check the fuse.":"Revise el fusible.","Make sure the control valves are adjusted according to your work instruction.":"Aseg\u00farese de que las v\u00e1lvulas de control est\u00e9n ajustadas seg\u00fan su instrucci\u00f3n de trabajo.","Check whether the motor controllers display an error.":"Revise si los controladores de motor muestran alg\u00fan error.","Check the fuses for the stepper motor.":"Revise los fusibles del motor paso a paso.","Check whether the axis is standing on a limit switch.":"Revise si el eje est\u00e1 sobre un final de carrera.","Check the fuse and the temperature controller.":"Revise el fusible y el controlador de temperatura.","Check the release relay for the heating process.":"Revise el rel\u00e9 de habilitaci\u00f3n del proceso de calentamiento.","Check the input and output of the solid-state relay.":"Revise la entrada y la salida del rel\u00e9 de estado s\u00f3lido.","Check the function of the heat cartridges.":"Revise el funcionamiento de los cartuchos calefactores.","The temperature sensor is probably disconnected or short-circuited. Check its wiring and connector.":"El sensor de temperatura probablemente est\u00e1 desconectado o en cortocircuito. Revise su cableado y conector.","Press the emergency stop, reset the alarm, and try to start the process again.":"Presione la parada de emergencia, reconozca la alarma e intente iniciar el proceso de nuevo.","Restart the machine by switching the main switch off and on.":"Reinicie la m\u00e1quina apagando y encendiendo el interruptor principal.","In the Festo Automation Suite check the parameter \"Maximum Torque Symmetrical\" (P1.526796) on the affected axis \u2014 this value has been observed to drop by itself. Restore it to the correct value.":"En Festo Automation Suite revise el par\u00e1metro \u00abMaximum Torque Symmetrical\u00bb (P1.526796) en el eje afectado: se ha observado que este valor baja por s\u00ed solo. Restablezca el valor correcto.","Make sure the PC's IP address is set correctly in the machine's range (192.168.1.xxx); the Festo controllers are visible on the network but no connection can be established otherwise.":"Aseg\u00farese de que la direcci\u00f3n IP de la PC est\u00e9 configurada correctamente dentro del rango de la m\u00e1quina (192.168.1.xxx); de lo contrario los controladores Festo son visibles en la red pero no se puede establecer conexi\u00f3n.","Check that the PLC OS is at least V1.17 and the Festo controller firmware matches the ESI file (working combination: ESI Festo-CMMT-AS-MP-S1-CiA402-20240702 with firmware 35.9.2.5078). After loading new software or a new ESI file, run \"compare and download\" in JetSym.":"Revise que el SO del PLC sea al menos V1.17 y que el firmware de los controladores Festo coincida con el archivo ESI (combinaci\u00f3n v\u00e1lida: ESI Festo-CMMT-AS-MP-S1-CiA402-20240702 con firmware 35.9.2.5078). Tras cargar software nuevo o un archivo ESI nuevo, ejecute \u00abcomparar y descargar\u00bb en JetSym.","Update the necker PLC software to V2.9.0.0 or later, where the fork-sensor-axis torque reduction that caused tracking errors was removed. Follow the BW-TEC upgrade notes.":"Actualice el software del PLC del estrechador a V2.9.0.0 o posterior, donde se elimin\u00f3 la reducci\u00f3n de torque del eje del sensor de horquilla que causaba errores de seguimiento. Siga las notas de actualizaci\u00f3n de BW-TEC.","Have the toothed belts checked (annual inspection) and replaced if necessary. Contact a BW-TEC technician.":"Haga revisar las bandas dentadas (inspecci\u00f3n anual) y reemplazarlas si es necesario. Contacte a un t\u00e9cnico de BW-TEC.","Lubricate the three linear axes (right necking, left necking, fork sensor) once a year with an FDA/USDA-H1 grease: remove the axis cover strip to reach the ball-screw spindle.":"Lubrique los tres ejes lineales (estrechado derecho, estrechado izquierdo, sensor de horquilla) una vez al a\u00f1o con una grasa FDA/USDA-H1: retire la tira de cubierta del eje para acceder al husillo de bolas.","Use \"Slug length correction\" to compensate a consistent difference between the measured slug length and the \"Slug length\" parameter. For slugs shorter than the 17 mm minimum, use \"Delay stop left axis\" on the Left necking tab.":"Use \u00abSlug length correction\u00bb para compensar una diferencia constante entre la longitud de preforma medida y el par\u00e1metro \u00abSlug length\u00bb. Para preformas m\u00e1s cortas que el m\u00ednimo de 17 mm, use \u00abDelay stop left axis\u00bb en la pesta\u00f1a Left necking.","Machine areas":"Zonas de la m\u00e1quina","Tube picker (separator)":"Separador de tubos (picker)","Picks single raw tubes out of the hopper with an electrical gripper and sheet-metal picking fingers; discharge monitoring sensors check that only one tube leaves.":"Toma tubos individuales de la tolva con una pinza el\u00e9ctrica y dedos de toma de l\u00e1mina; los sensores de control de descarga verifican que salga solo un tubo.","Feed in":"Alimentaci\u00f3n","Horizontal and vertical axes plus a roller gripper that bring the tube into the necking station.":"Ejes horizontal y vertical m\u00e1s una pinza de rodillo que llevan el tubo a la estaci\u00f3n de estrechado.","Necker":"Estaci\u00f3n de estrechado","Heated split dies, left and right necking axes with centering and roller grippers, and the fork-sensor axis that defines the slug length.":"Matrices partidas calefactadas, ejes de estrechado izquierdo y derecho con pinzas de centrado y de rodillo, y el eje del sensor de horquilla que define la longitud de la preforma.","Feed out":"Descarga","Two pneumatic grippers that place the necked tube into the tube collector; an ionizer with fan reduces static cling.":"Dos pinzas neum\u00e1ticas que depositan el tubo estrechado en el colector; un ionizador con ventilador reduce la adherencia est\u00e1tica.","Process terms":"T\u00e9rminos del proceso","Neck / necking":"Cuello / estrechado","Pulling the heated tube through a split die smaller than the tube to reduce its diameter. Both ends are necked to the same diameter.":"Tirar del tubo caliente a trav\u00e9s de una matriz partida m\u00e1s peque\u00f1a que el tubo para reducir su di\u00e1metro. Ambos extremos se estrechan al mismo di\u00e1metro.","Slug (parison)":"Preforma (tramo sin estrechar)","The un-necked section left in the middle of the tube. Its length is set by the distance between the die and the fork sensor (\"Slug length\", minimum 17 mm).":"El tramo sin estrechar que queda en el centro del tubo. Su longitud la define la distancia entre la matriz y el sensor de horquilla (\u00abSlug length\u00bb, m\u00ednimo 17 mm).","Sleeve":"Funda","The necked section on either side of the slug. Right sleeve length = \"Stretching distance\"; left sleeve length is controlled by \"Offset right axis\".":"El tramo estrechado a cada lado de la preforma. Longitud de la funda derecha = \u00abStretching distance\u00bb; la longitud de la funda izquierda se controla con \u00abOffset right axis\u00bb.","Prestretching":"Preestirado","An optional pre-pull for large-diameter tube with a large reduction ratio, used only if the tube keeps breaking when the dies close.":"Un pretirado opcional para tubo de gran di\u00e1metro con relaci\u00f3n de reducci\u00f3n alta, usado solo si el tubo sigue rompi\u00e9ndose al cerrar las matrices.","Strain relieve":"Alivio de tensi\u00f3n","The distance the necking axis moves back after stretching to release tension before the dies open.":"La distancia que retrocede el eje de estrechado tras el estirado para liberar la tensi\u00f3n antes de que se abran las matrices.","Key recipe parameters":"Par\u00e1metros clave de la receta","Start pressure die / Process pressure die / Process pressure ramp die":"Start pressure die / Process pressure die / Process pressure ramp die","The die closes at the start pressure (the tube moulds into the die as stretching starts), then ramps to the process pressure at the ramp rate.":"La matriz cierra a la presi\u00f3n inicial (el tubo se amolda a la matriz al iniciarse el estirado) y luego sube a la presi\u00f3n de proceso seg\u00fan la rampa.","Speed / Acceleration":"Velocidad / Aceleraci\u00f3n","Pulling speed through the die and how quickly it is reached.":"Velocidad de tracci\u00f3n a trav\u00e9s de la matriz y rapidez con que se alcanza.","Tube detection sensitivity":"Tube detection sensitivity (sensibilidad de detecci\u00f3n del tubo)","Fork-sensor threshold that stops the left axis when the slug edge is detected \u2014 70 % of the difference between the sleeve and un-necked tube readings.":"Umbral del sensor de horquilla que detiene el eje izquierdo al detectar el borde de la preforma: el 70 % de la diferencia entre las lecturas de la funda y del tubo sin estrechar.","Number of broken tubes until abort":"Number of broken tubes until abort (n\u00famero de tubos rotos hasta abortar)","How many consecutive broken tubes are tolerated before the automatic process stops.":"Cu\u00e1ntos tubos rotos consecutivos se toleran antes de que se detenga el proceso autom\u00e1tico.","Limits":"L\u00edmites","Machine limits":"L\u00edmites de la m\u00e1quina","Raw tube 0.7\u20137 mm; neck-down 0.4\u20135.2 mm; travel 450 mm (L) / 730 mm (R); speed 0\u2013400 mm/s; process temperature 20\u2013200 \u00b0C; air 6\u20138 bar.":"Tubo bruto 0.7\u20137 mm; estrechado a 0.4\u20135.2 mm; recorrido 450 mm (izq.) / 730 mm (der.); velocidad 0\u2013400 mm/s; temperatura de proceso 20\u2013200 \u00b0C; aire 6\u20138 bar."}},"review":[{"lang":"de","term":"Schlauchdehner","en":"necker / necking machine","note":"BW-TEC's own term; used throughout the German manual. Confirm MSI uses the same."},{"lang":"de","term":"Rohling","en":"slug (parison)","note":"BW-TEC manual uses \u201eRohling\u201c and \u201eungereckte L\u00e4nge\u201c interchangeably for the slug."},{"lang":"de","term":"H\u00fclse","en":"sleeve (necked section)","note":"Not in the BW-TEC manual \u2014 my rendering of the English manual's \"sleeve\". Alternatives: \u201egedehnter Abschnitt\u201c."},{"lang":"de","term":"Entlastung","en":"strain relieve","note":"My rendering; the German recipe tab wording should be checked on the HMI."},{"lang":"de","term":"Vordehnen","en":"prestretching","note":"My rendering; check against the German HMI recipe tab name."},{"lang":"de","term":"Separierer","en":"tube picker","note":"BW-TEC's German term for the picker."},{"lang":"es-ES","term":"estrechado","en":"necking","note":"Alternatives: \u00abreducci\u00f3n de di\u00e1metro\u00bb, \u00abcuelleado\u00bb (not standard). Confirm the term used by Spanish-speaking BW-TEC customers."},{"lang":"es-ES","term":"estrechador","en":"necker / necking machine","note":"Derived from \u00abestrechado\u00bb; alternative: \u00abm\u00e1quina de reducci\u00f3n de tubos\u00bb."},{"lang":"es-ES","term":"preforma","en":"slug (parison)","note":"Alternatives: \u00abparis\u00f3n\u00bb, \u00abtramo sin estrechar\u00bb."},{"lang":"es-ES","term":"funda","en":"sleeve (necked section)","note":"Alternatives: \u00abmanguito\u00bb, \u00abtramo estrechado\u00bb."},{"lang":"es-ES","term":"matriz partida","en":"split die","note":"Alternative: \u00abmatriz dividida\u00bb, \u00abmatriz de dos piezas\u00bb."},{"lang":"es-ES","term":"pinza de rodillo","en":"roller gripper","note":"Alternative: \u00abpinza de rodillos\u00bb."},{"lang":"es-ES","term":"separador","en":"tube picker","note":"Alternatives: \u00abalimentador\u00bb, \u00abpicker\u00bb."},{"lang":"es-ES","term":"sensor de horquilla","en":"fork sensor (Gabellichtschranke)","note":"Alternative: \u00abbarrera fotoel\u00e9ctrica de horquilla\u00bb."},{"lang":"es-ES","term":"alivio de tensi\u00f3n","en":"strain relieve","note":"Alternative: \u00abrelajaci\u00f3n\u00bb."},{"lang":"es-ES","term":"preestirado","en":"prestretching","note":"Alternative: \u00abpre-estiramiento\u00bb."},{"lang":"es-ES","term":"tolva","en":"hopper","note":"Alternative: \u00abcargador\u00bb, \u00abalmac\u00e9n de tubos\u00bb."},{"lang":"es-419","term":"estrechado","en":"necking","note":"Alternatives: \u00abreducci\u00f3n de di\u00e1metro\u00bb, \u00abcuelleado\u00bb (not standard). Confirm the term used by Spanish-speaking BW-TEC customers."},{"lang":"es-419","term":"estrechador","en":"necker / necking machine","note":"Derived from \u00abestrechado\u00bb; alternative: \u00abm\u00e1quina de reducci\u00f3n de tubos\u00bb."},{"lang":"es-419","term":"preforma","en":"slug (parison)","note":"Alternatives: \u00abparis\u00f3n\u00bb, \u00abtramo sin estrechar\u00bb."},{"lang":"es-419","term":"funda","en":"sleeve (necked section)","note":"Alternatives: \u00abmanguito\u00bb, \u00abtramo estrechado\u00bb."},{"lang":"es-419","term":"matriz partida","en":"split die","note":"Alternative: \u00abmatriz dividida\u00bb, \u00abdado partido\u00bb (Mexico often uses \u00abdado\u00bb for die)."},{"lang":"es-419","term":"pinza de rodillo","en":"roller gripper","note":"Alternative: \u00abpinza de rodillos\u00bb, \u00abgripper de rodillo\u00bb."},{"lang":"es-419","term":"separador","en":"tube picker","note":"Alternatives: \u00abalimentador\u00bb, \u00abpicker\u00bb."},{"lang":"es-419","term":"sensor de horquilla","en":"fork sensor (Gabellichtschranke)","note":"Alternative: \u00absensor tipo horquilla\u00bb."},{"lang":"es-419","term":"alivio de tensi\u00f3n","en":"strain relieve","note":"Alternative: \u00abrelajaci\u00f3n\u00bb."},{"lang":"es-419","term":"preestirado","en":"prestretching","note":"Alternative: \u00abpre-estiramiento\u00bb."},{"lang":"es-419","term":"tolva","en":"hopper","note":"Alternative: \u00abcargador\u00bb, \u00abalmac\u00e9n de tubos\u00bb."},{"lang":"es-419","term":"banda","en":"belt","note":"Mexican usage; \u00abcorrea\u00bb elsewhere in Latin America."}]};
const UI = KB.ui; const IMGS = KB.images||{};
const LANGS = KB.langs||[{id:"en",label:"English"}]; const TR = KB.tr||{}; const RV = KB.review||[];
let LANG="en"; try{ const l=localStorage.getItem("tt.lang."+KB.lines[0].id); if(l&&LANGS.some(x=>x.id===l)) LANG=l; }catch(e){}
const T = s => { if(s==null) return ""; s=String(s); const d=TR[LANG]; return (d&&d[s])||s; };
const hl = html => { const terms=RV.filter(r=>r.lang===LANG); if(!terms.length) return html; for(const r of terms){ const re=new RegExp("(^|[^\\wäöüÄÖÜßáéíóúñÁÉÍÓÚÑ])("+r.term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\wäöüÄÖÜßáéíóúñÁÉÍÓÚÑ])","gi"); html=html.replace(re,(m,a,b)=>`${a}<mark class="rv" title="${esc("EN: "+r.en+" — "+r.note)}">${b}</mark>`);} return html; };
const tx = s => hl(esc(T(s)));
const SECTIONS_OF = l=>l.sections||KB.sections;
const fig = (im,cls="ph")=>im&&IMGS[im.id]?`<figure class="${cls}"><img src="${IMGS[im.id]}" alt="${esc(im.caption||"")}" loading="lazy"><figcaption>${esc(im.caption||"")}</figcaption></figure>`:"";
const code = (p,k)=>UI.codeStyle==="numeric"?p+k:k;
const svcText = ()=>T(UI.serviceP).replace("{contact}",UI.supportContact);
const state = {line:KB.lines[0].id, view:"wizard", mode:"operator", defect:null, idx:0, log:[]};
document.title=UI.title; document.getElementById("appTitle").textContent=UI.title; document.getElementById("appOrg").textContent=UI.org;
try{ const m=localStorage.getItem("tt.mode."+KB.lines[0].id); if(m) state.mode=m; }catch(e){}

const line = ()=>KB.lines.find(l=>l.id===state.line);
const defect = ()=>line().defects.find(d=>d.id===state.defect);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const internal = ()=>state.mode==="internal";
const $ = id=>document.getElementById(id);

function renderTop(){
  $("lineCtl").hidden = KB.lines.length<2;
  $("langCtl").hidden = LANGS.length<2;
  $("langSeg").innerHTML = LANGS.map(l=>`<button data-lang="${l.id}" aria-pressed="${l.id===LANG}">${esc(l.label)}</button>`).join("");
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T(el.dataset.t); });
  document.title = T(UI.title); document.getElementById("appTitle").textContent = T(UI.title);
  $("lineSeg").innerHTML = KB.lines.map(l=>{
    const empty = !l.defects.length;
    return `<button data-line="${l.id}" aria-pressed="${l.id===state.line}" ${empty?"disabled title='Content not yet loaded'":""}>${esc(l.name)}${empty?'<span class="tag">SOON</span>':""}</button>`;
  }).join("");
  document.querySelectorAll("#viewSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===state.view));
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===state.mode));
  $("foot").innerHTML = `${T("Source:")} ${tx(line().source)}. ${internal()?T("Internal mode shows source code references and service-level repair steps."):T("If the guided steps don't resolve the problem, contact")+" "+tx(UI.supportName)+" "+T("with the summary the tool prepares for you.")}`;
}

function renderPicker(){
  const L=line(); const SECTIONS=SECTIONS_OF(L);
  let html = `<header><h2>${tx(UI.pickerTitle)}</h2><p>${tx(UI.pickerHelp)}</p></header>`;
  let n=0;
  for(const sec of Object.keys(SECTIONS)){
    const ds=L.defects.filter(d=>d.section===sec); if(!ds.length) continue;
    html += `<div class="group"><div class="eyebrow">${tx(SECTIONS[sec])}</div>`+
      ds.map(d=>{ n++; return `<button class="defect" data-defect="${d.id}" aria-current="${d.id===state.defect}"><span class="n">${internal()? (sec[0].toUpperCase()+n):"&#9656;"}</span><span>${tx(d.name)}</span></button>`;}).join("")+`</div>`;
  }
  const cur=L.defects.find(d=>d.id===state.defect);
  html = (cur?`<div class="pcompact"><div><span class="eyebrow">${T("Problem")}</span><b>${tx(cur.name)}</b></div><button class="btn small" data-act="clear">${T("Change")}</button></div>`:"")+html;
  $("picker").innerHTML = html;
  document.body.classList.toggle("has-defect", !!cur && state.view==="wizard");
}

function renderMain(){
  if(state.view==="ref") return renderRef();
  const d=defect();
  if(!d){
    $("main").innerHTML = `<section class="card"><div class="card-b intro">
      <div class="eyebrow">${esc(line().name)} · ${tx(UI.introEyebrow)}</div>
      <h2>${tx(UI.introH2)}</h2>
      <p>${tx(UI.introP)}</p>
      <ol>${UI.introTips.map(t=>`<li>${tx(t)}</li>`).join("")}</ol>
      </div></section>`;
    return;
  }
  const L=line(), n=d.causes.length, SECTIONS=SECTIONS_OF(L), STEP=T(L.stepLabel||"Cause");
  const rail = `<div class="rail">`+d.causes.map((c,i)=>{const r=state.log[i]; return `<span class="${i===state.idx&&state.idx<n?"cur":r?"done-"+r:""}" title="${esc(c.cause)}"></span>`;}).join("")+`</div>`;
  const head = `<div class="card-h"><div><div class="eyebrow">${tx(SECTIONS[d.section])}</div><h2>${tx(d.name)}</h2><div class="meta">${n} ${T((L.stepLabel||"Cause")==="Cause"?"potential causes, most likely first":"adjustments, in the order to try them")}</div></div>
     <button class="btn quiet small refbtn" data-act="restart">${T("Start over")}</button></div>`;

  if(state.idx>=n) return renderOutcome(d, head);
  const c=d.causes[state.idx];
  const svc = c.level==="service" && !internal();
  let j=state.idx; // every cause is its own step (service-level causes show a contact-service card in Operator mode)
  const span=j-state.idx+1;
  const cautions = svc?"":c.cautions.map(k=>`<div class="caution"><b>${T("Caution")}${internal()?" "+code("C",k):""}</b><span>${tx(L.cautions[k])}</span></div>`).join("");
  const steps = svc?`<div class="svc"><b>${tx(UI.supportName)}${T("item.").startsWith("-")||T("item.").startsWith("—")?T("item."):" "+T("item.")}</b> ${hl(esc(svcText()))}</div>`:`<div class="eyebrow">${tx(L.stepsHeading||"Check and adjust")}</div><ol class="steps">${c.remedies.map((k,i)=>`<li><span class="k">${c.remedies.length>1?i+1:"→"}</span><div><p>${tx(L.remedies[k])}</p>${internal()?`<span class="code">Code ${code("D",k)}</span>`:""}${c.image?fig(c.image):""}</div></li>`).join("")}</ol>`;
  const note = c.note?`<p class="note">${tx(c.note)}</p>`:"";
  const intro = state.idx===0&&(d.desc||(d.images||[]).length)?`<p class="desc">${tx(d.desc||"")}</p><div class="phrow">${(d.images||[]).map(im=>fig(im)).join("")}</div>`:"";
  const intNote = internal()&&c.internal?`<div class="int"><span class="eyebrow">${T("MSI internal note")}</span>${esc(c.internal)}</div>`:"";
  $("main").innerHTML = `<section class="card">${head}${rail}<div class="card-b">
    <div class="step-label"><span class="eyebrow">${STEP}${span>1?"s":""} ${state.idx+1}${span>1?"–"+(j+1):""} of ${n}</span><span class="eyebrow" style="color:var(--ink-3)">${internal()?c.remedies.map(k=>code("D",k)).join(", ")+(c.cautions.length?" · "+c.cautions.map(k=>code("C",k)).join(", "):""):""}</span></div>
    ${intro}<div class="cause">${tx(c.cause)}${c.level==="service"?`<span class="lvl">${T("service")}</span>`:""}</div>
    ${note}${cautions}
    ${steps}${intNote}
    <div class="ask"><h3>${svc?T("Did MSI Service resolve it, or do you want to move on?"):tx(L.askQuestion||UI.askQuestion)}</h3>
      <div class="btns"><button class="btn ok" data-act="yes" data-span="${span}">${T("Yes, fixed")}</button><button class="btn primary" data-act="no" data-span="${span}">${T((L.stepLabel||"Cause")==="Cause"?"No, next cause":"No, next adjustment")}</button><button class="btn quiet" data-act="skip" data-span="${span}">${T("Not applicable, skip")}</button>${state.idx>0?`<button class="btn quiet" data-act="back">${T("Back")}</button>`:""}</div></div>
  </div></section>`;
}

function summaryText(d){
  const lines=[`MSI ${T(UI.title)} — ${T("support summary")}`,`${T("Machine line:")} ${line().name}`,`${T("Problem:")} ${T(d.name)} (${T(SECTIONS_OF(line())[d.section])})`,`${T("Date:")} ${new Date().toLocaleString()}`,``,T("Steps worked through:")];
  d.causes.forEach((c,i)=>{const r=state.log[i]; if(!r) return; lines.push(`  ${i+1}. ${T(c.cause)} — ${r==="yes"?T("FIXED"):r==="no"?T("tried, not fixed"):T("skipped / not applicable")}`);});
  lines.push(``,T(UI.summaryExtra));
  return lines.join("\n");
}

function renderOutcome(d, head){
  const fixedIdx = state.log.indexOf("yes");
  const logHtml = `<ul class="log">`+d.causes.map((c,i)=>{const r=state.log[i]; if(!r) return ""; return `<li><span class="pill ${r}">${T(r==="yes"?"fixed":r==="no"?"no change":"skipped")}</span><span>${tx(c.cause)}</span></li>`;}).join("")+`</ul>`;
  const body = fixedIdx>=0
    ? `<div class="outcome good"><div class="eyebrow">${T("Resolved")}</div><h2>${T("Resolved — cause:")} ${tx(d.causes[fixedIdx].cause)}</h2><p>${tx(UI.resolvedP)} ${T("If the problem returns, start here first.")}</p>${logHtml}</div>`
    : `<div class="outcome escalate"><div class="eyebrow">${T("Not resolved")}</div><h2>${T("All listed causes tried without resolving the problem")}</h2><p>${tx(UI.escalateP)}</p>${logHtml}
       <div class="summary"><div class="eyebrow">${T("Support summary (copy and send)")}</div><textarea id="sum" readonly>${esc(summaryText(d))}</textarea><div class="btns" style="margin-top:8px"><button class="btn primary small" data-act="copy">${T("Copy summary")}</button></div></div>
       <div class="support"><b>${tx(UI.supportName)}</b> — ${UI.supportContact.includes("@")?`<a href="mailto:${esc(UI.supportContact)}?subject=${encodeURIComponent(T(UI.title)+": "+T(d.name))}&body=${encodeURIComponent(summaryText(d))}" style="color:var(--accent)">${esc(UI.supportContact)}</a>`:esc(UI.supportContact)}</div></div>`;
  $("main").innerHTML = `<section class="card">${head}${body}<div class="card-b" style="border-top:1px solid var(--line)"><div class="btns"><button class="btn" data-act="restart">${T("Troubleshoot this problem again")}</button><button class="btn quiet" data-act="clear">${T("Choose another problem")}</button></div></div></section>`;
}

function renderRef(){
  const L=line(); const SECTIONS=SECTIONS_OF(L);
  const groups = Object.keys(SECTIONS).map(sec=>{
    const ds=L.defects.filter(d=>d.section===sec); if(!ds.length) return "";
    return ds.map(d=>`<details class="d" ${d.id===state.defect?"open":""} id="ref-${d.id}"><summary>${tx(d.name)}<span class="sec">${tx(SECTIONS[sec])}</span></summary>
      ${d.desc||(d.images||[]).length?`<div class="card-b" style="padding-top:0"><p class="desc">${tx(d.desc||"")}</p><div class="phrow">${(d.images||[]).map(im=>fig(im)).join("")}</div></div>`:""}<div class="tblwrap"><table><thead><tr><th>${T(L.stepLabel||"Potential cause")}</th><th>${T(L.stepLabel?"What to do and why":"Remedy")}</th><th>${T("Cautions")}</th></tr></thead><tbody>`+
      d.causes.map(c=>{const svc=c.level==="service"&&!internal(); return `<tr><td>${tx(c.cause)}${c.level==="service"?`<span class="lvl">${T("service")}</span>`:""}${c.note?`<div style="font-weight:400;font-style:italic;color:var(--ink-3);font-size:.8rem;margin-top:4px">${tx(c.note)}</div>`:""}</td><td>${svc?`<span style="color:var(--ink-2)">${tx(UI.supportName)} — ${hl(esc(svcText()))}</span>`:`<ul>${c.remedies.map(k=>`<li>${internal()?`<span class="c">${code("D",k)}</span>`:""}${tx(L.remedies[k])}</li>`).join("")}</ul>`}</td><td>${svc?"":c.cautions.map(k=>`<div style="margin:2px 0">${internal()?`<span class="c">${code("C",k)}</span>`:""}${tx(L.cautions[k])}</div>`).join("")||"<span style='color:var(--ink-3)'>—</span>"}</td></tr>`;}).join("")+
      `</tbody></table></div><div class="card-b" style="padding-top:8px"><button class="btn small primary" data-goto="${d.id}">${T("Run guided fix for this problem")}</button></div></details>`).join("");
  }).join("");
  const rvl = RV.filter(r=>r.lang===LANG); const review = rvl.length?`<details class="d" open><summary>Terminology under review<span class="sec">${esc(LANGS.find(l=>l.id===LANG).label)}</span></summary><div class="rvlist"><div style="color:var(--ink-2);grid-column:1/-1">Highlighted terms are translation judgment calls for MSI's native-speaking team to confirm. Hover a highlight anywhere in the app to see the English term and the alternatives.</div>${rvl.map(r=>`<div><b><mark class="rv">${esc(r.term)}</mark></b><span><span class="en">EN: ${esc(r.en)}</span> — ${esc(r.note)}</span></div>`).join("")}</div></details>`:"";
  const gl = (L.glossary||[]); const glossary = gl.length?`<details class="d"><summary>${T("Tip types, tooling, parameters and materials")}<span class="sec">${T("glossary")}</span></summary>${[...new Set(gl.map(g=>g.group))].map(grp=>`<div class="gl-h eyebrow">${esc(grp)}</div><div class="gl">${gl.filter(g=>g.group===grp).map(g=>`<div class="g">${g.image&&IMGS[g.image]?`<img src="${IMGS[g.image]}" alt="${esc(g.term)}" loading="lazy">`:""}<div><b>${tx(g.term)}</b>${tx(g.text)}</div></div>`).join("")}</div>`).join("")}</details>`:"";
  const gloss = internal()?`<details class="d"><summary>${T("Code glossary")}<span class="sec">${T("internal")}</span></summary><div class="gloss"><div class="eyebrow" style="grid-column:1/-1">${T("Diagnostic codes")}</div>${Object.entries(L.remedies).map(([k,v])=>`<div><b>${code("D",k)}</b><span>${tx(v)}</span></div>`).join("")}<div class="eyebrow" style="grid-column:1/-1;margin-top:10px">${T("Caution codes")}</div>${Object.entries(L.cautions).map(([k,v])=>`<div><b>${code("C",k)}</b><span>${tx(v)}</span></div>`).join("")}</div></details>`:"";
  $("main").innerHTML = `<section class="card ref"><div class="card-h"><div><div class="eyebrow">${esc(L.name)} · ${T("reference")}</div><h2>${tx(UI.refTitle)}</h2><div class="meta">${L.defects.length} ${T("problem descriptions")} · ${L.defects.reduce((a,d)=>a+d.causes.length,0)} ${T(L.stepLabel?"adjustments":"cause/remedy pairs")} · ${tx(L.source)}</div></div></div><div class="card-b">${groups}${glossary}${gloss}${review}</div></section>`;
  if(state.defect){const el=$("ref-"+state.defect); if(el) el.scrollIntoView({block:"start",behavior:"smooth"});}
}

function render(){ renderTop(); renderPicker(); renderMain(); location.hash = state.defect?`${state.line}/${state.defect}`:state.line; }
function choose(id){ state.defect=id; state.idx=0; state.log=[]; if(state.view==="ref") state.view="wizard"; render(); toMain(); }
function toMain(){ if(window.innerWidth<=860){ const m=$("main"); const y=m.getBoundingClientRect().top+window.scrollY-(document.querySelector(".top").offsetHeight+10); window.scrollTo({top:Math.max(0,y),behavior:"smooth"}); } else window.scrollTo({top:0,behavior:"smooth"}); }

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.line){ state.line=b.dataset.line; state.defect=null; state.idx=0; state.log=[]; render(); }
  else if(b.dataset.lang){ LANG=b.dataset.lang; try{localStorage.setItem("tt.lang."+KB.lines[0].id,LANG)}catch(x){} render(); }
  else if(b.dataset.view){ state.view=b.dataset.view; render(); }
  else if(b.dataset.mode){ state.mode=b.dataset.mode; try{localStorage.setItem("tt.mode."+KB.lines[0].id,state.mode)}catch(x){} render(); }
  else if(b.dataset.defect){ choose(b.dataset.defect); }
  else if(b.dataset.goto){ choose(b.dataset.goto); }
  else if(b.dataset.act){
    const a=b.dataset.act;
    if(a==="yes"||a==="no"||a==="skip"){ const sp=+(b.dataset.span||1); for(let q=0;q<sp;q++) state.log[state.idx+q]=a; state.idx = a==="yes"?defect().causes.length:state.idx+sp; renderMain(); toMain(); }
    else if(a==="back"){ state.idx=Math.max(0,state.idx-1); state.log.length=state.idx; renderMain(); }
    else if(a==="restart"){ state.idx=0; state.log=[]; renderMain(); }
    else if(a==="clear"){ state.defect=null; state.idx=0; state.log=[]; render(); }
    else if(a==="copy"){ const t=$("sum"); t.select(); try{ navigator.clipboard.writeText(t.value); b.textContent=T("Copied"); setTimeout(()=>b.textContent=T("Copy summary"),1500);}catch(x){ document.execCommand("copy"); } }
  }
});

// deep link: #plasticweld/defect-id
(function(){ const h=location.hash.replace("#","").split("/"); if(h[0]&&KB.lines.some(l=>l.id===h[0]&&l.defects.length)) state.line=h[0]; if(h[1]&&line().defects.some(d=>d.id===h[1])) state.defect=h[1]; })();
render();
</script>
